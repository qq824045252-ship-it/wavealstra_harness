packages:
  - 'app/*'
  - 'shared'

shamefullyHoist: true
verifyDepsBeforeRun: false

# electron-builder 26.15 uses ElectronDownloadCacheMode, added in get 3.1.
overrides:
  'app-builder-lib@26.15.3>@electron/get': '3.1.0'

allowBuilds:
  electron: true
  better-sqlite3: true
  esbuild: true
  electron-winstaller: true
  lzma-native: true
  protobufjs: true
  '@google/genai': true
  node-pty: true
  onnxruntime-node: true

patchedDependencies:
  node-pty: patches/node-pty.patch
  'command-code-acp@0.1.1': patches/command-code-acp@0.1.1.patch
  '@ovftank/agy-acp@0.1.0': patches/@ovftank__agy-acp@0.1.0.patch
  '@earendil-works/pi-ai@0.99.1': patches/@earendil-works__pi-ai@0.99.1.patch
  '@earendil-works/pi-coding-agent@0.99.1': patches/@earendil-works__pi-coding-agent@0.99.1.patch

minimumReleaseAgeExclude:
  - '@earendil-works/pi-ai@0.99.1'
  - '@earendil-works/pi-telemetry@0.99.1'
  - '@earendil-works/chord@0.99.1'
  - '@earendil-works/pi-agent-core@0.99.1'
  - '@earendil-works/pi-coding-agent@0.99.1'
  - '@earendil-works/pi-tui@0.99.1'
  - '@earendil-works/pi-codemode@0.99.1'
  - '@earendil-works/pi-mcp@0.99.1'
