<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="310" viewBox="0 0 1020 310"><rect width="1020" height="310" fill="#f7fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24547d"/></marker></defs><text x="26" y="32" font-family="sans-serif" font-size="20" fill="#132f46">已验证：目标任务的调用元数据关联</text><g font-family="sans-serif" fill="#132f46"><rect x="26" y="66" width="286" height="122" rx="9" fill="#e8f2fb" stroke="#24547d"/><text x="42" y="92" font-size="17">MyBuddy assistant.message.usage</text><text x="42" y="121" font-size="15">38 条：input / cacheRead / output</text><text x="42" y="149" font-size="15">input 不含 cacheRead</text><text x="42" y="174" font-size="14">原 task 的会话 JSONL，只读</text><rect x="366" y="66" width="280" height="122" rx="9" fill="#e8f2fb" stroke="#24547d"/><text x="382" y="92" font-size="17">Magpie usage.jsonl</text><text x="382" y="121" font-size="15">38 条唯一匹配，session 直接吻合</text><text x="382" y="149" font-size="15">providerAccount：同一 SHA-256</text><text x="382" y="174" font-size="14">in / cache_read / out / route_id</text><rect x="700" y="66" width="292" height="122" rx="9" fill="#e8f2fb" stroke="#24547d"/><text x="716" y="92" font-size="17">routing/2026-11-02.jsonl</text><text x="716" y="121" font-size="15">每条 order=1，tries=1，net.asks=1</text><text x="716" y="149" font-size="15">全部 status=200，未见账号变更</text><text x="716" y="174" font-size="14">prompt 仅分块名称与 token 数</text><path d="M312 131H360" stroke="#24547d" stroke-width="2" marker-end="url(#arrow)"/><path d="M646 131H694" stroke="#24547d" stroke-width="2" marker-end="url(#arrow)"/><text x="26" y="230" font-size="16">calls-v15：1174 shards / 1184 frames / 28680 calls，CRC 与 gob 解码全部通过；目标窗口 / task 均 0 条。</text><text x="26" y="260" font-size="15">边界：这些持久化数据没有 prompt_cache_key 与原始 input 项；不能据此恢复它们的真实哈希。</text><text x="26" y="286" font-size="14">masking_ms=16–171 仅证明记录了耗时；是否改变正文需实现侧证据。所有账号、名称、路径均已脱敏。</text></g></svg>