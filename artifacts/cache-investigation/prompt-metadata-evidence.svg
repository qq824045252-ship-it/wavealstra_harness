<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="465" viewBox="0 0 1120 465"><rect width="1120" height="465" fill="#f8fafc"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24547d"/></marker></defs><g font-family="sans-serif" fill="#183349"><text x="24" y="33" font-size="21">routing.prompt 元数据：比值稳定；始终只有一个额外用户轮</text><rect x="24" y="60" width="310" height="142" rx="8" fill="#e8f2fb" stroke="#517a99"/><text x="40" y="87" font-size="17">聚合body估计（非正文哈希）</text><text x="40" y="117" font-size="15">system：1个显示项</text><text x="40" y="143" font-size="15">tools：24个显示项，other.N=25</text><text x="40" y="169" font-size="15">name/tag/N 集合：38条全部一致</text><text x="40" y="191" font-size="13">skills / memory 分类全未出现</text><path d="M335 130H383" fill="none" stroke="#24547d" stroke-width="2" marker-end="url(#a)"/><rect x="390" y="60" width="304" height="142" rx="8" fill="#fff" stroke="#517a99"/><text x="406" y="87" font-size="17">calibrate 统一缩放</text><text x="406" y="117" font-size="15">scale = counted / estimated</text><text x="406" y="143" font-size="15">各part/item取整；最大part收残差</text><text x="406" y="169" font-size="15">比值可消除共同scale</text><text x="406" y="191" font-size="13">诊断保留了取整误差区间</text><path d="M696 130H744" fill="none" stroke="#24547d" stroke-width="2" marker-end="url(#a)"/><rect x="750" y="60" width="346" height="142" rx="8" fill="#e8f6ed" stroke="#427a59"/><text x="766" y="87" font-size="17">38条结果与估计大小恒定相容</text><text x="766" y="117" font-size="15">system/tools：0.543215–0.543302</text><text x="766" y="143" font-size="15">相对波幅：0.016045%</text><text x="766" y="169" font-size="15">共同区间：0.54324664–0.54326649</text><text x="766" y="191" font-size="13">24/24工具item比值也有共同可行值</text><text x="24" y="242" font-size="18">轮次按原会话role=user计数核对；每个阶段最后一轮大小可由恒定估计解释</text><g font-size="16"><rect x="24" y="260" width="254" height="100" rx="7" fill="#fff" stroke="#9db1c0"/><text x="40" y="287">原用户1轮 → prompt.turns=2</text><text x="40" y="315">21次调用，额外轮不累积</text><text x="40" y="342">前一轮tokens：48 → 14074</text><rect x="296" y="260" width="254" height="100" rx="7" fill="#fff" stroke="#9db1c0"/><text x="312" y="287">原用户2轮 → prompt.turns=3</text><text x="312" y="315">6次调用，额外轮不累积</text><text x="312" y="342">前一轮tokens：16 → 1426</text><rect x="568" y="260" width="254" height="100" rx="7" fill="#fff" stroke="#9db1c0"/><text x="584" y="287">原用户3轮 → prompt.turns=4</text><text x="584" y="315">5次调用，额外轮不累积</text><text x="584" y="342">前一轮tokens：17 → 1823</text><rect x="840" y="260" width="256" height="100" rx="7" fill="#fff" stroke="#9db1c0"/><text x="856" y="287">原用户4轮 → prompt.turns=5</text><text x="856" y="315">6次调用，额外轮不累积</text><text x="856" y="342">前一轮tokens：7 → 1826</text></g><text x="24" y="397" font-size="15">结构推断：与“重建input时追加一次临时尾部用户capsule”相容；未恢复capsule正文或wire input数组。</text><text x="24" y="426" font-size="14">边界：promptOf读取body，masked另存；无法排除后续转换、脱敏或等估计长度文本变化。比值不是字节哈希。</text><text x="24" y="450" font-size="13">来源：本机routing/2026-11-02.jsonl的目标38条聚合 + 原会话role计数；原数据只读，无网络请求。</text></g></svg>