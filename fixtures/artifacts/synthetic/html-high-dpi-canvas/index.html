<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HTML High-DPI Canvas Fixture</title>
<style>
  body { margin: 16px; font: 13px/1.5 system-ui, sans-serif; color: #334155; }
  h1 { font-size: 18px; }
  h2 { font-size: 14px; color: #475569; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; }
  .card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; background: #fff; }
  canvas { border: 1px solid #e2e8f0; background: #fff; }
  .bad { filter: blur(0.4px); } /* 非 DPR 感知画布在放大时模糊，对比用 */
</style>
</head>
<body>
<h1>High-DPI Canvas Fixture（V3.5 §28 / §51 DPR matrix）</h1>
<p>三块画布并排：<b>DPR 感知</b>（backing store = 逻辑尺寸 × devicePixelRatio）、
<b>非感知</b>（1× backing store，DPR&gt;1 时浏览器放大模糊）、
<b>感知 + 矢量文字</b>。Golden 截图用于核对 Canvas 清晰度随 DPR 矩阵变化。</p>

<div class="row">
  <div class="card"><h2>① DPR 感知（正确）</h2>
    <canvas id="sharp" width="360" height="240"></canvas>
  </div>
  <div class="card"><h2>② 非感知（1×，模糊）</h2>
    <canvas id="blurry" width="360" height="240"></canvas>
  </div>
  <div class="card"><h2>③ DPR 感知 + 细线/文字</h2>
    <canvas id="text" width="360" height="240"></canvas>
  </div>
</div>

<script>
(function () {
  function setup(canvas, dpr) {
    var w = parseInt(canvas.getAttribute("width"), 10);
    var h = parseInt(canvas.getAttribute("height"), 10);
    if (dpr > 1) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
    }
    var ctx = canvas.getContext("2d");
    if (dpr > 1) ctx.scale(dpr, dpr);
    return { ctx: ctx, w: w, h: h };
  }

  function drawGrid(ctx, w, h) {
    ctx.strokeStyle = "#e2e8f0";
    ctx.lineWidth = 1;
    for (var x = 0; x <= w; x += 20) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (var y = 0; y <= h; y += 20) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  }

  function drawChart(ctx, w, h, color) {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, w, h);
    drawGrid(ctx, w, h);
    // 1px 精确边框（DPR 感知时 1 CSS px = dpr backing px，锐利）
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, w - 1, h - 1);
    // 圆环
    ctx.beginPath();
    ctx.arc(w * 0.3, h * 0.45, 40, 0, Math.PI * 2);
    ctx.strokeStyle = color;
    ctx.lineWidth = 8;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(w * 0.3, h * 0.45, 26, 0, Math.PI * 1.5);
    ctx.strokeStyle = "#94a3b8";
    ctx.lineWidth = 8;
    ctx.stroke();
    // 柱条
    for (var i = 0; i < 5; i++) {
      var bh = 30 + Math.sin(i * 1.3) * 25;
      ctx.fillStyle = i % 2 ? color : "#94a3b8";
      ctx.fillRect(w * 0.55 + i * 24, h * 0.75 - bh, 16, bh);
    }
  }

  function drawText(ctx, w, h, dpr) {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, w, h);
    drawGrid(ctx, w, h);
    ctx.fillStyle = "#0f172a";
    ctx.font = "600 16px system-ui, sans-serif";
    ctx.fillText("DPR = " + (dpr || 1).toFixed(2) + "  backing " + (w * (dpr || 1)) + "×" + (h * (dpr || 1)), 16, 30);
    ctx.fillStyle = "#2563eb";
    ctx.font = "12px system-ui, sans-serif";
    for (var i = 0; i < 6; i++) {
      ctx.fillText("清晰文本行 " + (i + 1) + " · 1px 线宽", 16, 60 + i * 28);
    }
    ctx.strokeStyle = "#dc2626";
    ctx.lineWidth = 1;
    for (var j = 0; j < 6; j++) {
      ctx.beginPath();
      ctx.moveTo(w * 0.55, 55 + j * 28);
      ctx.lineTo(w * 0.55 + 120, 55 + j * 28);
      ctx.stroke();
    }
  }

  var dpr = window.devicePixelRatio || 1;
  var a = setup(document.getElementById("sharp"), dpr);
  drawChart(a.ctx, a.w, a.h, "#2563eb");

  var b = setup(document.getElementById("blurry"), 1);
  drawChart(b.ctx, b.w, b.h, "#dc2626");

  var c = setup(document.getElementById("text"), dpr);
  drawText(c.ctx, c.w, c.h, dpr);
})();
</script>
</body>
</html>
