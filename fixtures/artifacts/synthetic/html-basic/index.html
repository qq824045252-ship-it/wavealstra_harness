<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HTML Basic Fixture</title>
<style>
  :root { --accent: #2563eb; --bg: #f8fafc; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 system-ui, sans-serif; background: var(--bg); color: #1e293b; }
  header { background: var(--accent); color: #fff; padding: 16px 24px; }
  main { padding: 24px; max-width: 720px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; margin: 12px 0; }
  button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; }
  button.primary:hover { filter: brightness(1.1); }
  input, select { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
  .badge { display: inline-block; background: #dcfce7; color: #15803d; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
</style>
</head>
<body>
<header><h1>HTML Basic Fixture</h1><span class="badge">synthetic</span></header>
<main>
  <div class="card">
    <h2>表单控件</h2>
    <label>用户名 <input type="text" placeholder="输入用户名"></label>
    <label> 级别
      <select><option>标准</option><option>高级</option></select>
    </label>
    <button class="primary" id="submit">提交</button>
    <p id="status">等待操作…</p>
  </div>
  <div class="card">
    <h2>列表</h2>
    <ul>
      <li>普通列表项</li>
      <li><strong>加粗</strong>与 <em>斜体</em> 混排</li>
      <li>内联 <code>code</code> 样式</li>
    </ul>
  </div>
  <script>
    document.getElementById("submit").addEventListener("click", function () {
      var el = document.getElementById("status");
      el.textContent = "已点击：" + new Date().toLocaleTimeString();
      el.style.color = "#15803d";
    });
  </script>
</main>
</body>
</html>
