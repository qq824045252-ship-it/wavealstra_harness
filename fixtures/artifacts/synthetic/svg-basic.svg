<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <!-- svg-basic：基础 SVG 渲染行为基线（V3.5 §28 / §35 页面级验证） -->
  <title>SVG Basic Fixture</title>
  <rect x="0" y="0" width="640" height="420" fill="#f8fafc" rx="12"/>
  <text x="24" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#0f172a">SVG Basic — 形状 / 路径 / 文本 / 变换</text>

  <!-- 基础形状 -->
  <rect x="40" y="80" width="120" height="80" rx="10" fill="#2563eb"/>
  <circle cx="230" cy="120" r="40" fill="#10b981"/>
  <ellipse cx="340" cy="120" rx="55" ry="32" fill="#f59e0b"/>
  <polygon points="440,80 520,80 480,160" fill="#8b5cf6"/>
  <line x1="560" y1="80" x2="600" y2="160" stroke="#dc2626" stroke-width="3"/>

  <!-- 路径：贝塞尔 + 弧 -->
  <path d="M 40 220 Q 100 160 160 220 T 280 220" fill="none" stroke="#0ea5e9" stroke-width="3"/>
  <path d="M 320 220 A 50 30 0 0 1 420 220" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- 变换：旋转 + 缩放 -->
  <g transform="translate(120 300) rotate(-15)">
    <rect x="-60" y="-30" width="120" height="60" rx="6" fill="#f472b6" opacity="0.85"/>
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">rotate</text>
  </g>
  <g transform="translate(320 320) scale(1.4)">
    <circle r="28" fill="#34d399"/>
  </g>

  <!-- 文本样式 -->
  <text x="420" y="330" font-family="serif" font-size="16" font-style="italic" fill="#475569">italic serif</text>
  <text x="420" y="356" font-family="monospace" font-size="14" font-weight="bold" fill="#0f172a">monospace bold</text>
  <text x="420" y="382" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" letter-spacing="2">LETTER SPACING</text>
</svg>
