<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保护海洋 · 别让海洋只剩眼泪</title>
<style>
  :root {
    --ink: #f2f7ff;
    --muted: #a5c6e8;
    --accent: #ffd166;
    --coral: #ff7b5f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", sans-serif;
    background: #020f24;
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  /* ============ 海报画布 1080×1620 (2:3) ============ */
  .poster {
    position: relative;
    width: 1080px;
    max-width: 100%;
    aspect-ratio: 2 / 3;
    overflow: hidden;
    border-radius: 18px;
    color: var(--ink);
    background:
      radial-gradient(120% 80% at 78% -12%, rgba(30, 120, 220, .55) 0%, transparent 55%),
      radial-gradient(90% 60% at 12% 26%, rgba(16, 80, 160, .5) 0%, transparent 60%),
      linear-gradient(180deg, #06305f 0%, #062b57 42%, #031a38 100%);
    box-shadow: 0 30px 90px rgba(0, 0, 0, .55);
  }

  /* ============ 气泡 ============ */
  .bubble {
    position: absolute;
    bottom: -60px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, rgba(255, 255, 255, .4), rgba(255, 255, 255, .06) 62%);
    animation: rise linear infinite;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0) scale(.9);   opacity: 0; }
    8%   { opacity: .85; }
    55%  { transform: translateY(-700px) translateX(18px) scale(1);  opacity: .55; }
    100% { transform: translateY(-1180px) translateX(-14px) scale(1.35); opacity: 0; }
  }

  /* ============ 背景鱼群 ============ */
  .fishes { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

  /* ============ 内容层 ============ */
  .content {
    position: relative;
    z-index: 5;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 60px 80px 190px; /* 底部留白覆盖波浪 */
  }

  /* 眉标 */
  .kicker {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 8px;
    color: var(--accent);
    padding: 10px 26px;
    border: 1.5px solid rgba(255, 209, 102, .55);
    border-radius: 999px;
  }

  /* 主标题 */
  .title {
    margin-top: 42px;
    font-size: clamp(40px, 8.4vw, 94px);
    line-height: 1.2;
    font-weight: 900;
    letter-spacing: 6px;
    text-shadow: 0 8px 30px rgba(0, 20, 60, .45);
  }
  .title .grad {
    display: block;
    background: linear-gradient(115deg, #8fd6ff 5%, #5aa8f0 45%, #ffd166 110%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* 副文案 */
  .sub {
    margin-top: 28px;
    max-width: 720px;
    font-size: 22px;
    line-height: 1.9;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .sub b { color: #fff; font-weight: 700; }

  /* 主视觉：鲸鱼 */
  .hero {
    margin-top: 24px;
    width: 58%;
    animation: floatY 6.5s ease-in-out infinite alternate;
    filter: drop-shadow(0 20px 40px rgba(0, 30, 80, .5));
  }
  @keyframes floatY { from { transform: translateY(0); } to { transform: translateY(-16px); } }

  /* 数据卡片 */
  .stats {
    margin-top: auto;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .stat {
    background: rgba(8, 40, 84, .55);
    border: 1px solid rgba(140, 195, 255, .18);
    border-radius: 18px;
    padding: 22px 14px 20px;
    backdrop-filter: blur(6px);
    transition: transform .3s ease, border-color .3s ease;
  }
  .stat:hover { transform: translateY(-6px); border-color: rgba(255, 209, 102, .5); }
  .stat b {
    display: block;
    font-size: 50px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1.1;
  }
  .stat span {
    display: block;
    margin-top: 10px;
    font-size: 17px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* 行动号召 */
  .actions { margin-top: 32px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .btn {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 4px;
    color: #fff;
    background: linear-gradient(135deg, var(--coral), #ffa15e);
    padding: 17px 54px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 12px 34px rgba(255, 123, 95, .38);
    transition: transform .25s ease, box-shadow .25s ease;
    user-select: none;
  }
  .btn:hover  { transform: translateY(-4px) scale(1.04); box-shadow: 0 18px 46px rgba(255, 123, 95, .55); }
  .btn:active { transform: translateY(-1px) scale(.99); }
  .tips { font-size: 18px; letter-spacing: 3px; color: var(--muted); }
  .tips i { font-style: normal; color: var(--accent); }

  /* 页脚 */
  .footer {
    margin-top: 24px;
    font-size: 16px;
    letter-spacing: 3px;
    color: rgba(165, 198, 232, .75);
  }

  /* ============ 底部波浪 ============ */
  .waves { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; z-index: 2; pointer-events: none; }
  .wave { position: absolute; left: 0; bottom: 0; width: 200%; height: 150px; animation: slide linear infinite; }
  .wave.w1 { animation-duration: 16s; }
  .wave.w2 { animation-duration: 22s; bottom: -30px; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* ============ 小屏适配 ============ */
  @media (max-width: 640px) {
    body { padding: 0; }
    .poster { border-radius: 0; }
    .content { padding: 36px 22px 190px; }
    .kicker { font-size: 15px; letter-spacing: 4px; padding: 8px 16px; }
    .title { letter-spacing: 2px; margin-top: 30px; }
    .sub { font-size: 16px; margin-top: 20px; }
    .hero { width: 76%; }
    .stats { grid-template-columns: 1fr; gap: 12px; }
    .stat { padding: 16px; }
    .stat b { font-size: 38px; }
    .btn { font-size: 20px; padding: 14px 36px; }
  }
</style>
</head>
