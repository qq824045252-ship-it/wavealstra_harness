packages:
  - 'app/*'
  - 'shared'

shamefullyHoist: true
verifyDepsBeforeRun: false

# electron-builder 26.15 uses ElectronDownloadCacheMode, added in get 3.1.
overrides:
  'app-builder-lib@26.15.3>@electron/get': '3.1.0'
  'vite>esbuild': '0.28.2'

allowBuilds:
  electron: true
  better-sqlite3: true
  esbuild: true
  electron-winstaller: true
  lzma-native: true
  protobufjs: true
  '@google/genai': true
  node-pty: true
  onnxruntime-node: true

patchedDependencies:
  node-pty: patches/node-pty.patch
  'command-code-acp@0.1.1': patches/command-code-acp@0.1.1.patch
  '@ovftank/agy-acp@0.1.0': patches/@ovftank__agy-acp@0.1.0.patch
  '@earendil-works/pi-ai@1.0.4': patches/@earendil-works__pi-ai@1.0.4.patch
  esbuild@0.28.2: patches/esbuild@0.28.2.patch
  '@earendil-works/pi-coding-agent@1.0.4': patches/@earendil-works__pi-coding-agent@1.0.4.patch

minimumReleaseAgeExclude:
  - '@earendil-works/pi-ai@1.0.4'
  - '@earendil-works/pi-telemetry@1.0.4'
  - '@earendil-works/chord@1.0.4'
  - '@earendil-works/pi-agent-core@1.0.4'
  - '@earendil-works/pi-coding-agent@1.0.4'
  - '@earendil-works/pi-tui@1.0.4'
  - '@earendil-works/pi-codemode@1.0.4'
  - '@earendil-works/pi-mcp@1.0.4'
  - '@agentclientprotocol/claude-agent-acp@0.85.0'
  - '@agentclientprotocol/codex-acp@2.1.1'
  - '@agentclientprotocol/sdk@1.6.0'
  - '@shikijs/core@4.5.0'
  - '@shikijs/engine-javascript@4.5.0'
  - '@shikijs/engine-oniguruma@4.5.0'
  - '@shikijs/langs@4.5.0'
  - '@shikijs/primitive@4.5.0'
  - '@shikijs/themes@4.5.0'
  - '@shikijs/types@4.5.0'
  - '@types/node@24.19.1'
  - katex@0.19.0
  - shiki@4.5.0
  - vite@8.3.2
