[package]
name = "mybuddy-runtime-audit"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "=0.22.1"
duckdb = { version = "=1.20001.0", features = ["bundled", "json"] }
flate2 = "=1.1.10"
icu_casemap = "=2.3.0"
icu_locale_core = "=2.3.0"
icu_normalizer = "=2.3.0"
icu_properties = "=2.3.0"
notify = { version = "=8.2.2", default-features = false }
regex-lite = "=0.1.9"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "api-24"] }
same-file = "=1.0.6"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "raw_value"] }
sha2 = "=0.10.9"
url = "=2.5.8"
zip = { version = "=9.7.2", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
strip = "symbols"
