<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" width="1080" height="760" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="1080" height="760" fill="#f6f8fc"/>

  <text x="32" y="40" font-size="21" font-weight="700" fill="#16233a">Bot 会话空白（消息不显示）— 事故链与修复</text>
  <text x="32" y="64" font-size="12.5" fill="#54657f">证据来源：~/.mybuddy/durable 两个真实目录 + 隔离副本中的真实 Electron 复现（2026-10-12）</text>

  <!-- 事故链 -->
  <rect x="32" y="84" width="600" height="470" rx="10" fill="#ffffff" stroke="#d7dfec"/>
  <text x="52" y="112" font-size="15" font-weight="700" fill="#b3261e">事故链（已验证）</text>

  <rect x="52" y="126" width="560" height="58" rx="8" fill="#fdf1f0" stroke="#f0c4c0"/>
  <text x="66" y="149" font-size="13.5" font-weight="700" fill="#7a1c16">① 两个 MyBuddy 实例共用 ~/.mybuddy</text>
  <text x="66" y="170" font-size="12.5" fill="#5b3a37">打包版 userData=wavealstra_harness、dev 版另一个 → 应用级单实例锁拦不住</text>

  <rect x="52" y="196" width="560" height="72" rx="8" fill="#fdf1f0" stroke="#f0c4c0"/>
  <text x="66" y="219" font-size="13.5" font-weight="700" fill="#7a1c16">② 两个写入者各自恢复同一 Bot 会话</text>
  <text x="66" y="240" font-size="12.5" fill="#5b3a37">pi-durable README：One process owns a storage at a time; there is no</text>
  <text x="66" y="258" font-size="12.5" fill="#5b3a37">cross-process locking. → 各自从 seq 405 继续提交</text>

  <rect x="52" y="280" width="560" height="88" rx="8" fill="#fdf1f0" stroke="#f0c4c0"/>
  <text x="66" y="303" font-size="13.5" font-weight="700" fill="#7a1c16">③ main.jsonl 出现重复 commit seq（实测）</text>
  <text x="66" y="324" font-size="12.5" fill="#5b3a37">会话「你好」：行410-413 = seq 406,407,408,409 再出现一次</text>
  <text x="66" y="343" font-size="12.5" fill="#5b3a37">会话「还是没有回」：行1063-1067 = seq 1058..1062 再出现一次</text>
  <text x="66" y="361" font-size="12.5" fill="#5b3a37">同一 seq 被两份内容占用：一个写入者写 task.sidecar 145，另一个写 doc.change 2</text>

  <rect x="52" y="380" width="560" height="72" rx="8" fill="#fdf1f0" stroke="#f0c4c0"/>
  <text x="66" y="403" font-size="13.5" font-weight="700" fill="#7a1c16">④ JsonlStorage.recover() 整目录拒绝打开</text>
  <text x="66" y="424" font-size="12.5" fill="#5b3a37">JsonlCorruptionError: Commit sequence does not strictly increase</text>
  <text x="66" y="442" font-size="12.5" fill="#5b3a37">in main.jsonl（storage.js:422 的严格递增不变量）</text>

  <rect x="52" y="464" width="560" height="76" rx="8" fill="#fdf1f0" stroke="#f0c4c0"/>
  <text x="66" y="487" font-size="13.5" font-weight="700" fill="#7a1c16">⑤ 界面静默显示成「空会话」</text>
  <text x="66" y="508" font-size="12.5" fill="#5b3a37">DurableBotService.history() 抛错 → appStore 的 .then 没有 .catch</text>
  <text x="66" y="526" font-size="12.5" fill="#5b3a37">→ messages=[] → ChatView 渲染「Bot 会话 / 消息接受后将显示在这里」</text>

  <path d="M332 184 L332 196" stroke="#c2413a" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M332 268 L332 280" stroke="#c2413a" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M332 368 L332 380" stroke="#c2413a" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M332 452 L332 464" stroke="#c2413a" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- 修复 -->
  <rect x="652" y="84" width="396" height="470" rx="10" fill="#ffffff" stroke="#d7dfec"/>
  <text x="672" y="112" font-size="15" font-weight="700" fill="#14653c">修复（已落地 + 已验证）</text>

  <rect x="672" y="126" width="356" height="112" rx="8" fill="#eef7f1" stroke="#bfe0cc"/>
  <text x="686" y="149" font-size="13.5" font-weight="700" fill="#14653c">防线 1 · 确定性日志修复</text>
  <text x="686" y="170" font-size="12" fill="#2f4a3c">DurableLogRepair.ts：保留首次出现的 seq，</text>
  <text x="686" y="188" font-size="12" fill="#2f4a3c">sidecar 仅保留被有效提交确认的 (seq, ordinal)；</text>
  <text x="686" y="206" font-size="12" fill="#2f4a3c">原文件整份备份到 repair-backup-&lt;时间戳&gt;/。</text>
  <text x="686" y="228" font-size="12" fill="#2f4a3c">实测：你好 2881 保留 / 丢 4；还是没有回 1291 / 丢 5</text>

  <rect x="672" y="248" width="356" height="112" rx="8" fill="#eef7f1" stroke="#bfe0cc"/>
  <text x="686" y="271" font-size="13.5" font-weight="700" fill="#14653c">防线 2 · 单写者租约（防复发）</text>
  <text x="686" y="292" font-size="12" fill="#2f4a3c">DurableStorageLease.ts：&lt;durable 目录&gt;/.mybuddy-owner.json</text>
  <text x="686" y="310" font-size="12" fill="#2f4a3c">持有者进程存活 → 第二个实例拒绝打开并给出原因；</text>
  <text x="686" y="328" font-size="12" fill="#2f4a3c">持有者已退出 → 自动接管，不会死锁；</text>
  <text x="686" y="346" font-size="12" fill="#2f4a3c">心跳节流 10s，随 refresh 刷新。</text>

  <rect x="672" y="370" width="356" height="112" rx="8" fill="#eef7f1" stroke="#bfe0cc"/>
  <text x="686" y="393" font-size="13.5" font-weight="700" fill="#14653c">防线 3 · 失败必须可见（fail loud）</text>
  <text x="686" y="414" font-size="12" fill="#2f4a3c">TaskHistoryDto.historyError + appStore .catch</text>
  <text x="686" y="432" font-size="12" fill="#2f4a3c">+ ChatView「会话记录打不开」区块；</text>
  <text x="686" y="450" font-size="12" fill="#2f4a3c">修复过日志时用 SessionHistoryRecoveryNotice</text>
  <text x="686" y="468" font-size="12" fill="#2f4a3c">告诉用户「已恢复 + 备份在哪」。</text>

  <rect x="672" y="492" width="356" height="48" rx="8" fill="#f2f5fb" stroke="#d7dfec"/>
  <text x="686" y="514" font-size="12.5" fill="#33415c">验证：packaged 0.1.24 复现失败 → 修复后同一副本</text>
  <text x="686" y="532" font-size="12.5" fill="#33415c">loadTaskHistory 返回 203 条消息并渲染出历史。</text>

  <path d="M616 200 L652 200" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M616 300 L652 300" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M616 420 L652 420" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- 数据流（真实调用链） -->
  <rect x="32" y="572" width="1016" height="160" rx="10" fill="#ffffff" stroke="#d7dfec"/>
  <text x="52" y="600" font-size="15" font-weight="700" fill="#1b3a6b">真实调用链（修复后）</text>

  <rect x="52" y="616" width="140" height="46" rx="8" fill="#eef2fa" stroke="#c9d6ea"/>
  <text x="64" y="637" font-size="12.5" fill="#1b3a6b">渲染层 setActiveTask</text>
  <text x="64" y="654" font-size="11.5" fill="#54657f">welcomeMode === "bot"</text>

  <rect x="222" y="616" width="176" height="46" rx="8" fill="#eef2fa" stroke="#c9d6ea"/>
  <text x="234" y="637" font-size="12.5" fill="#1b3a6b">agent:loadTaskHistory</text>
  <text x="234" y="654" font-size="11.5" fill="#54657f">IPC</text>

  <rect x="428" y="616" width="196" height="46" rx="8" fill="#eef2fa" stroke="#c9d6ea"/>
  <text x="440" y="637" font-size="12.5" fill="#1b3a6b">DurableBotService.history</text>
  <text x="440" y="654" font-size="11.5" fill="#54657f">binding(taskId) → open()</text>

  <rect x="654" y="616" width="180" height="46" rx="8" fill="#eef2fa" stroke="#c9d6ea"/>
  <text x="666" y="637" font-size="12.5" fill="#1b3a6b">openDurableStorage</text>
  <text x="666" y="654" font-size="11.5" fill="#54657f">claim lease → open JSONL</text>

  <rect x="864" y="616" width="164" height="46" rx="8" fill="#eef7f1" stroke="#bfe0cc"/>
  <text x="876" y="637" font-size="12.5" fill="#14653c">runtime.refresh()</text>
  <text x="876" y="654" font-size="11.5" fill="#2f4a3c">→ durable_snapshot</text>

  <path d="M192 639 L222 639" stroke="#1b3a6b" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M398 639 L428 639" stroke="#1b3a6b" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M624 639 L654 639" stroke="#1b3a6b" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M834 639 L864 639" stroke="#1b3a6b" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <text x="52" y="694" font-size="12" fill="#54657f">失败路径：lease 被占 / 修复后仍打不开 → historyError 直接显示在会话区（不再伪装成空会话）</text>
  <text x="52" y="714" font-size="12" fill="#54657f">遗留风险：模型凭证未就绪时仍会自动 resume 待执行回合（provider is not configured）→ 建议只保留一个实例运行</text>

  <defs>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#c2413a"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#2e7d4f"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1b3a6b"/>
    </marker>
  </defs>
</svg>
