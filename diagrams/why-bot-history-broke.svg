<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" width="1100" height="690" role="img" aria-label="为什么会发生：时间线、三层叠加原因与教训">
  <rect x="0" y="0" width="1100" height="690" fill="#f7f8fa"/>
  <text x="40" y="42" font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#111827">为什么会发生：三个独立错误叠加，才表现为「会话记录打不开」</text>
  <text x="40" y="66" font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="13" fill="#4b5563">时间、提交、文件与行号均为本仓库/本机实测；推断处单独标注。</text>

  <!-- 时间线 -->
  <text x="40" y="100" font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">时间线（四件事各自都合理，叠在一起才致命）</text>
  <g font-family="Segoe UI, 'Microsoft YaHei', sans-serif">
    <rect x="40" y="112" width="238" height="78" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="54" y="134" font-size="12.5" font-weight="700" fill="#111827">10-19 15:42 目录收缩</text>
    <text x="54" y="154" font-size="11.5" fill="#374151">网关路由重组：models.json 里</text>
    <text x="54" y="171" font-size="11.5" fill="#374151">commandcode/* 整组消失</text>

    <rect x="300" y="112" width="238" height="78" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="314" y="134" font-size="12.5" font-weight="700" fill="#111827">10-20 09:39 新增钩子</text>
    <text x="314" y="154" font-size="11.5" fill="#374151">cd80eac 在共享扩展工厂里加</text>
    <text x="314" y="171" font-size="11.5" fill="#374151">pi.on("context")（图片淘汰）</text>

    <rect x="560" y="112" width="238" height="78" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="574" y="134" font-size="12.5" font-weight="700" fill="#111827">10-20 11:25 打 0.1.46</text>
    <text x="574" y="154" font-size="11.5" fill="#374151">两项都进了安装包；门禁只验</text>
    <text x="574" y="171" font-size="11.5" fill="#374151">payload 能启动 worker</text>

    <rect x="820" y="112" width="240" height="78" rx="8" fill="#fef2f2" stroke="#ef4444"/>
    <text x="834" y="134" font-size="12.5" font-weight="700" fill="#991b1b">14:14 你点「录音笔」</text>
    <text x="834" y="154" font-size="11.5" fill="#7f1d1d">先撞悬空模型（可见错误）</text>
    <text x="834" y="171" font-size="11.5" fill="#7f1d1d">修完模型后撞上钩子（第二层）</text>
  </g>
  <g stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M278 151 H294"/><path d="M538 151 H554"/><path d="M798 151 H814"/>
  </g>

  <!-- 三层原因 -->
  <text x="40" y="232" font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#7f1d1d">三层原因：任何一层单独存在，都不会让历史打不开</text>
  <g font-family="Segoe UI, 'Microsoft YaHei', sans-serif">
    <rect x="40" y="246" width="330" height="96" rx="8" fill="#ffffff" stroke="#ef4444"/>
    <text x="56" y="268" font-size="13" font-weight="700" fill="#111827">① 数据：坐标会过期，但没有迁移</text>
    <text x="56" y="289" font-size="11.5" fill="#374151">tasks.model_id 是创建时写死的路由坐标</text>
    <text x="56" y="307" font-size="11.5" fill="#374151">models.json 是外部可变输入（网关/厂商）</text>
    <text x="56" y="325" font-size="11.5" fill="#b91c1c">两者之间没有版本号、没有失效兜底、没有迁移</text>

    <rect x="386" y="246" width="330" height="96" rx="8" fill="#ffffff" stroke="#ef4444"/>
    <text x="402" y="268" font-size="13" font-weight="700" fill="#111827">② 代码：读历史复用了执行路径</text>
    <text x="402" y="289" font-size="11.5" fill="#374151">openInternal() 先解析模型、再装扩展工具</text>
    <text x="402" y="307" font-size="11.5" fill="#374151">任一失败 → history() catch 成 historyError</text>
    <text x="402" y="325" font-size="11.5" fill="#b91c1c">「读」依赖了「为发请求准备的一切」 </text>

    <rect x="732" y="246" width="328" height="96" rx="8" fill="#ffffff" stroke="#ef4444"/>
    <text x="748" y="268" font-size="13" font-weight="700" fill="#111827">③ 门禁：测的不是真实链路</text>
    <text x="748" y="289" font-size="11.5" fill="#374151">durable 测试用 stub 扩展，绕过了真实工厂</text>
    <text x="748" y="307" font-size="11.5" fill="#374151">打包门禁只验 worker 能启动，不验打开历史</text>
    <text x="748" y="325" font-size="11.5" fill="#b91c1c">两类回归都能安静地过门禁</text>
  </g>
  <g stroke="#ef4444" stroke-width="2" fill="none">
    <path d="M40 360 V376 H1060 V360"/>
  </g>
  <text x="40" y="398" font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="13" fill="#7f1d1d">三者同时成立 → 打开历史 = 需要模型可解析 + 扩展能装上 + 没有任何一个工厂新增钩子</text>

  <!-- 具体两个错误 -->
  <text x="40" y="436" font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#065f46">落到你看到的两个报错</text>
  <g font-family="Segoe UI, 'Microsoft YaHei', sans-serif">
    <rect x="40" y="450" width="510" height="92" rx="8" fill="#ffffff" stroke="#10b981"/>
    <text x="56" y="472" font-size="13" font-weight="700" fill="#111827">Bot 模型不存在：magpie/commandcode/z-ai/glm-5.3-flash</text>
    <text x="56" y="493" font-size="11.5" fill="#374151">解析链条：tasks.model_id → getModel() → undefined</text>
    <text x="56" y="511" font-size="11.5" fill="#374151">旧代码：直接 throw（把「配置需修复」当成「会话损坏」）</text>
    <text x="56" y="529" font-size="11.5" fill="#047857">现在：同 provider 同名模型 → 默认模型 → 明确报错；且只影响发请求</text>

    <rect x="566" y="450" width="494" height="92" rx="8" fill="#ffffff" stroke="#10b981"/>
    <text x="582" y="472" font-size="13" font-weight="700" fill="#111827">Unsupported execution hook: context</text>
    <text x="582" y="493" font-size="11.5" fill="#374151">durableDomainTools 的 on() 白名单只有 session_*</text>
    <text x="582" y="511" font-size="11.5" fill="#374151">fail-closed：新钩子 = 抛错（本意是暴露开发期误用）</text>
    <text x="582" y="529" font-size="11.5" fill="#047857">现在：context → beforeRequest 真实执行；未知钩子告警忽略</text>
  </g>

  <!-- 教训 -->
  <rect x="40" y="566" width="1020" height="96" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="58" y="590" font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#312e81">我自己的两个判断错误（不是「系统就这样」）</text>
  <text x="58" y="614" font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#1f2937">1) 我是按报错逐个修，而不是先列「打开历史到底需要哪些依赖」——所以修完模型才发现钩子，害你重启了两次。</text>
  <text x="58" y="634" font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#1f2937">2) 0.1.47 我只跑了单测 + 检查 asar 字符串就发版，没在真实应用里点开一个 Bot 任务；门禁也没覆盖这条路径。</text>
  <text x="58" y="654" font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#1f2937">原则修正：读路径 fail-open（诊断/只读永不因执行配置失败）；执行路径 fail-closed（权限/模型/工具缺失必须显式报错）。</text>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#3b82f6"/></marker>
  </defs>
</svg>
