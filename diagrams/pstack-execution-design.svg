<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460"><rect width="1200" height="460" fill="#f8fafc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#334155"/></marker></defs><g font-family="sans-serif" fill="#0f172a"><text x="30" y="38" font-size="23">MyBuddy pstack：逐任务选择模型与工作目录</text><text x="30" y="68" font-size="14">实现链路；本地服务夹具已执行真实 Pi worker。发行包验收独立记录，不代表外部模型质量评测。</text><g stroke="#94a3b8" fill="#fff"><rect x="30" y="110" width="240" height="130" rx="8"/><rect x="330" y="110" width="240" height="130" rx="8"/><rect x="630" y="110" width="240" height="130" rx="8"/><rect x="930" y="110" width="240" height="130" rx="8"/></g><g font-size="15"><text x="45" y="140">subagent single / tasks / chain</text><text x="45" y="168">model · reasoning · isolation</text><text x="45" y="196">单项覆盖顶层默认</text><text x="45" y="223">父模型来自当前 ctx.model</text><text x="345" y="140">resolveSubagentSelection</text><text x="345" y="168">原生可用模型与 scope</text><text x="345" y="196">显式模型不可用则拒绝</text><text x="345" y="223">有损 reasoning 请求拒绝</text><text x="645" y="140">prepareSubagentWorkspace</text><text x="645" y="168">auto：并行 + 可写 → 隔离</text><text x="645" y="196">干净 Git / 固定 baseCommit</text><text x="645" y="223">intent → worktree → ready</text><text x="945" y="140">SubagentRuntime → Pi RPC</text><text x="945" y="168">cwd = workspace.cwd</text><text x="945" y="196">核对实际模型后执行</text><text x="945" y="223">终止后清理临时会话</text></g><g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M270 175H330"/><path d="M570 175H630"/><path d="M870 175H930"/><path d="M1050 240V310"/></g><rect x="30" y="310" width="540" height="110" rx="8" fill="#e0f2fe" stroke="#38bdf8"/><rect x="630" y="310" width="540" height="110" rx="8" fill="#dcfce7" stroke="#4ade80"/><g font-size="15"><text x="45" y="341">sourceProject 保留原项目的模型准入范围</text><text x="45" y="369">MYBUDDY_SUBAGENT_POLICY_CWD → worker 设置校验</text><text x="45" y="397">隔离目录变更不改变原项目 enabledModels 策略</text><text x="645" y="341">结果回执独立于临时会话保留</text><text x="645" y="369">cwd / branch / baseCommit / receiptPath</text><text x="645" y="397">成功、失败、取消均不自动删除工作树或合并分支</text></g></g></svg>
