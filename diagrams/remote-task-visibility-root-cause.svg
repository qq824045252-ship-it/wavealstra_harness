<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="980" height="640" fill="#f7f9fc"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#1a2433">安卓建的任务在 PC 端不显示 — 根因定位</text>
  <text x="30" y="58" font-size="12.5" fill="#5a6b82">结论：任务在 PC 端真实跑完，之后被「安全删除(trash)」批量标记 archived + trashed，侧栏/归档/安卓端按 !archived 过滤 → 全部隐藏。非同步链路故障。</text>

  <!-- flow -->
  <text x="30" y="92" font-size="14" font-weight="700" fill="#1a2433">实际链路（已验证）</text>

  <rect x="30" y="104" width="150" height="56" rx="8" fill="#e8f0fe" stroke="#3b82f6"/>
  <text x="105" y="128" font-size="12.5" text-anchor="middle" fill="#1a2433">安卓 App</text>
  <text x="105" y="146" font-size="11" text-anchor="middle" fill="#5a6b82">POST /v1/tasks</text>

  <rect x="220" y="104" width="170" height="56" rx="8" fill="#e8f0fe" stroke="#3b82f6"/>
  <text x="305" y="122" font-size="12" text-anchor="middle" fill="#1a2433">RemoteAccessServer</text>
  <text x="305" y="138" font-size="10.5" text-anchor="middle" fill="#5a6b82">createAndPrompt →</text>
  <text x="305" y="152" font-size="10.5" text-anchor="middle" fill="#5a6b82">db.upsertTask(remote-*)</text>

  <rect x="430" y="104" width="160" height="56" rx="8" fill="#e8f0fe" stroke="#3b82f6"/>
  <text x="510" y="122" font-size="12" text-anchor="middle" fill="#1a2433">AgentService.prompt</text>
  <text x="510" y="138" font-size="10.5" text-anchor="middle" fill="#5a6b82">bot→DurableBot / 非bot→</text>
  <text x="510" y="152" font-size="10.5" text-anchor="middle" fill="#5a6b82">PromptExecutionCoordinator</text>

  <rect x="630" y="104" width="150" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="705" y="122" font-size="12" text-anchor="middle" fill="#1a2433">主进程跑完 ✅</text>
  <text x="705" y="138" font-size="10.5" text-anchor="middle" fill="#166534">memory_turns 有完整</text>
  <text x="705" y="152" font-size="10.5" text-anchor="middle" fill="#166534">user+assistant 文本</text>

  <rect x="820" y="104" width="130" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="885" y="122" font-size="12" text-anchor="middle" fill="#1a2433">emitPatch →</text>
  <text x="885" y="138" font-size="10.5" text-anchor="middle" fill="#166534">broadcast → 渲染层</text>
  <text x="885" y="152" font-size="10.5" text-anchor="middle" fill="#166534">侧栏显示任务</text>

  <line x1="180" y1="132" x2="220" y2="132" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="390" y1="132" x2="430" y2="132" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="590" y1="132" x2="630" y2="132" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="780" y1="132" x2="820" y2="132" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#3b82f6"/></marker></defs>

  <!-- divergence -->
  <text x="30" y="196" font-size="14" font-weight="700" fill="#1a2433">跑完之后 — 两组任务分叉（DB 证据）</text>

  <rect x="30" y="210" width="440" height="150" rx="8" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="46" y="232" font-size="12.5" font-weight="700" fill="#166534">可见组（archived=0）— 8 个 remote 任务</text>
  <text x="46" y="252" font-size="11.5" fill="#1a2433">remote-3ffaab6f · remote-02280d74 · remote-a629c278</text>
  <text x="46" y="270" font-size="11.5" fill="#1a2433">remote-8648cf7e · remote-1dc74f83 · remote-a359d91a …</text>
  <text x="46" y="296" font-size="11.5" fill="#166534">tasks.archived = 0</text>
  <text x="46" y="314" font-size="11.5" fill="#166534">task_execution_workspace_state = 无 / active</text>
  <text x="46" y="340" font-size="11.5" fill="#1a2433">→ 侧栏 + 安卓端都正常显示 ✅</text>

  <rect x="500" y="210" width="450" height="150" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="516" y="232" font-size="12.5" font-weight="700" fill="#b91c1c">不可见组（archived=1 + trashed）— 12 个</text>
  <text x="516" y="252" font-size="11.5" fill="#1a2433">remote-56456f6c · remote-94af198f · remote-3633c173(bot)</text>
  <text x="516" y="270" font-size="11.5" fill="#1a2433">remote-d0c09ea9 · remote-e634a83d · remote-f2432a3f …</text>
  <text x="516" y="296" font-size="11.5" fill="#b91c1c">tasks.archived = 1</text>
  <text x="516" y="314" font-size="11.5" fill="#b91c1c">task_execution_workspace_state.state = 'trashed'</text>
  <text x="516" y="340" font-size="11.5" fill="#1a2433">→ 三处 !archived 过滤全部隐藏 ❌</text>

  <!-- deletion path -->
  <text x="30" y="392" font-size="14" font-weight="700" fill="#1a2433">删除路径（唯一来源：桌面端「安全回收」）</text>

  <rect x="30" y="404" width="220" height="60" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="140" y="426" font-size="12" text-anchor="middle" fill="#1a2433">桌面渲染层 deleteTask</text>
  <text x="140" y="443" font-size="10.5" text-anchor="middle" fill="#9a3412">TaskItem.tsx:575 · 仅 IPC</text>

  <rect x="300" y="404" width="220" height="60" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="410" y="424" font-size="12" text-anchor="middle" fill="#1a2433">DbIpc.deleteTask (index.ts:1883)</text>
  <text x="410" y="441" font-size="10.5" text-anchor="middle" fill="#9a3412">taskLifecycle.trash(id)</text>

  <rect x="570" y="404" width="200" height="60" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="670" y="424" font-size="12" text-anchor="middle" fill="#1a2433">commitTrashedMetadata</text>
  <text x="670" y="441" font-size="10.5" text-anchor="middle" fill="#9a3412">archived=1 + state='trashed'</text>

  <line x1="250" y1="434" x2="300" y2="434" stroke="#ea580c" stroke-width="2" marker-end="url(#o)"/>
  <line x1="520" y1="434" x2="570" y2="434" stroke="#ea580c" stroke-width="2" marker-end="url(#o)"/>
  <defs><marker id="o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ea580c"/></marker></defs>

  <rect x="800" y="404" width="150" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="875" y="424" font-size="11" text-anchor="middle" fill="#1a2433">安卓端 / 远程 API</text>
  <text x="875" y="440" font-size="10" text-anchor="middle" fill="#64748b">无任何 delete/archive</text>
  <text x="875" y="454" font-size="10" text-anchor="middle" fill="#64748b">路由 — 排除为来源</text>

  <!-- timeline -->
  <text x="30" y="500" font-size="14" font-weight="700" fill="#1a2433">时间线（DB 时间戳，UTC）</text>
  <rect x="30" y="512" width="920" height="90" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="50" y="536" font-size="11.5" fill="#1a2433">10/10–10/11 各时段　→　remote 任务创建并跑完（工作目录 LastWriteTime 分布在此期间）</text>
  <text x="50" y="558" font-size="11.5" fill="#b91c1c">10/12 07:31:56 → 07:33:13（本地）→　12 个任务在 77 秒内被连续 trash —— 一次性批量删除</text>
  <text x="50" y="580" font-size="11.5" fill="#5a6b82">trashed_at == ws_created_at == tasks.updated_at（同一事务），且 trashed_at 远晚于任务活动时间 → 删除在跑完之后</text>

  <!-- verdict -->
  <rect x="30" y="614" width="920" height="0" fill="none"/>
</svg>
