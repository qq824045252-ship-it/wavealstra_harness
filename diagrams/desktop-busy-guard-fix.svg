<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1010" viewBox="0 0 1180 1010" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="f1" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#374151"/>
    </marker>
    <marker id="f1r" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b3261e"/>
    </marker>
    <marker id="f1g" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1f7a4d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="1010" fill="#f7f8fa"/>
  <text x="60" y="46" font-size="21" font-weight="700" fill="#111827">执行中的对话：删不掉消息 / 建不了分支（修前 → 修后）</text>
  <text x="60" y="72" font-size="13" fill="#4b5563">MessageItem.tsx / appStore.ts / AgentService.ts:3785 isTaskBusy / ConversationBranchService.ts:165</text>

  <rect x="700" y="20" width="420" height="62" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="714" y="34" width="16" height="16" rx="3" fill="#fdecea" stroke="#b3261e"/>
  <text x="738" y="47" font-size="13" fill="#111827">修前：直接拒绝</text>
  <rect x="844" y="34" width="16" height="16" rx="3" fill="#e8f5ee" stroke="#1f7a4d"/>
  <text x="868" y="47" font-size="13" fill="#111827">修后：停止并继续</text>
  <text x="714" y="72" font-size="12" fill="#6b7280">本次改动只加「先 abort 再重试」，不放松任何主进程校验</text>

  <!-- delete column -->
  <text x="120" y="116" font-size="16" font-weight="700" fill="#111827">A. 删除此消息（对话框里的对话删不掉）</text>
  <g>
    <rect x="120" y="130" width="470" height="58" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="138" y="155" font-size="14" font-weight="700" fill="#111827">① 消息「更多」→ 删除此消息 → 确认框</text>
    <text x="138" y="176" font-size="12" fill="#4b5563">MessageItem.tsx:655</text>

    <rect x="120" y="212" width="470" height="86" rx="10" fill="#fdecea" stroke="#b3261e" stroke-width="1.8"/>
    <text x="138" y="238" font-size="14" font-weight="700" fill="#b3261e">② 修前：直接抛错，删除变成死胡同</text>
    <text x="138" y="260" font-size="12" fill="#7f1d1d">renderer：messages.some(streaming) → throw</text>
    <text x="138" y="280" font-size="12" fill="#7f1d1d">主进程：isTaskBusy →「任务仍在运行，请先停止生成后再删除消息」</text>

    <rect x="120" y="322" width="470" height="104" rx="10" fill="#e8f5ee" stroke="#1f7a4d" stroke-width="1.8"/>
    <text x="138" y="348" font-size="14" font-weight="700" fill="#1f7a4d">③ 修后：确认框「停止并删除」→ abort → 重试</text>
    <text x="138" y="370" font-size="12" fill="#14532d">abortActiveTask() → 等待 600ms 收尾</text>
    <text x="138" y="390" font-size="12" fill="#14532d">agent.deleteUserMessage(... entryId 主锚点)</text>
    <text x="138" y="410" font-size="12" fill="#14532d">仍报 busy → 再 abort + 700ms 重试，最多 4 次；其它错误原样抛出</text>

    <line x1="355" y1="188" x2="355" y2="208" stroke="#374151" stroke-width="1.6" marker-end="url(#f1)"/>
    <line x1="355" y1="298" x2="355" y2="318" stroke="#374151" stroke-width="1.6" marker-end="url(#f1)"/>
  </g>

  <!-- branch column -->
  <text x="640" y="116" font-size="16" font-weight="700" fill="#111827">B. 从这里创建分支（空间任务建不了分支）</text>
  <g>
    <rect x="640" y="130" width="470" height="58" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="658" y="155" font-size="14" font-weight="700" fill="#111827">④ 菜单 → IPC conversationBranch.create</text>
    <text x="658" y="176" font-size="12" fill="#4b5563">appStore.ts:2050（requestId 幂等）</text>

    <rect x="640" y="212" width="470" height="86" rx="10" fill="#fdecea" stroke="#b3261e" stroke-width="1.8"/>
    <text x="658" y="238" font-size="14" font-weight="700" fill="#b3261e">⑤ 修前：TASK_BUSY 直接失败</text>
    <text x="658" y="260" font-size="12" fill="#7f1d1d">isTaskBusy：isStreaming ∨ isIdle===false ∨ 排队回合 ∨</text>
    <text x="658" y="280" font-size="12" fill="#7f1d1d">挂起审批 ∨ 挂起外部写（AgentService.ts:3785）</text>

    <rect x="640" y="322" width="470" height="104" rx="10" fill="#e8f5ee" stroke="#1f7a4d" stroke-width="1.8"/>
    <text x="658" y="348" font-size="14" font-weight="700" fill="#1f7a4d">⑥ 修后：收到 TASK_BUSY → abort → 同 requestId 重试</text>
    <text x="658" y="370" font-size="12" fill="#14532d">abortActiveTask() → 700ms 退避 → 再次 create</text>
    <text x="658" y="390" font-size="12" fill="#14532d">最多 3 次；requestId 不变，重复请求返回同一个 child</text>
    <text x="658" y="410" font-size="12" fill="#14532d">仍失败才显示红字（可读的收尾提示）</text>

    <line x1="875" y1="188" x2="875" y2="208" stroke="#374151" stroke-width="1.6" marker-end="url(#f1)"/>
    <line x1="875" y1="298" x2="875" y2="318" stroke="#374151" stroke-width="1.6" marker-end="url(#f1)"/>
  </g>

  <!-- evidence -->
  <rect x="120" y="456" width="990" height="252" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="140" y="484" font-size="15" font-weight="700" fill="#111827">为什么「空间任务」最容易踩到：后端没问题，是 busy 守卫</text>
  <text x="140" y="510" font-size="12.5" fill="#374151">· 真实数据探针：36 个有会话的空间任务在 DB 副本上全部创建成功（多为 shared_space，4 个失效路径走 current_snapshot）。</text>
  <text x="140" y="532" font-size="12.5" fill="#374151">· 所以「空间任务无法建分支」不是 Space 特有逻辑：这些长任务/中断任务一直处于 busy。</text>
  <text x="140" y="554" font-size="12.5" fill="#374151">· 证据：2 个空间任务自 2026-10-19 23:48 起 status=in_progress，live session 的 isIdle 仍为 false；应用自 10-19 16:18 未重启，</text>
  <text x="140" y="574" font-size="12.5" fill="#374151">　 中断的 run 一直挂在 registry → 删除消息与创建分支撞上同一对守卫（renderer streaming + 主进程 isTaskBusy）。</text>
  <text x="140" y="600" font-size="12.5" fill="#1f7a4d">· 验证：test:conversation-branch-ui 37/37（新增用例 10：TASK_BUSY → 自动停止 → 同 requestId 重试成功）。</text>
  <text x="140" y="622" font-size="12.5" fill="#1f7a4d">· delete-busy 探针 5/5：abort 1 次、等 600ms 收尾、entryId 锚点、消息截断。</text>
  <text x="140" y="646" font-size="12.5" fill="#4b5563">· 未放松主进程校验：abort 后仍由 isTaskBusy / 会话分支 / 工作区策略决定成败。</text>
  <text x="140" y="674" font-size="12" fill="#6b7280">注：Bot（Durable）会话无 Pi session 文件，删除消息/分支仍按设计不支持；该入口对 bot 会话本来就不显示。</text>

  <rect x="120" y="724" width="990" height="160" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-dasharray="4 3"/>
  <text x="140" y="752" font-size="15" font-weight="700" fill="#111827">改动清单（只改源码，未构建、未改用户数据）</text>
  <text x="140" y="778" font-size="12.5" fill="#374151">1. appStore.ts · createBranchFromMessage：TASK_BUSY → abort + 700ms 重试（≤3 次，requestId 不变）</text>
  <text x="140" y="800" font-size="12.5" fill="#374151">2. appStore.ts · deleteUserMessage：执行中先 abort + 600ms 收尾，IPC 仍 busy 再重试（≤4 次）</text>
  <text x="140" y="822" font-size="12.5" fill="#374151">3. MessageItem.tsx：执行中确认框提示「删除会先停止当前运行」，按钮变「停止并删除」</text>
  <text x="140" y="844" font-size="12.5" fill="#374151">4. scripts/conversation-branch-ui-test.ts：新增 TASK_BUSY 自动停止重试用例</text>
  <text x="140" y="868" font-size="12" fill="#6b7280">生效需重新构建桌面端；当前正在跑的任务不会被中断，构建/重启等你确认。</text>
</svg>

