<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1240" height="800" fill="#f7f8fb"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#1f2430">复测：单步耗时 80–90% 在模型回合，工具只占 10–20%</text>
  <text x="40" y="72" font-size="13" fill="#5b6472">修复前基线（2026-10-19 复测）：2560×1440 / 100% DPI / Electron 44.5.1；数据来自 17 个会话、126 次 computer_exec 调用</text>

  <!-- flow boxes -->
  <g>
    <rect x="40" y="96" width="180" height="170" rx="10" fill="#ffffff" stroke="#c9d2e3"/>
    <text x="56" y="124" font-size="14" font-weight="700" fill="#1f2430">① 模型回合</text>
    <text x="56" y="150" font-size="13" fill="#3b4556">TTFT 2.4–4.9s</text>
    <text x="56" y="172" font-size="13" fill="#3b4556">墙钟 3.7–9.1s</text>
    <text x="56" y="194" font-size="13" fill="#3b4556">随上下文增长</text>
    <text x="56" y="222" font-size="12" fill="#7a8496">42k 上下文 → 3.7s</text>
    <text x="56" y="240" font-size="12" fill="#7a8496">240k 上下文 → 9.1s</text>
  </g>
  <g>
    <rect x="244" y="96" width="180" height="170" rx="10" fill="#ffffff" stroke="#c9d2e3"/>
    <text x="260" y="124" font-size="14" font-weight="700" fill="#1f2430">② 目标解析</text>
    <text x="260" y="150" font-size="13" fill="#3b4556">list_windows 253ms</text>
    <text x="260" y="172" font-size="13" fill="#3b4556">inspect(HWND) 12ms</text>
    <text x="260" y="194" font-size="13" fill="#3b4556">inspect(标题) 300ms</text>
    <text x="260" y="222" font-size="12" fill="#7a8496">12 个窗口、含进程名</text>
    <text x="260" y="240" font-size="12" fill="#7a8496">每次动作 1~4 次</text>
  </g>
  <g>
    <rect x="448" y="96" width="180" height="170" rx="10" fill="#ffffff" stroke="#c9d2e3"/>
    <text x="464" y="124" font-size="14" font-weight="700" fill="#1f2430">③ 屏幕采集</text>
    <text x="464" y="150" font-size="13" fill="#3b4556">getSources 281ms</text>
    <text x="464" y="172" font-size="13" fill="#3b4556">toPNG 140–248ms</text>
    <text x="464" y="194" font-size="13" fill="#3b4556">原始 PNG 1.4–1.9MB</text>
    <text x="464" y="222" font-size="12" fill="#7a8496">crop 几乎免费</text>
    <text x="464" y="240" font-size="12" fill="#7a8496">toJPEG(70) 仅 5ms</text>
  </g>
  <g>
    <rect x="652" y="96" width="180" height="170" rx="10" fill="#fff4ee" stroke="#e8a06a"/>
    <text x="668" y="124" font-size="14" font-weight="700" fill="#8a3f12">④ 图片归一化</text>
    <text x="668" y="150" font-size="13" fill="#8a3f12">整屏 1.10s</text>
    <text x="668" y="172" font-size="13" fill="#3b4556">窗口裁剪 58ms</text>
    <text x="668" y="194" font-size="13" fill="#3b4556">1280 JPEG 目标 9ms</text>
    <text x="668" y="222" font-size="12" fill="#7a8496">仅 &gt;2000px 才缩放</text>
    <text x="668" y="240" font-size="12" fill="#7a8496">PNG+5 档 JPEG 全编码</text>
  </g>
  <g>
    <rect x="856" y="96" width="160" height="170" rx="10" fill="#ffffff" stroke="#c9d2e3"/>
    <text x="872" y="124" font-size="14" font-weight="700" fill="#1f2430">⑤ 工具结果</text>
    <text x="872" y="150" font-size="13" fill="#3b4556">图片进入上下文</text>
    <text x="872" y="172" font-size="13" fill="#3b4556">点击强制 +1 张</text>
    <text x="872" y="194" font-size="13" fill="#3b4556">每轮重发</text>
    <text x="872" y="222" font-size="12" fill="#7a8496">整屏 1.9M base64</text>
    <text x="872" y="240" font-size="12" fill="#7a8496">7 张 6.4MB</text>
  </g>
  <g>
    <rect x="1036" y="96" width="164" height="170" rx="10" fill="#ffffff" stroke="#c9d2e3"/>
    <text x="1052" y="124" font-size="14" font-weight="700" fill="#1f2430">⑥ 下一轮模型</text>
    <text x="1052" y="150" font-size="13" fill="#3b4556">TTFT 2.4–4.9s</text>
    <text x="1052" y="172" font-size="13" fill="#3b4556">上下文继续涨</text>
    <text x="1052" y="194" font-size="13" fill="#3b4556">回合数 = 动作数</text>
    <text x="1052" y="222" font-size="12" fill="#7a8496">无批量接口</text>
    <text x="1052" y="240" font-size="12" fill="#7a8496">126 次调用 126 轮</text>
  </g>

  <!-- arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b96a9"/>
    </marker>
  </defs>
  <g stroke="#8b96a9" stroke-width="2" marker-end="url(#arrow)">
    <line x1="220" y1="181" x2="240" y2="181"/>
    <line x1="424" y1="181" x2="444" y2="181"/>
    <line x1="628" y1="181" x2="648" y2="181"/>
    <line x1="832" y1="181" x2="852" y2="181"/>
    <line x1="1016" y1="181" x2="1032" y2="181"/>
  </g>

  <!-- two scenario bars -->
  <text x="40" y="318" font-size="15" font-weight="700" fill="#1f2430">同样的动作，两种会话上下文下的单步预算</text>

  <text x="40" y="350" font-size="13" fill="#3b4556">干净会话 42k tokens：4.5s</text>
  <rect x="330" y="334" width="315" height="30" rx="5" fill="#5b8def"/>
  <rect x="645" y="334" width="68" height="30" rx="5" fill="#e8a06a"/>
  <text x="342" y="354" font-size="12" fill="#ffffff">模型 3.7s（82%）</text>
  <text x="648" y="354" font-size="12" fill="#5a2c0c">工具 0.8s</text>

  <text x="40" y="404" font-size="13" fill="#3b4556">长会话 240k tokens：10.2s</text>
  <rect x="330" y="388" width="774" height="30" rx="5" fill="#5b8def"/>
  <rect x="1104" y="388" width="94" height="30" rx="5" fill="#e8a06a"/>
  <text x="342" y="408" font-size="12" fill="#ffffff">模型 9.1s（89%）</text>
  <text x="1112" y="430" font-size="12" fill="#5a2c0c">工具 1.1s</text>

  <text x="40" y="452" font-size="12" fill="#5b6472">注：长会话的 240k 上下文中，computer_exec 只占 8.5k tokens（约 3.5%）；慢是会话历史 + 每步一轮模型，不是截图或视觉管线本身。</text>

  <!-- stats -->
  <rect x="40" y="474" width="560" height="296" rx="10" fill="#ffffff" stroke="#c9d2e3"/>
  <text x="60" y="504" font-size="15" font-weight="700" fill="#1f2430">真实会话：原生 vs 委托视觉</text>
  <g font-size="13" fill="#3b4556">
    <text x="60" y="534">screenshot_window：原生 621ms（n=9）</text>
    <text x="60" y="558" fill="#b4541f">委托视觉 10.26s（n=14）</text>
    <text x="60" y="584">click_client：原生 1.12s（22 次，均带强制截图）</text>
    <text x="60" y="608">纯文本模型 0.50s（11 次，无图）</text>
    <text x="60" y="634">点击实测：无策略 719ms → Agent 策略 1.08s</text>
    <text x="60" y="658">（+365ms 来自强制截图 + 一次 8–180KB 图片）</text>
    <text x="60" y="684">type_text 20 字符：940ms（逐字前台校验）</text>
    <text x="60" y="710">focus_window：中位 568ms（首次 1.1–1.5s）</text>
    <text x="60" y="736">Host 冷启动 579ms；list_windows 253ms/次</text>
    <text x="60" y="760">126 次调用只有 4 次失败（焦点/截图/超时）</text>
  </g>

  <rect x="620" y="474" width="580" height="296" rx="10" fill="#ffffff" stroke="#c9d2e3"/>
  <text x="640" y="504" font-size="15" font-weight="700" fill="#1f2430">上下文构成与请求体（240k 会话）</text>
  <g font-size="13" fill="#3b4556">
    <text x="640" y="534">assistant 消息（thinking 历史）：159.6k tokens</text>
    <text x="640" y="558">toolResult 合计：80.9k tokens</text>
    <text x="640" y="582" fill="#b4541f">computer_exec：8.5k tokens（约 3.5%）</text>
    <text x="640" y="606">图片 7 张：约 8.4k tokens</text>
    <text x="640" y="630">system prompt：14.4k 字符（约 5k tokens）</text>
    <text x="640" y="656">整屏截图 1.9M base64/张，7 张 6.4MB</text>
    <text x="640" y="680">压缩阈值 500k tokens，全程未触发</text>
    <text x="640" y="704">每轮请求都要重传全部历史图片</text>
    <text x="640" y="728">→ 降本重点：批量动作 + 图片淘汰，而非优化采集</text>
    <text x="640" y="752">→ 窗口截图 0.4–0.6s 已接近可用水平</text>
  </g>
</svg>
