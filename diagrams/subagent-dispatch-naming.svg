<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arw3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="400" fill="#F7F9FC"/>
  <text x="28" y="40" font-size="20" font-weight="700" fill="#0F172A">分派时能自定义名字，但有合法范围</text>
  <text x="28" y="66" font-size="13" fill="#475569">分派方传入 subagentId → safeId 归一化 → 唯一性检查；通过后完全用你的名字（不加随机后缀）</text>

  <!-- input -->
  <rect x="28" y="92" width="180" height="58" rx="10" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="118" y="114" font-size="12" fill="#475569" text-anchor="middle">输入 subagentId</text>
  <text x="118" y="136" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">review-auth</text>

  <line x1="208" y1="121" x2="240" y2="121" stroke="#64748B" stroke-width="2" marker-end="url(#arw3)"/>

  <!-- safeId -->
  <rect x="246" y="92" width="240" height="58" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="366" y="114" font-size="12" fill="#475569" text-anchor="middle">safeId() 归一化</text>
  <text x="366" y="136" font-size="12" fill="#0F172A" text-anchor="middle">非 [A-Za-z0-9_-] → "-"，≤80 字符</text>

  <line x1="486" y1="121" x2="518" y2="121" stroke="#64748B" stroke-width="2" marker-end="url(#arw3)"/>

  <!-- uniqueness -->
  <rect x="524" y="92" width="210" height="58" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="629" y="114" font-size="12" fill="#475569" text-anchor="middle">唯一性检查（runtime 内）</text>
  <text x="629" y="136" font-size="12" fill="#0F172A" text-anchor="middle">重名 → 抛错，不静默改名</text>

  <!-- result examples -->
  <rect x="28" y="176" width="404" height="118" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="44" y="200" font-size="13" font-weight="700" fill="#1D4ED8">合法 / 不合法示例</text>
  <text x="44" y="224" font-size="12" fill="#0F172A">review-auth · test-db · worker-2 → 原样保留</text>
  <text x="44" y="246" font-size="12" fill="#0F172A">评审-登录 → "-----"（中文全变 "-"，别用）</text>
  <text x="44" y="268" font-size="12" fill="#0F172A">不传 → scout-k9rvzv（自动 role + 6 位 base36）</text>
  <text x="44" y="288" font-size="12" fill="#475569">超 80 字符 → 截断；空串 → "subagent"</text>

  <!-- constraints -->
  <rect x="456" y="176" width="416" height="118" rx="10" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="472" y="200" font-size="13" font-weight="700" fill="#047857">范围（分派方可控）</text>
  <text x="472" y="224" font-size="12" fill="#0F172A">字符：A-Za-z0-9_-   ·   长度：≤80</text>
  <text x="472" y="246" font-size="12" fill="#0F172A">唯一：同 runtime 重名拒绝（跨 Task 也拒绝）</text>
  <text x="472" y="268" font-size="12" fill="#0F172A">后缀：显式名不加随机后缀</text>
  <text x="472" y="288" font-size="12" fill="#475569">只在实例存活期有效；结束销毁后可再用</text>

  <!-- role note -->
  <rect x="28" y="312" width="844" height="52" rx="10" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="44" y="336" font-size="12" fill="#92400E">注意：名字可自取，角色（role）不能自造——必须是已存在的 .md 角色，或别名 default / assistant / agent（→ worker）</text>
  <text x="44" y="354" font-size="12" fill="#475569">自定义 id 在运行中那一行看不到（显示 role），完成后才显示你的名字</text>
</svg>
