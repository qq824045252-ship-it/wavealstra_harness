<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="620" fill="#f7f8fa"/>
  <text x="28" y="36" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1f2430">「概览」子代理 / 主 Agent 模型标识的数据链</text>
  <text x="28" y="60" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#5b6472">运行中、完成态子代理与主 Agent 各自显示模型短标签；完整 provider/model 与来源放在 title；无可靠证据就不显示。</text>

  <!-- ============ Lane A：运行中子代理 ============ -->
  <rect x="20" y="80" width="920" height="132" rx="10" fill="#ffffff" stroke="#d9dee6"/>
  <text x="36" y="104" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#2f6feb">① 运行中子代理 —— 真实在跑什么由运行时记录给出</text>

  <rect x="36" y="116" width="250" height="84" rx="8" fill="#f2f6ff" stroke="#bcd0f5"/>
  <text x="48" y="134" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1f2430">subagent:active（IPC）</text>
  <text x="48" y="153" font-family="Consolas, monospace" font-size="11.5" fill="#33404f">SubagentSummaryDto</text>
  <text x="48" y="169" font-family="Consolas, monospace" font-size="11.5" fill="#33404f">resolvedModel · actualModel</text>
  <text x="48" y="185" font-family="Consolas, monospace" font-size="11.5" fill="#33404f">modelSource（invocation/parent/…）</text>

  <line x1="286" y1="158" x2="306" y2="158" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="308" y="116" width="196" height="84" rx="8" fill="#f5f7f9" stroke="#d9dee6"/>
  <text x="320" y="134" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1f2430">subagentModelBadge()</text>
  <text x="320" y="153" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#33404f">实际值优先 → 解析值 → 记录值</text>
  <text x="320" y="171" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#33404f">实测≠解析 → 解析值进 note</text>
  <text x="320" y="190" font-family="Consolas, monospace" font-size="11.5" fill="#6b7482">lib/modelBadge.ts</text>

  <line x1="504" y1="158" x2="524" y2="158" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="526" y="116" width="170" height="84" rx="8" fill="#f5f7f9" stroke="#d9dee6"/>
  <text x="538" y="134" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1f2430">RunningSubagentVm</text>
  <text x="538" y="153" font-family="Consolas, monospace" font-size="11.5" fill="#33404f">  .model = { label,</text>
  <text x="538" y="169" font-family="Consolas, monospace" font-size="11.5" fill="#33404f">  full, note, source }</text>
  <text x="538" y="190" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7482">overviewRuntime 纯函数</text>

  <line x1="696" y1="158" x2="716" y2="158" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="718" y="116" width="206" height="84" rx="8" fill="#eef4ff" stroke="#9dbcf0"/>
  <text x="730" y="134" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1f2430">.ro-item-head 行内 chip</text>
  <rect x="730" y="145" width="58" height="17" rx="4" fill="#e7ecf3" stroke="#c9d1de"/>
  <text x="736" y="158" font-family="Consolas, monospace" font-size="11" fill="#4d5868">GPT-5</text>
  <text x="796" y="158" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5b6472">42s</text>
  <text x="730" y="180" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#5b6472">title：模型：gpt-5 · 解析值</text>
  <text x="730" y="194" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#5b6472">openai/gpt-5 · 来源：手动指定</text>

  <!-- ============ Lane B：完成态子代理 ============ -->
  <rect x="20" y="228" width="920" height="132" rx="10" fill="#ffffff" stroke="#d9dee6"/>
  <text x="36" y="252" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1a8f5f">② 完成态子代理 —— 实例已销毁，只能从工具结果证据行取事实</text>

  <rect x="36" y="264" width="250" height="84" rx="8" fill="#f1fbf5" stroke="#b7e3c9"/>
  <text x="48" y="282" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1f2430">blocks[tool=subagent].output</text>
  <text x="48" y="301" font-family="Consolas, monospace" font-size="11.5" fill="#33404f">Resolved model: openai/gpt-5;</text>
  <text x="48" y="317" font-family="Consolas, monospace" font-size="11.5" fill="#33404f">  thinking: high</text>
  <text x="48" y="333" font-family="Consolas, monospace" font-size="11.5" fill="#33404f">Observed model: gpt-5</text>

  <line x1="286" y1="306" x2="306" y2="306" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="308" y="264" width="196" height="84" rx="8" fill="#f5f7f9" stroke="#d9dee6"/>
  <text x="320" y="282" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1f2430">parseModelEvidence()</text>
  <text x="320" y="301" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#33404f">只认结构化证据行</text>
  <text x="320" y="319" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#33404f">不猜正文里的模型名</text>
  <text x="320" y="338" font-family="Consolas, monospace" font-size="11.5" fill="#6b7482">lib/modelBadge.ts</text>

  <line x1="504" y1="306" x2="524" y2="306" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="526" y="264" width="170" height="84" rx="8" fill="#f5f7f9" stroke="#d9dee6"/>
  <text x="538" y="282" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1f2430">DoneSubagentVm</text>
  <text x="538" y="301" font-family="Consolas, monospace" font-size="11.5" fill="#33404f">  .model</text>
  <text x="538" y="319" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#33404f">后续无证据调用</text>
  <text x="538" y="335" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#33404f">保留上一次模型</text>

  <line x1="696" y1="306" x2="716" y2="306" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="718" y="264" width="206" height="84" rx="8" fill="#eef4ff" stroke="#9dbcf0"/>
  <text x="730" y="282" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1f2430">.ro-done-header chip</text>
  <rect x="730" y="293" width="58" height="17" rx="4" fill="#e7ecf3" stroke="#c9d1de"/>
  <text x="736" y="306" font-family="Consolas, monospace" font-size="11" fill="#4d5868">GPT-5</text>
  <text x="796" y="306" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5b6472">已完成</text>
  <text x="730" y="328" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#5b6472">title：模型：openai/gpt-5</text>

  <!-- ============ Lane C：主 Agent ============ -->
  <rect x="20" y="376" width="920" height="132" rx="10" fill="#ffffff" stroke="#d9dee6"/>
  <text x="36" y="400" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#8a5cf6">③ 主 Agent —— 任务级当前模型</text>

  <rect x="36" y="412" width="250" height="84" rx="8" fill="#f7f3ff" stroke="#d6c7f7"/>
  <text x="48" y="430" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1f2430">useAppStore()</text>
  <text x="48" y="449" font-family="Consolas, monospace" font-size="11.5" fill="#33404f">activeModelId</text>
  <text x="48" y="465" font-family="Consolas, monospace" font-size="11.5" fill="#33404f">models[].id → name</text>
  <text x="48" y="482" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7482">任务级，不用全局默认冒充</text>

  <line x1="286" y1="454" x2="306" y2="454" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="308" y="412" width="196" height="84" rx="8" fill="#f5f7f9" stroke="#d9dee6"/>
  <text x="320" y="430" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1f2430">buildMainAgent(</text>
  <text x="320" y="446" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1f2430">  msgs, mainModel)</text>
  <text x="320" y="465" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#33404f">目录名命中 → 显示 name</text>
  <text x="320" y="483" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#33404f">取不到 → 不渲染 chip</text>

  <line x1="504" y1="454" x2="524" y2="454" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="526" y="412" width="170" height="84" rx="8" fill="#f5f7f9" stroke="#d9dee6"/>
  <text x="538" y="430" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1f2430">MainAgentVm.model</text>
  <text x="538" y="449" font-family="Consolas, monospace" font-size="11.5" fill="#33404f">  { label, full }</text>
  <text x="538" y="470" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7482">任务级即事实，</text>
  <text x="538" y="486" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7482">不加来源标注</text>

  <line x1="696" y1="454" x2="716" y2="454" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="718" y="412" width="206" height="84" rx="8" fill="#eef4ff" stroke="#9dbcf0"/>
  <text x="730" y="430" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1f2430">.ro-main-name chip</text>
  <rect x="730" y="441" width="128" height="17" rx="4" fill="#e7ecf3" stroke="#c9d1de"/>
  <text x="736" y="454" font-family="Consolas, monospace" font-size="11" fill="#4d5868">DeepSeek V4.1 Flash</text>
  <text x="730" y="476" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#5b6472">title：模型：deepseek/…-flash</text>

  <!-- 复用的展示规则 -->
  <rect x="20" y="524" width="920" height="76" rx="10" fill="#fffaf0" stroke="#ead9ae"/>
  <text x="36" y="546" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#7a5a00">三处共用同一套展示规则（lib/modelBadge.ts）</text>
  <text x="36" y="566" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#5b6472">短名：目录 name 优先，其次 id 末段（provider/model → model），超过 24 字符截断；模型未知时整个 chip 不渲染。</text>
  <text x="36" y="584" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#5b6472">title 永远保留完整标识 + 来源 + 解析差异；窄面板下 .ro-item-head 单行：role · chip · 耗时右对齐，chip 不换行。</text>
</svg>
