  <text x="170" y="522" font-size="13" fill="#334155" text-anchor="end">v5 实测窗口</text>
  <rect x="810" y="505" width="72" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="810" y="497" font-size="12" fill="#92400e">10:55 → 11:15（前 8 分钟在修复提交之前）</text>

  <rect x="40" y="600" width="1120" height="110" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="60" y="626" font-size="13" font-weight="700" fill="#991b1b">结论：v5 的四条「未修复」全部取自 10:33 构建；修复 11:03 / 11:33 才提交，进程此后从未重启。</text>
  <text x="60" y="650" font-size="12" fill="#7f1d1d">4 次启动记录（08:21 / 09:26 / 09:53 / 10:33:38）之后再无第 5 次；out/main/index.js 的 mtime 停在 10:33:37。</text>
  <text x="60" y="672" font-size="12" fill="#7f1d1d">报告 12:12 写成，比修复晚 69 分钟，数据却比代码早 69 分钟 —— 于是把「没重启」记成了「没修好」。</text>
  <text x="60" y="694" font-size="12" fill="#7f1d1d">D-4 是另一类：默认 timeoutPolicy=fixed 下 timeout_ms 按设计被忽略，判据不改就永远判红。</text>
</svg>
