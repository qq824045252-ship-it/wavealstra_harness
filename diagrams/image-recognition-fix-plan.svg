<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780">
  <rect x="0" y="0" width="1400" height="780" fill="#f6f7fb"/>
  <rect x="0" y="0" width="1400" height="46" fill="#e9ecf4"/>
  <text x="24" y="30" font-size="20" font-weight="bold" fill="#1a2333" font-family="sans-serif">图片识别问题修复方案（8 项 · P0 起步 · 每项含验证门）</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#556077"/></marker>
  </defs>

  <!-- P0 lane -->
  <rect x="24" y="70" width="70" height="40" rx="8" fill="#c0392b"/>
  <text x="59" y="96" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff" font-family="sans-serif">P0</text>
  <rect x="110" y="70" width="470" height="150" rx="8" fill="#fff0f0" stroke="#c0392b" stroke-width="2"/>
  <text x="126" y="96" font-size="13" font-weight="bold" fill="#8e2b20" font-family="sans-serif">F1 · 打包补齐 Photon resize 资产</text>
  <text x="126" y="118" font-size="11" fill="#556077" font-family="sans-serif">electron.vite.config.ts：仿 buildPiCodemodeAssets 把</text>
  <text x="126" y="136" font-size="11" fill="#556077" font-family="sans-serif">image-resize-worker.js + photon_rs_bg.wasm emit 进 out/main；</text>
  <text x="126" y="154" font-size="11" fill="#556077" font-family="sans-serif">若 chunk 内 __dirname 解析不对，经 patches/ 修正 fallback 路径</text>
  <text x="126" y="176" font-size="11" fill="#2f7d47" font-family="sans-serif">验证：打包目录实测 resizeImage成功 + 新增 out/main 资产断言测试</text>
  <text x="126" y="200" font-size="11" fill="#556077" font-family="sans-serif">一次救活：DurableImages / 委托 Vision / web-access 三处调用点</text>

  <rect x="620" y="70" width="380" height="150" rx="8" fill="#fff0f0" stroke="#c0392b"/>
  <text x="636" y="96" font-size="13" font-weight="bold" fill="#8e2b20" font-family="sans-serif">F2 · vision 配置恢复 + 防静默断线</text>
  <text x="636" y="118" font-size="11" fill="#556077" font-family="sans-serif">恢复 capabilities.json 的 vision.enabled=true（先备份前值）；</text>
  <text x="636" y="136" font-size="11" fill="#556077" font-family="sans-serif">聊天输入框在 vision disabled/无可用委托模型时挂"图像理解已关闭"</text>
  <text x="636" y="154" font-size="11" fill="#556077" font-family="sans-serif">微标（点击直达设置）；保存 capabilities 前写 .bak 便于追溯</text>
  <text x="636" y="176" font-size="11" fill="#2f7d47" font-family="sans-serif">验证：恢复后 describe_image 重新注册（内置能力清单检查）</text>
  <text x="636" y="200" font-size="11" fill="#556077" font-family="sans-serif">涉及：CapabilitiesTab.tsx / appStore 状态广播（新事件）</text>

  <!-- F1 arrow to affected modules -->
  <rect x="1050" y="70" width="326" height="150" rx="8" fill="#ffffff" stroke="#5b7f9d"/>
  <text x="1066" y="96" font-size="12" font-weight="bold" fill="#1a2333" font-family="sans-serif">F1 恢复的三条链路</text>
  <text x="1066" y="120" font-size="11" fill="#556077" font-family="sans-serif">Bot durable read：不再 raw 直发/报错</text>
  <text x="1066" y="142" font-size="11" fill="#556077" font-family="sans-serif">委托 Vision：resize 后可正常出描述</text>
  <text x="1066" y="164" font-size="11" fill="#556077" font-family="sans-serif">web-access 抓图：2000×2000 缩放生效</text>
  <text x="1066" y="200" font-size="11" fill="#556077" font-family="sans-serif">（截图 native 直读无 resize 属 F6 处理）</text>

  <!-- P1 lane -->
  <rect x="24" y="260" width="70" height="40" rx="8" fill="#e07b39"/>
  <text x="59" y="286" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff" font-family="sans-serif">P1</text>
  <rect x="110" y="246" width="430" height="190" rx="8" fill="#fdf3ee" stroke="#e07b39"/>
  <text x="126" y="272" font-size="13" font-weight="bold" fill="#8a5a1d" font-family="sans-serif">F3 · MIME 修正（按字节，不信扩展名）</text>
  <text x="126" y="294" font-size="11" fill="#556077" font-family="sans-serif">loadAttachmentImages / nativeImageContent / VisionModelCapabilityProvider</text>
  <text x="126" y="312" font-size="11" fill="#556077" font-family="sans-serif">统一改用 pi-durable detectSupportedImageMimeType（32 字节头 sniff）</text>
  <text x="126" y="330" font-size="11" fill="#8a5a1d" font-family="sans-serif">修掉：JPEG 存 .png、native 默认 png vs 委托默认 jpeg 两套表</text>
  <text x="126" y="352" font-size="11" fill="#2f7d47" font-family="sans-serif">验证：mismatch/无扩展名/avif 三类用例打进新单测</text>
  <text x="126" y="372" font-size="11" fill="#556077" font-family="sans-serif">saveTempFile 扩展名 = 字节判定 > 原名 > mimeType</text>
  <text x="126" y="410" font-size="11" fill="#556077" font-family="sans-serif">沿用 pi 声明格式，不引入第二实现（保持单一来源）</text>

  <rect x="560" y="246" width="430" height="190" rx="8" fill="#fdf3ee" stroke="#e07b39"/>
  <text x="576" y="272" font-size="13" font-weight="bold" fill="#8a5a1d" font-family="sans-serif">F4 · durable 链路补齐预处理</text>
  <text x="576" y="294" font-size="11" fill="#556077" font-family="sans-serif">withDurableImageRead 传入 model.inputLimits.images.resize</text>
  <text x="576" y="312" font-size="11" fill="#556077" font-family="sans-serif">DurableBotService.admit 附件先过同一 resizeImage（EXIF/转码随之修复）</text>
  <text x="576" y="330" font-size="11" fill="#8a5a1d" font-family="sans-serif">修掉：与主会话链路行为分叉、BMP 直发必 400</text>
  <text x="576" y="352" font-size="11" fill="#2f7d47" font-family="sans-serif">验证：durable-bot-test 增补 超 limit 图 + JPEG-as-png 用例</text>
  <text x="576" y="372" font-size="11" fill="#556077" font-family="sans-serif">persistDurableImages 顺手补 0 字节拦截（对齐 Materializer:218）</text>
  <text x="576" y="410" font-size="11" fill="#556077" font-family="sans-serif">非视觉模型检查对齐 pi read.js:40-45 的 omit 注释行为</text>

  <rect x="1010" y="246" width="366" height="190" rx="8" fill="#fdf3ee" stroke="#e07b39"/>
  <text x="1026" y="272" font-size="13" font-weight="bold" fill="#8a5a1d" font-family="sans-serif">F5 · 静默降级全部改显式</text>
  <text x="1026" y="294" font-size="11" fill="#556077" font-family="sans-serif">① visionAwareImageResult 非 native 失败：结果文本前加 ⚠ 提示</text>
  <text x="1026" y="312" font-size="11" fill="#556077" font-family="sans-serif">② capture_after 失败：结果顶部显式文本（或 capture-only isError）</text>
  <text x="1026" y="330" font-size="11" fill="#556077" font-family="sans-serif">③ promptText 只在 images 实际载入 N 张时才断言"已直读"</text>
  <text x="1026" y="348" font-size="11" fill="#556077" font-family="sans-serif">④ loadAttachmentImages &gt;12MB：先 resize 再判，仍失败则随消息告示</text>
  <text x="1026" y="366" font-size="11" fill="#556077" font-family="sans-serif">⑤ saveTempFile &gt;25MB 返回错误而不是 null → UI toast</text>
  <text x="1026" y="384" font-size="11" fill="#556077" font-family="sans-serif">⑥ errorResult 带 Windows 错误码 + recovery guidance</text>
  <text x="1026" y="410" font-size="11" fill="#2f7d47" font-family="sans-serif">验证：各失败分支断言提示文本存在（新增 E2E 一条）</text>

  <!-- P2 lane -->
  <rect x="24" y="500" width="70" height="40" rx="8" fill="#5b7f9d"/>
  <text x="59" y="526" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff" font-family="sans-serif">P2</text>
  <rect x="110" y="486" width="430" height="170" rx="8" fill="#eef2f8" stroke="#5b7f9d"/>
  <text x="126" y="512" font-size="13" font-weight="bold" fill="#1a2333" font-family="sans-serif">F6 · native 直读统一闸门 + 特型文件处理</text>
  <text x="126" y="534" font-size="11" fill="#556077" font-family="sans-serif">nativeImageContent / visionAwareImageResult 注入前按 inputLimits resize</text>
  <text x="126" y="552" font-size="11" fill="#556077" font-family="sans-serif">12MB 早拒改为"先 resize 再判"；Promise.all 改逐图隔离</text>
  <text x="126" y="570" font-size="11" fill="#556077" font-family="sans-serif">APNG/AVIF/ICO：显式"不支持，请转 PNG"错误，不再乱码/静默省略</text>
  <text x="126" y="598" font-size="11" fill="#2f7d47" font-family="sans-serif">验证：大图走 native 分支成功注入 resize 结果</text>
  <text x="126" y="630" font-size="11" fill="#556077" font-family="sans-serif">改动点：builtin-capability-extension.ts:128-133/155-163</text>

  <rect x="560" y="486" width="430" height="170" rx="8" fill="#eef2f8" stroke="#5b7f9d"/>
  <text x="576" y="512" font-size="13" font-weight="bold" fill="#1a2333" font-family="sans-serif">F7 · 测试与门禁补盲区</text>
  <text x="576" y="534" font-size="11" fill="#556077" font-family="sans-serif">- loadAttachmentImages 单测：mismatch/超限/缺失/0字节</text>
  <text x="576" y="552" font-size="11" fill="#556077" font-family="sans-serif">- VisionRouting 路由单测（现为 0 覆盖）</text>
  <text x="576" y="570" font-size="11" fill="#556077" font-family="sans-serif">- ModelInvocationAdmission 三条薄校验专项测试（文档§3.3 闭环）</text>
  <text x="576" y="588" font-size="11" fill="#556077" font-family="sans-serif">- 修 computer-automation-windows 的 DPI 坐标映射后移出</text>
  <text x="576" y="606" font-size="11" fill="#556077" font-family="sans-serif">  EXCLUDE（严禁进 baseline 容忍）</text>
  <text x="576" y="630" font-size="11" fill="#2f7d47" font-family="sans-serif">验证：pnpm -s test:all 无新增失败 + baseline 无新增</text>

  <rect x="1010" y="486" width="366" height="170" rx="8" fill="#eef2f8" stroke="#5b7f9d"/>
  <text x="1026" y="512" font-size="13" font-weight="bold" fill="#1a2333" font-family="sans-serif">F8 · 多模态判定可信化（观察面）</text>
  <text x="1026" y="534" font-size="11" fill="#556077" font-family="sans-serif">commandcode 刷新补拉 input/事实字段，不再默认静默补 ["text"]</text>
  <text x="1026" y="552" font-size="11" fill="#556077" font-family="sans-serif">DurableDomainTools:85 getModel 键匹配对齐 DurableBotRuntime:429</text>
  <text x="1026" y="570" font-size="11" fill="#556077" font-family="sans-serif">的 azure 别名映射；ctx.model 缺失时直接走委托并注明原因</text>
  <text x="1026" y="598" font-size="11" fill="#2f7d47" font-family="sans-serif">验证：真实任务 details.vision.route 显示 native-multimodal</text>
  <text x="1026" y="630" font-size="11" fill="#556077" font-family="sans-serif">需远端字段可用性确认，先做本地别名修复</text>

  <!-- Delivery footer -->
  <rect x="24" y="690" width="1352" height="60" rx="8" fill="#e9ecf4" stroke="#556077"/>
  <text x="40" y="713" font-size="12" font-weight="bold" fill="#1a2333" font-family="sans-serif">交付流程：F1+F2 一批（当天见效）→ F3-F5 一批 → F6-F8 一批；每批 pnpm -s typecheck + 相关 test:* → 全量 pnpm -s test:all 棘轮 → bump 版本 → 打包实测含 resizeImage 烟测 → 按默认 release 工作流提交 main 并部署快捷方式</text>
  <text x="40" y="735" font-size="11" fill="#556077" font-family="sans-serif">F1 是其余修复的根依赖：F3-F6 的 resize 相关验证门都建立在 F1 生效之上。</text>
</svg>
