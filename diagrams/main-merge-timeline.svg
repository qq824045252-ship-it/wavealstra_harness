  <text x="332" y="467" font-size="14" font-weight="600" fill="#111827">此后没有 PR：a34dbdd → b550444 → 5ea05fa → 386e383 → 5d5f798 全部直接提交 main</text>
  <text x="332" y="489" font-size="12" fill="#64748b">今天 09:24–09:32 的 4 个提交都在这一段，所以与远端无关</text>

  <text x="40" y="534" font-size="12" fill="#64748b">交叉验证：merge 提交的 parent2 等于对应分支 tip；GitHub merged_at（UTC）换算 +8 后与提交时间分秒吻合；main 上无 revert 这些 merge 的提交。</text>
