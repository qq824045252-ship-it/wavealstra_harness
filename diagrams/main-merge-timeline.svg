  <!-- row 3 -->
  <circle cx="300" cy="310" r="9" fill="#1d4ed8"/>
  <text x="278" y="315" font-size="13" fill="#334155" text-anchor="end">2026-11-04 19:49</text>
  <text x="332" y="307" font-size="14" font-weight="600" fill="#111827">PR #13 · feat/scoped-library-management</text>
  <text x="332" y="329" font-size="12" fill="#64748b">merge fd31085，parent2 = a6b3f2e（先于 #12 合入，编号大不代表后合）</text>

  <!-- row 4 -->
  <circle cx="300" cy="390" r="9" fill="#1d4ed8"/>
  <text x="278" y="395" font-size="13" fill="#334155" text-anchor="end">2026-11-04 19:53</text>
  <text x="332" y="387" font-size="14" font-weight="600" fill="#111827">PR #12 · feat/unified-media-services-20261104</text>
  <text x="332" y="409" font-size="12" fill="#64748b">merge 174b1d3，parent2 = c557c97 · 这是 main 上最后一个 merge commit</text>

  <!-- row 5 -->
  <circle cx="300" cy="470" r="9" fill="#ea580c"/>
