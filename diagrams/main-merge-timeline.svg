<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="1120" height="560" fill="#ffffff" rx="14"/>

  <text x="40" y="50" font-size="24" font-weight="700" fill="#111827">4 个远端分支并入 main 的时间线</text>
  <text x="40" y="78" font-size="13" fill="#6b7280">全部为 GitHub PR merge commit · 合并时间取自 merge 提交时间，并与 GitHub API merged_at 核对</text>

  <line x1="300" y1="120" x2="300" y2="500" stroke="#cbd5e1" stroke-width="3"/>

  <!-- row 1 -->
  <circle cx="300" cy="150" r="9" fill="#1d4ed8"/>
  <text x="278" y="155" font-size="13" fill="#334155" text-anchor="end">2026-10-27 18:58</text>
  <text x="332" y="147" font-size="14" font-weight="600" fill="#111827">PR #8 · chore/hygiene-node24-acp-cleanup</text>
  <text x="332" y="169" font-size="12" fill="#64748b">merge 408fdfd，parent2 = f572a2a（分支 tip）</text>

  <!-- row 2 -->
  <circle cx="300" cy="230" r="9" fill="#1d4ed8"/>
  <text x="278" y="235" font-size="13" fill="#334155" text-anchor="end">2026-11-01 11:39</text>
  <text x="332" y="227" font-size="14" font-weight="600" fill="#111827">PR #11 · fix/a0-a5-harness-min-patches</text>
