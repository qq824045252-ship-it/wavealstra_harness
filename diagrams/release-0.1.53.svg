<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-label="MyBuddy 0.1.53 构建与旧包清理流程">
  <rect x="0" y="0" width="1280" height="700" fill="#FBFCFE"/>
  <text x="44" y="46" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#111827">MyBuddy 0.1.53：检查 → 门禁 → 构建 → 验收 → 换快捷方式 → 清旧包</text>
  <text x="44" y="76" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#5B6472">全部数字来自本次真实构建与探针；release 目录最终只保留 0.1.53</text>

  <!-- stage row -->
  <rect x="40" y="104" width="250" height="132" rx="12" fill="#EEF4FF" stroke="#9DBEF0" stroke-width="1.2"/>
  <text x="60" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#12305C">① Git 检查</text>
  <text x="60" y="154" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">main == origin/main（0 / 0）</text>
  <text x="60" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">HEAD 6672d04</text>
  <text x="60" y="198" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">无未提交源码改动</text>
  <text x="60" y="220" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#6B7280">（仅未跟踪 diagrams / 诊断 artifacts）</text>

  <rect x="322" y="104" width="286" height="132" rx="12" fill="#F4F1FF" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="342" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#3B1D82">② 质量门禁</text>
  <text x="342" y="154" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">typecheck：passed，scripts 新增 0</text>
  <text x="342" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">test:all：245 通过 / 0 失败 / 0 回归</text>
  <text x="342" y="198" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">耗时 1.8 分钟</text>

  <rect x="640" y="104" width="286" height="132" rx="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2"/>
  <text x="660" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#7C2D12">③ 构建（09:46 → 09:48）</text>
  <text x="660" y="154" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">remote:build → electron-vite build</text>
  <text x="660" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">→ electron-builder --win</text>
  <text x="660" y="198" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">afterPack 自动跑 payload 门禁</text>
  <text x="660" y="220" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#6B7280">output=release/0.1.53</text>

  <rect x="958" y="104" width="282" height="132" rx="12" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="978" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#065F46">④ 产物 release/0.1.53</text>
  <text x="978" y="154" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">win-unpacked：1288.2 MiB / 612 文件</text>
  <text x="978" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">MyBuddy Setup 0.1.53.exe：355 MB</text>
  <text x="978" y="198" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">exe 0.1.53 / ProductVersion 0.1.53.0</text>
  <text x="978" y="220" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#6B7280">app.asar 176,198,978 B</text>

  <!-- arrows stage row -->
  <line x1="290" y1="170" x2="312" y2="170" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#arrowGray)"/>
  <line x1="608" y1="170" x2="630" y2="170" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#arrowGray)"/>
  <line x1="926" y1="170" x2="948" y2="170" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#arrowGray)"/>

  <!-- acceptance row -->
  <rect x="40" y="282" width="376" height="150" rx="12" fill="#FFFFFF" stroke="#D8DEE9" stroke-width="1.2"/>
  <text x="60" y="308" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111827">⑤ payload 门禁（verify:packaged）</text>
  <text x="60" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">asarEntries 19617 · unpackedEntries 588</text>
  <text x="60" y="354" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">missingUnpacked 0</text>
  <text x="60" y="376" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">Pi subagent runtime 1.3.0 → exit 0</text>
  <text x="60" y="398" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#6B7280">PASS packaged payload can start runtime</text>

  <rect x="452" y="282" width="376" height="150" rx="12" fill="#FFFFFF" stroke="#D8DEE9" stroke-width="1.2"/>
  <text x="472" y="308" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111827">⑥ asar 身份（与新鲜构建对比）</text>
  <text x="472" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">renderer / main / remote 3 项 SHA256 全一致</text>
  <text x="472" y="354" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">打包 package.json version = 0.1.53</text>
  <text x="472" y="376" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">main bundle 含 “dsh --profile acp”</text>
  <text x="472" y="398" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#6B7280">含安装提示 “npm install -g @deepseek-ai/dsh”</text>

  <rect x="864" y="282" width="376" height="150" rx="12" fill="#FFFFFF" stroke="#D8DEE9" stroke-width="1.2"/>
  <text x="884" y="308" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111827">⑦ 打包后 ACP 目录探针（CDP）</text>
  <text x="884" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">隔离 profile 启动真实 MyBuddy.exe</text>
  <text x="884" y="354" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">10 行 · 8/10 可用</text>
  <text x="884" y="376" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">末行：DeepSeek Harness · 原生 ACP</text>
  <text x="884" y="398" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#6B7280">dsh --profile acp → 截图 acp-management-dsh.png</text>

  <!-- arrows to acceptance -->
  <line x1="1099" y1="240" x2="1099" y2="270" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#arrowGray)"/>
  <line x1="1052" y1="282" x2="1052" y2="262" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#arrowGray)"/>
  <line x1="640" y1="282" x2="640" y2="262" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#arrowGray)"/>
  <line x1="228" y1="282" x2="228" y2="262" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#arrowGray)"/>

  <!-- shortcuts + cleanup -->
  <rect x="40" y="470" width="590" height="168" rx="12" fill="#FFFFFF" stroke="#D8DEE9" stroke-width="1.2"/>
  <text x="60" y="496" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111827">⑧ 快捷方式改指 0.1.53</text>
  <text x="60" y="520" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">Desktop：MyBuddy 0.1.49.lnk → MyBuddy 0.1.53.lnk</text>
  <text x="60" y="542" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">Start Menu：MyBuddy.lnk → 同一 target</text>
  <text x="60" y="564" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">target = release\0.1.53\win-unpacked\MyBuddy.exe</text>
  <text x="60" y="586" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">cwd / icon / description “MyBuddy 0.1.53” 回读一致</text>
  <text x="60" y="608" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#6B7280">AUMID com.mybuddy.app 由 Electron shell 读写并断言</text>

  <rect x="662" y="470" width="578" height="168" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
  <text x="682" y="496" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#7F1D1D">⑨ 清理旧包（保留一个可接受版本）</text>
  <text x="682" y="520" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">删除 release\0.1.48 与 release\0.1.49</text>
  <text x="682" y="542" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">共 3254.6 MiB / 1232 个文件</text>
  <text x="682" y="564" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">删除前：0 个进程引用、快捷方式已不指向旧路径</text>
  <text x="682" y="586" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">删除后：保留包 exe/asar SHA256 未变</text>
  <text x="682" y="608" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#6B7280">启动复验：打包 ACP 探针再次 passed</text>

  <defs>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto"><path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#9CA3AF"/></marker>
  </defs>
</svg>
