  <line x1="245" y1="323" x2="308" y2="323" stroke="#57606a" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="430" y1="356" x2="430" y2="393" stroke="#57606a" stroke-width="1.5" marker-end="url(#a1)"/>

