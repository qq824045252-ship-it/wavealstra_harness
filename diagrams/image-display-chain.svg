  <text x="435" y="184" font-size="12" text-anchor="middle" fill="#57606a">MediaArtifactMaterializer.ts:149</text>

  <rect x="610" y="120" width="250" height="80" rx="8" fill="#ffffff" stroke="#7aa7d4"/>
