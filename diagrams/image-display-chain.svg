<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1180" height="760" fill="#f6f8fa"/>
