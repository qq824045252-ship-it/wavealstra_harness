  <text x="145" y="333" font-size="12" text-anchor="middle" fill="#57606a">ArtifactPanel.tsx:145</text>

  <rect x="310" y="290" width="240" height="66" rx="8" fill="#ffffff" stroke="#9fd4a8"/>
