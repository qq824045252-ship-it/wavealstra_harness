  <text x="735" y="180" font-size="12" text-anchor="middle" fill="#57606a">wx 写盘=同字节同文件=L14 行注释</text>
  <text x="735" y="196" font-size="12" text-anchor="middle" fill="#57606a">→ 消息 artifacts（DurableBotRuntime.ts:328）</text>

  <rect x="920" y="120" width="225" height="80" rx="8" fill="#ffffff" stroke="#7aa7d4"/>
