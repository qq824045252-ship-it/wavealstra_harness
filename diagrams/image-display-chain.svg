  <text x="1020" y="331" font-size="12" text-anchor="middle" fill="#57606a">chatImages.ts:76 精确路径匹配</text>
  <text x="1020" y="348" font-size="12" text-anchor="middle" fill="#57606a">taskId 绑定，不猜 basename</text>

  <rect x="630" y="395" width="220" height="66" rx="8" fill="#ffffff" stroke="#dcb5e6"/>
  <text x="740" y="418" font-size="13" text-anchor="middle" fill="#1f2430">directChatImageSource :5</text>
  <text x="740" y="436" font-size="12" text-anchor="middle" fill="#57606a">放行 data:image(png/jpeg/gif/</text>
  <text x="740" y="453" font-size="12" text-anchor="middle" fill="#57606a">webp/avif/bmp;base64) + https:</text>

  <rect x="905" y="395" width="230" height="66" rx="8" fill="#ffffff" stroke="#dcb5e6"/>
  <text x="1020" y="418" font-size="13" text-anchor="middle" fill="#1f2430">SVG 分支 :16/:42</text>
  <text x="1020" y="436" font-size="12" text-anchor="middle" fill="#57606a">kind=image 的 .svg 文件修正</text>
  <text x="1020" y="453" font-size="12" text-anchor="middle" fill="#57606a">→ Blob objectURL（脚本不执行）</text>

  <rect x="630" y="492" width="505" height="48" rx="8" fill="#fdfff0" stroke="#d9c96a"/>
  <text x="882" y="512" font-size="12.5" text-anchor="middle" fill="#5a5312">不安全源/未命中产物 → 不渲染破损 img，显示「图片无法显示…」+「打开产物」</text>
  <text x="882" y="530" font-size="12.5" text-anchor="middle" fill="#5a5312">http:/blob:/相对路径在 chat 内不直接放行（仅 SVG 经受控 Blob）</text>

