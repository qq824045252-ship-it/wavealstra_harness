  <rect x="468" y="248" width="444" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="482" y="270" font-size="12.5" fill="#374151"><tspan x="482" dy="0">DSH note L18/L32；COMPACTION_INSTRUCTION</tspan><tspan x="482" dy="18">追加在 messages 末尾，成为前缀扩展</tspan></text>
  <rect x="940" y="248" width="300" height="66" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="954" y="274" font-size="13" font-weight="700" fill="#166534"><tspan x="954" dy="0">成立（真·防抖）</tspan><tspan x="954" dy="20" font-weight="400">四原则里唯一直接复用前缀的</tspan></text>

  <!-- Row 3 -->
  <rect x="40" y="326" width="400" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
