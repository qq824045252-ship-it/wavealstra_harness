  <text x="54" y="508" font-size="13.5" fill="#111827"><tspan x="54" dy="0">L58：DSH 靠“节点替换留痕”控制 MCP 抖动</tspan><tspan x="54" dy="20">路线不同，但“同样可归因”</tspan></text>
  <rect x="468" y="482" width="444" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
