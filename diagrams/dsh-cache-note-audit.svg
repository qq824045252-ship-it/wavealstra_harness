  <!-- Row 1 -->
  <rect x="40" y="170" width="400" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="54" y="196" font-size="13.5" fill="#111827"><tspan x="54" dy="0">L17–21：系统提示 = surface 节点 0；变更 = replace</tspan><tspan x="54" dy="20">日志区分 series 与 change 两类变更</tspan></text>
  <rect x="468" y="170" width="444" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="482" y="192" font-size="12.5" fill="#374151"><tspan x="482" dy="0">DSH note L11/L31/L33；assertSystemHeadRewrite</tspan><tspan x="482" dy="18">拒绝覆盖第 0 号节点的范围替换</tspan></text>
