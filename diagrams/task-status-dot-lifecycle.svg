<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="1000" height="720" fill="#f7f9fc"/>
  <text x="28" y="34" font-size="20" font-weight="700" fill="#1a2433">侧栏任务状态点：蓝点 / 绿点 的真实判定与清除链路</text>
  <text x="28" y="56" font-size="12.5" fill="#5a6b82">修复前：绿点 = displayStatus==="done"（= status completed/failed），一旦结束就永久亮着，点击无效（本机 DB：83 个 completed 全部亮绿点）。修复后：绿点 = 已结束 且 未查看（done_acked_at &lt; 完成标记），点击任务即写库清除。</text>

  <!-- 判定链 -->
  <text x="28" y="92" font-size="14" font-weight="700" fill="#1a2433">判定链（渲染层，utils/taskFilters.ts）</text>

  <rect x="28" y="106" width="180" height="64" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="118" y="130" font-size="12" text-anchor="middle" fill="#1a2433">task.status / 消息推导</text>
  <text x="118" y="148" font-size="10.5" text-anchor="middle" fill="#5a6b82">getTaskDisplayStatus()</text>
  <text x="118" y="163" font-size="10.5" text-anchor="middle" fill="#5a6b82">pending &gt; running &gt; done &gt; idle</text>

  <rect x="248" y="106" width="190" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="343" y="130" font-size="12" text-anchor="middle" fill="#1a2433">running → 蓝点 #3b82f6</text>
  <text x="343" y="148" font-size="10.5" text-anchor="middle" fill="#5a6b82">task-pulse 呼吸动画</text>
  <text x="343" y="163" font-size="10.5" text-anchor="middle" fill="#5a6b82">进行中，无需确认</text>

  <rect x="478" y="106" width="230" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="593" y="128" font-size="12" text-anchor="middle" fill="#1a2433">done 且 doneAckedAt &lt; 完成标记</text>
  <text x="593" y="146" font-size="10.5" text-anchor="middle" fill="#166534">isTaskDoneUnread(task) = true</text>
  <text x="593" y="161" font-size="10.5" text-anchor="middle" fill="#166534">→ 绿点 #22c55e（未查看）</text>

  <rect x="748" y="106" width="224" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="860" y="128" font-size="12" text-anchor="middle" fill="#1a2433">done 但已确认</text>
  <text x="860" y="146" font-size="10.5" text-anchor="middle" fill="#475569">无点，只显示相对时间</text>
  <text x="860" y="161" font-size="10.5" text-anchor="middle" fill="#475569">（状态仍是「已结束」）</text>

  <line x1="208" y1="138" x2="248" y2="138" stroke="#6366f1" stroke-width="2" marker-end="url(#a)"/>
  <line x1="438" y1="138" x2="478" y2="138" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="708" y1="138" x2="748" y2="138" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#6366f1"/></marker>
    <marker id="d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#0ea5e9"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker>
  </defs>

  <!-- 完成标记 -->
  <rect x="28" y="196" width="944" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="218" font-size="12.5" font-weight="700" fill="#1a2433">完成标记 taskCompletionMark(task) = max(messages[].createdAt) ‖ updatedAt</text>
  <text x="44" y="240" font-size="11.5" fill="#5a6b82">取「最后一条消息时间」而不是 updatedAt：重命名 / 置顶 / 归档 / 绑专家都会推进 updatedAt，用它会让已确认的绿点靠噪声复活。</text>
  <text x="44" y="260" font-size="11.5" fill="#5a6b82">无消息时（例如启动即失败的远程任务）退回 updatedAt；再运行产生新消息 → 新 createdAt 超过水位 → 绿点自动回来。</text>
  <text x="44" y="277" font-size="11" fill="#b45309">边界：失败且完全没有新消息的结束不会抬升完成标记（不会亮绿点）。</text>

  <!-- 清除链路 -->
  <text x="28" y="314" font-size="14" font-weight="700" fill="#1a2433">清除链路（点击任务 → 持久化，已验证）</text>

  <rect x="28" y="328" width="150" height="58" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="103" y="350" font-size="11.5" text-anchor="middle" fill="#1a2433">TaskItem 点击 / Enter</text>
  <text x="103" y="368" font-size="10.5" text-anchor="middle" fill="#9a3412">setActiveTask(task.id)</text>

  <rect x="218" y="328" width="176" height="58" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="306" y="348" font-size="11.5" text-anchor="middle" fill="#1a2433">appStore.ackTaskDone(id)</text>
  <text x="306" y="366" font-size="10.5" text-anchor="middle" fill="#9a3412">仅当 isTaskDoneUnread</text>

  <rect x="434" y="328" width="200" height="58" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="534" y="348" font-size="11.5" text-anchor="middle" fill="#1a2433">乐观更新 doneAckedAt</text>
  <text x="534" y="366" font-size="10.5" text-anchor="middle" fill="#9a3412">侧栏同帧关绿点</text>

  <rect x="674" y="328" width="140" height="58" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="744" y="346" font-size="11" text-anchor="middle" fill="#1a2433">IPC db:ackTaskDone</text>
  <text x="744" y="363" font-size="10.5" text-anchor="middle" fill="#9a3412">(id, ackedAt)</text>

  <rect x="854" y="328" width="118" height="58" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="913" y="346" font-size="11" text-anchor="middle" fill="#1a2433">tasks.done_acked_at</text>
  <text x="913" y="363" font-size="10.5" text-anchor="middle" fill="#166534">不碰 updated_at</text>

  <line x1="178" y1="357" x2="218" y2="357" stroke="#ea580c" stroke-width="2" marker-end="url(#a)"/>
  <line x1="394" y1="357" x2="434" y2="357" stroke="#ea580c" stroke-width="2" marker-end="url(#a)"/>
  <line x1="634" y1="357" x2="674" y2="357" stroke="#ea580c" stroke-width="2" marker-end="url(#a)"/>
  <line x1="814" y1="357" x2="854" y2="357" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>

  <!-- 自动确认 -->
  <rect x="28" y="404" width="944" height="58" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="44" y="426" font-size="12.5" font-weight="700" fill="#1a2433">例外：正看着它跑完就不必再点一次</text>
  <text x="44" y="447" font-size="11.5" fill="#5a6b82">仅当 该任务是当前任务 ∧ page==="chat" ∧ 文档可见 ∧ 窗口在前台 时自动确认（TaskItem 内 useEffect）；在后台跑完则保留绿点，等你回来点。</text>

  <!-- 状态机 -->
  <text x="28" y="494" font-size="14" font-weight="700" fill="#1a2433">状态迁移（每个任务的绿点生命周期）</text>

  <rect x="28" y="510" width="130" height="54" rx="26" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="93" y="534" font-size="12" text-anchor="middle" fill="#1a2433">无点（空闲/单程）</text>
  <text x="93" y="551" font-size="10" text-anchor="middle" fill="#475569">计划中 / 无消息</text>

  <rect x="216" y="510" width="130" height="54" rx="26" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="281" y="534" font-size="12" text-anchor="middle" fill="#1a2433">蓝点（进行中）</text>
  <text x="281" y="551" font-size="10" text-anchor="middle" fill="#1d4ed8">status in_progress</text>

  <rect x="404" y="510" width="140" height="54" rx="26" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="474" y="534" font-size="12" text-anchor="middle" fill="#1a2433">绿点（已结束未看）</text>
  <text x="474" y="551" font-size="10" text-anchor="middle" fill="#166534">done_acked_at &lt; 标记</text>

  <rect x="602" y="510" width="150" height="54" rx="26" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="677" y="534" font-size="12" text-anchor="middle" fill="#1a2433">无点（已结束已看）</text>
  <text x="677" y="551" font-size="10" text-anchor="middle" fill="#475569">水位追平完成标记</text>

  <rect x="810" y="510" width="162" height="54" rx="26" fill="#fef2f2" stroke="#dc2626"/>
  <text x="891" y="530" font-size="12" text-anchor="middle" fill="#1a2433">待确认徽标</text>
  <text x="891" y="548" font-size="10" text-anchor="middle" fill="#b91c1c">pending_approval / 待回答</text>

  <line x1="158" y1="537" x2="216" y2="537" stroke="#3b82f6" stroke-width="2" marker-end="url(#d)"/>
  <line x1="346" y1="537" x2="404" y2="537" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
  <line x1="544" y1="537" x2="602" y2="537" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="752" y1="537" x2="810" y2="537" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <text x="375" y="528" font-size="10" text-anchor="middle" fill="#166534">结束</text>
  <text x="573" y="528" font-size="10" text-anchor="middle" fill="#475569">点击</text>
  <text x="781" y="528" font-size="10" text-anchor="middle" fill="#b91c1c">等待用户</text>

  <!-- 回环 -->
  <path d="M 677 570 C 677 620 474 620 474 570" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <text x="575" y="636" font-size="10.5" text-anchor="middle" fill="#166534">再次运行并产出新消息（createdAt 超过水位）→ 绿点回来</text>
  <path d="M 281 570 C 281 600 93 600 93 570" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#d)"/>
  <text x="187" y="600" font-size="10.5" text-anchor="middle" fill="#1d4ed8">发新消息</text>

  <!-- 迁移 -->
  <rect x="28" y="660" width="944" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="44" y="680" font-size="11.5" fill="#1a2433">升级迁移（已验证）：首次补 tasks.done_acked_at 列时，把既有行回填为 updated_at（= 历史视为已读）——否则 83 个历史完成任务会同时亮绿点。</text>
  <text x="44" y="697" font-size="11.5" fill="#5a6b82">回填只在加列那一次发生（列已存在即跳过）；之后新任务保持 NULL，跑完才亮绿点。</text>
</svg>
