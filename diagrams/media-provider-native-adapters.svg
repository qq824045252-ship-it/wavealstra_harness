<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="新增 FLUX 与百炼原生媒体 provider 的真实链路">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="20" y="30" font-family="system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#111827">新增原生媒体 provider：设置 → 适配器 → 异步任务轮询 → 产物</text>
  <text x="20" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">实线为已实现的代码路径；括号内是真实文件/函数名。两条 provider 共用凭据解析与视频任务台账，只在下单/轮询/下载三处不同。</text>

  <!-- Row 1: presets -->
  <rect x="16" y="72" width="252" height="96" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="28" y="94" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#111827">① 设置页选择服务</text>
  <text x="28" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#1f2937">＋ Black Forest Labs（FLUX）</text>
  <text x="28" y="133" font-family="system-ui, sans-serif" font-size="12" fill="#1f2937">＋ 阿里云百炼（千问 / 万相）</text>
  <text x="28" y="153" font-family="Consolas, monospace" font-size="11" fill="#4b5563">shared/media-capabilities.ts</text>

  <line x1="268" y1="120" x2="292" y2="120" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="294" y="72" width="226" height="96" rx="8" fill="#eef6ff" stroke="#2563eb"/>
  <text x="306" y="94" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#111827">② 凭据 → 请求头</text>
  <text x="306" y="115" font-family="Consolas, monospace" font-size="11" fill="#1e3a8a">resolveApi() · MediaCapabilityServices</text>
  <text x="306" y="134" font-family="system-ui, sans-serif" font-size="12" fill="#111827">FLUX → x-key: &lt;key&gt;</text>
  <text x="306" y="152" font-family="system-ui, sans-serif" font-size="12" fill="#111827">百炼 → authorization: Bearer</text>

  <line x1="520" y1="120" x2="544" y2="120" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="546" y="72" width="238" height="96" rx="8" fill="#eef6ff" stroke="#2563eb"/>
  <text x="558" y="94" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#111827">③ 按协议分发适配器</text>
  <text x="558" y="114" font-family="Consolas, monospace" font-size="11" fill="#1e3a8a">apiMediaProvider()</text>
  <text x="558" y="132" font-family="system-ui, sans-serif" font-size="12" fill="#111827">black-forest-labs → BFL provider</text>
  <text x="558" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#111827">dashscope → DashScope provider</text>

  <line x1="784" y1="120" x2="808" y2="120" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="810" y="72" width="134" height="96" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="822" y="94" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#111827">④ 下单</text>
  <text x="822" y="114" font-family="Consolas, monospace" font-size="11" fill="#14532d">POST /v1/{model}</text>
  <text x="822" y="132" font-family="Consolas, monospace" font-size="11" fill="#14532d">POST /services/aigc/…</text>
  <text x="822" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#374151">→ task_id / polling_url</text>

  <!-- Row 2: poll + download -->
  <rect x="810" y="196" width="134" height="96" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="822" y="218" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#111827">⑤ 轮询</text>
  <text x="822" y="238" font-family="Consolas, monospace" font-size="11" fill="#14532d">GET polling_url</text>
  <text x="822" y="256" font-family="Consolas, monospace" font-size="11" fill="#14532d">GET /get_result?id=…</text>
  <text x="822" y="274" font-family="Consolas, monospace" font-size="11" fill="#14532d">GET /tasks/{task_id}</text>

  <line x1="877" y1="168" x2="877" y2="196" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>

  <line x1="810" y1="244" x2="786" y2="244" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="546" y="196" width="238" height="96" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="558" y="218" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#111827">⑥ 下载产物</text>
  <text x="558" y="238" font-family="system-ui, sans-serif" font-size="12" fill="#111827">签名 CDN：https、不带凭据</text>
  <text x="558" y="256" font-family="system-ui, sans-serif" font-size="12" fill="#111827">校验 content-type 与文件头</text>
  <text x="558" y="274" font-family="system-ui, sans-serif" font-size="12" fill="#111827">items[{bytes, mimeType}]</text>

  <line x1="546" y1="244" x2="522" y2="244" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="294" y="196" width="226" height="96" rx="8" fill="#fff7ed" stroke="#d97706"/>
  <text x="306" y="218" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#111827">⑦ 视频任务台账</text>
  <text x="306" y="238" font-family="Consolas, monospace" font-size="11" fill="#7c2d12">VideoGenerationJobs</text>
  <text x="306" y="256" font-family="system-ui, sans-serif" font-size="12" fill="#111827">submitting → queued → completed</text>
  <text x="306" y="274" font-family="system-ui, sans-serif" font-size="12" fill="#111827">超时 → paused + job_id 恢复</text>

  <!-- footer notes -->
  <rect x="16" y="320" width="928" height="86" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="28" y="344" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#111827">关键约束（代码里已实现）</text>
  <text x="28" y="366" font-family="system-ui, sans-serif" font-size="12" fill="#1f2937">• 计费 POST 之前先写 job 意图：本地等待超时只暂停等待（VideoJobPendingError），恢复按 job_id 只轮询已存 remoteId，绝不重复下单。</text>
  <text x="28" y="386" font-family="system-ui, sans-serif" font-size="12" fill="#1f2937">• 远端终态 FAILED / 审核拒绝 → job failed + ApiProviderError("video-failed")；所有错误、日志与台账都不含 API Key。</text>
  <text x="28" y="406" font-family="system-ui, sans-serif" font-size="12" fill="#1f2937">• 不支持的字段/模型走 unsupported 并在离网前拒绝：百炼 wan2.7-i2v（独立模型）与 FLUX 的 video-edit/upscale 不在本工具入参范围。</text>

  <rect x="16" y="418" width="928" height="86" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="28" y="442" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#111827">验证（只测试、未构建）</text>
  <text x="28" y="464" font-family="system-ui, sans-serif" font-size="12" fill="#1f2937">新增套件：test:black-forest-labs-provider、test:dashscope-provider（全 fake fetch，零联网）；14 个 headless 套件全绿；typecheck（web+node+scripts）通过。</text>
  <text x="28" y="486" font-family="system-ui, sans-serif" font-size="12" fill="#1f2937">未执行：build / pack / dist / Electron GUI 套件（按「只测试」约束）；未提交 git。真实结果 URL 键名按官方公开示例防御式解析，首次真实调用需确认。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
