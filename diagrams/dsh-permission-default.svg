<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="1120" height="640" fill="#f7f8fa"/>
  <text x="24" y="36" font-size="21" font-weight="700" fill="#1b2330">DSH 权限预设：改前 / 改后</text>
  <text x="24" y="60" font-size="13" fill="#53606f">实线=已核对的文件与运行时事实 · 虚线=配置生效路径（推断）</text>

  <!-- resolution chain -->
  <text x="24" y="96" font-size="14" font-weight="700" fill="#1b2330">生效链路（web profile）</text>

  <rect x="24" y="110" width="190" height="64" rx="8" fill="#ffffff" stroke="#c9ccd2"/>
  <text x="36" y="134" font-size="13" font-weight="700" fill="#1b2330">bundle 默认值</text>
  <text x="36" y="154" font-size="12" fill="#53606f">dsh-base / dsh-web-app</text>
  <text x="36" y="168" font-size="12" fill="#53606f">sandbox=workspace-write</text>

  <rect x="248" y="110" width="220" height="64" rx="8" fill="#ffffff" stroke="#c9ccd2"/>
  <text x="260" y="134" font-size="13" font-weight="700" fill="#1b2330">patch 层（后写覆盖）</text>
  <text x="260" y="154" font-size="12" fill="#53606f">profiles/web/cordis.patch.yml</text>
  <text x="260" y="168" font-size="12" fill="#53606f">id: permission / sandbox-policy / approval</text>

  <rect x="502" y="110" width="230" height="64" rx="8" fill="#ffffff" stroke="#c9ccd2"/>
  <text x="514" y="134" font-size="13" font-weight="700" fill="#1b2330">defaultPreset</text>
  <text x="514" y="154" font-size="12" fill="#53606f">新会话的初始权限预设</text>
  <text x="514" y="168" font-size="12" fill="#53606f">= “完全权限”</text>

  <rect x="766" y="110" width="330" height="64" rx="8" fill="#ffffff" stroke="#c9ccd2"/>
  <text x="778" y="134" font-size="13" font-weight="700" fill="#1b2330">会话内可覆盖</text>
  <text x="778" y="154" font-size="12" fill="#53606f">sandbox/mode 事件（UI 里切换 Permissions）</text>
  <text x="778" y="168" font-size="12" fill="#53606f">只影响该会话，不改默认值</text>

  <g stroke="#7f8ea3" stroke-width="1.5" fill="none">
    <line x1="214" y1="142" x2="242" y2="142" marker-end="url(#a1)"/>
    <line x1="468" y1="142" x2="496" y2="142" marker-end="url(#a1)"/>
    <line x1="732" y1="142" x2="760" y2="142" marker-end="url(#a1)"/>
  </g>
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7f8ea3"/>
    </marker>
  </defs>

  <!-- before / after -->
  <rect x="24" y="208" width="520" height="190" rx="10" fill="#fff5f5" stroke="#e0a3a3" stroke-width="1.5"/>
  <text x="44" y="234" font-size="15" font-weight="700" fill="#a12a2a">改前：web profile（本会话一度如此）</text>
  <text x="44" y="262" font-size="13" fill="#3a3f47">cordis.patch.yml 里没有 permission / sandbox-policy / approval 三条</text>
  <text x="44" y="284" font-size="13" fill="#3a3f47">→ 落回 bundle 默认：sandbox = workspace-write、approval = ask</text>
  <text x="44" y="306" font-size="13" fill="#a12a2a">→ 进程跑在 Low 完整性：写 ~/.mybuddy 被拒、打包载荷（Medium）删不掉、</text>
  <text x="44" y="326" font-size="13" fill="#a12a2a">   MyBuddy 起不来（读不到数据库）、子进程 spawn 拿不到管道</text>
  <text x="44" y="356" font-size="12" fill="#53606f">实测：taskkill 拒绝、rmdir 586 个文件被拒、node dump-config EPERM</text>
  <text x="44" y="376" font-size="12" fill="#53606f">注意：desktop profile 早就有这三条，所以只有 web/DSH Shell 卡沙箱</text>

  <rect x="576" y="208" width="520" height="190" rx="10" fill="#f2fbf5" stroke="#8fbc9b" stroke-width="1.5"/>
  <text x="596" y="234" font-size="15" font-weight="700" fill="#1e6b3a">改后：已写入 web profile patch</text>
  <text x="596" y="262" font-size="13" fill="#3a3f47">permission.presets.danger-full-access = { sandbox: danger-full-access,</text>
  <text x="596" y="282" font-size="13" fill="#3a3f47">                                            approval: never }</text>
  <text x="596" y="302" font-size="13" fill="#3a3f47">permission.defaultPreset = danger-full-access</text>
  <text x="596" y="322" font-size="13" fill="#3a3f47">sandbox-policy.mode = danger-full-access · approval.policy = never</text>
  <text x="596" y="352" font-size="12" fill="#1e6b3a">已备份：cordis.patch.yml.bak-fullaccess-2026-10-20T04-21-07-872Z</text>
  <text x="596" y="372" font-size="12" fill="#1e6b3a">重启后本会话实测：danger-full-access、Medium 完整性、可写 ~/.mybuddy</text>

  <!-- verified status -->
  <rect x="24" y="424" width="1072" height="180" rx="10" fill="#ffffff" stroke="#7f8ea3" stroke-width="1.5"/>
  <text x="44" y="452" font-size="15" font-weight="700" fill="#1b2330">当前事实（2026-10-20 12:35 之后）</text>
  <text x="44" y="480" font-size="13" fill="#1e6b3a">✔ 本会话策略 = danger-full-access / approval never（运行时上下文已切换，Medium 完整性）</text>
  <text x="44" y="502" font-size="13" fill="#1e6b3a">✔ 写 ~/.mybuddy 成功 → 之前起不来的根因（读不到 app.db）已解除</text>
  <text x="44" y="524" font-size="13" fill="#1e6b3a">✔ release-p1 / release-p1b 两个残包已删除，只剩 release（0.1.46，闸门 PASS）</text>
  <text x="44" y="546" font-size="13" fill="#1e6b3a">✔ MyBuddy 正跑在 release\win-unpacked（12:19 你自己启动的），打包 worker 探测输出 1.3.0</text>
  <text x="44" y="574" font-size="12" fill="#53606f">待办：跑一次真实 subagent（App 内点“子代理”自检，或发一句让它委派）才能把“App→worker→模型”整链闭合；</text>
  <text x="44" y="592" font-size="12" fill="#53606f">usage-archive.jsonl 里最后一批记录仍是 11:23:52 的失败批次，说明重启后还没有跑过 subagent。</text>
</svg>
