<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1180" height="760" fill="#f7f9fc"/>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#111827">安卓端删除任务 — 全链路</text>
  <text x="40" y="74" font-size="13" fill="#4b5563">复用桌面端同一条安全回收链路：进回收站可恢复，不 rm -rf、不立即删 Artifact</text>

  <!-- Android layer -->
  <rect x="40" y="100" width="1100" height="196" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="58" y="126" font-size="13" font-weight="700" fill="#1d4ed8">安卓端 app/remote</text>

  <rect x="58" y="140" width="240" height="76" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="74" y="164" font-size="13" font-weight="700" fill="#1e3a8a">ChatPage 头部</text>
  <text x="74" y="184" font-size="12" fill="#1e3a8a">Trash2 图标按钮</text>
  <text x="74" y="201" font-size="12" fill="#1e3a8a">aria-label="删除任务"</text>

  <rect x="330" y="140" width="240" height="76" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="346" y="164" font-size="13" font-weight="700" fill="#1e3a8a">二次确认弹层</text>
  <text x="346" y="184" font-size="12" fill="#1e3a8a">remote-confirm-overlay</text>
  <text x="346" y="201" font-size="12" fill="#1e3a8a">取消 / 删除 · 失败就地显示</text>

  <rect x="602" y="140" width="250" height="76" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="618" y="164" font-size="13" font-weight="700" fill="#1e3a8a">store.deleteTask()</text>
  <text x="618" y="184" font-size="12" fill="#1e3a8a">client.deleteTask(taskId)</text>
  <text x="618" y="201" font-size="12" fill="#1e3a8a">409 也摘除本地条目</text>

  <rect x="884" y="140" width="238" height="76" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="900" y="164" font-size="13" font-weight="700" fill="#1e3a8a">本地即时生效</text>
  <text x="900" y="184" font-size="12" fill="#1e3a8a">tasks / histories / runtimes</text>
  <text x="900" y="201" font-size="12" fill="#1e3a8a">activeTaskId → 回首页</text>

  <line x1="298" y1="178" x2="324" y2="178" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="570" y1="178" x2="596" y2="178" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="852" y1="178" x2="878" y2="178" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrBlue)"/>

  <text x="58" y="248" font-size="12.5" fill="#475569">DELETE /v1/tasks/:id　Authorization: Bearer &lt;deviceToken&gt;</text>
  <text x="58" y="270" font-size="12.5" fill="#475569">CORS allow-methods 已加入 DELETE（sendJson 与 OPTIONS 预检两处）</text>
  <text x="58" y="290" font-size="12.5" fill="#059669">校验顺序：认证 401 → 任务存在 404 → 已归档 409 → 执行中 409 → 回收</text>

  <!-- Server layer -->
  <rect x="40" y="326" width="1100" height="222" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="58" y="352" font-size="13" font-weight="700" fill="#065f46">电脑端 src/main</text>

  <rect x="58" y="366" width="230" height="80" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="74" y="390" font-size="13" font-weight="700" fill="#065f46">RemoteAccessServer</text>
  <text x="74" y="410" font-size="12" fill="#065f46">taskMatch 加 DELETE 分支</text>
  <text x="74" y="427" font-size="12" fill="#065f46">action 为空才命中</text>

  <rect x="320" y="366" width="250" height="80" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="336" y="390" font-size="13" font-weight="700" fill="#065f46">commands.deleteTask()</text>
  <text x="336" y="410" font-size="12" fill="#065f46">isTaskEffectiveArchived → 409</text>
  <text x="336" y="427" font-size="12" fill="#065f46">isTaskBusy → 409</text>

  <rect x="602" y="366" width="250" height="80" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="618" y="390" font-size="13" font-weight="700" fill="#065f46">lifecycle.trash(id)</text>
  <text x="618" y="410" font-size="12" fill="#065f46">与 DbIpc.deleteTask 同源</text>
  <text x="618" y="427" font-size="12" fill="#065f46">archived=1 + ws_state=trashed</text>

  <rect x="884" y="366" width="238" height="80" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="900" y="390" font-size="13" font-weight="700" fill="#065f46">workGraph.cleanupByNode</text>
  <text x="900" y="410" font-size="12" fill="#065f46">("task", id)</text>
  <text x="900" y="427" font-size="12" fill="#065f46">失败不阻断删除</text>

  <line x1="288" y1="406" x2="314" y2="406" stroke="#16a34a" stroke-width="2" marker-end="url(#arrGreen)"/>
  <line x1="570" y1="406" x2="596" y2="406" stroke="#16a34a" stroke-width="2" marker-end="url(#arrGreen)"/>
  <line x1="852" y1="406" x2="878" y2="406" stroke="#16a34a" stroke-width="2" marker-end="url(#arrGreen)"/>

  <text x="58" y="480" font-size="12.5" fill="#475569">广播 events.publish("task.changed", { taskId }) → 其它手机/桌面端 resync</text>
  <text x="58" y="502" font-size="12.5" fill="#b45309">附件目录 remote-uploads/&lt;taskId&gt; 保留到 purge：回收区内任务仍可从桌面端恢复</text>
  <text x="58" y="524" font-size="12.5" fill="#059669">taskLifecycle 在控制器构造之后才初始化 → 用闭包延迟读取，调用时才解引用</text>

  <!-- Result -->
  <rect x="40" y="574" width="1100" height="80" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="58" y="600" font-size="13" font-weight="700" fill="#065f46">删除后的状态</text>
  <text x="58" y="622" font-size="12.5" fill="#065f46">手机端：任务从 /v1/tasks 与 /v1/bootstrap 消失，列表立即刷新，若正在看该任务则回首页</text>
  <text x="58" y="642" font-size="12.5" fill="#065f46">电脑端：任务进入回收站（TrashIpc.list 可见），可 restore 恢复；侧栏不再显示</text>

  <!-- tests -->
  <rect x="40" y="672" width="1100" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="58" y="696" font-size="13" font-weight="700" fill="#111827">验证</text>
  <text x="58" y="718" font-size="12.5" fill="#059669">test:remote-delete 18/18 · test:remote-access · test:remote-done-ack 18/18 · typecheck（web+node+remote）· remote:build · test:all 新增回归 0</text>

  <defs>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
