<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" role="img" aria-labelledby="t d">
  <title id="t">MyBuddy 远程接入：加固后的双通道与权限边界</title>
  <desc id="d">主通道为公网域名经 Cloudflare Tunnel 到 127.0.0.1:3352；备用通道为 Tailscale Serve 的 tailnet 域名同样反代到 3352。SYSTEM 计划任务每分钟看护隧道健康，目录 C:\ProgramData\cloudflared 已收紧为 Users 只读。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b5b57"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="640" fill="#f7f7f5"/>
  <text x="40" y="42" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1f1f1d">MyBuddy 远程接入：双通道 + 权限边界（2026-10-29 08:20）</text>
  <text x="40" y="66" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#55554f">实测：公网 /healthz 200；tailnet /healthz 200（来自 100.103.77.19）；非提权写目录 = UnauthorizedAccessException</text>

  <!-- 主通道 -->
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="40" y="86" width="190" height="92" rx="10" fill="#ffffff" stroke="#c9c9c3"/>
    <text x="56" y="112" font-size="13" font-weight="700" fill="#1f1f1d">主通道 · 公网</text>
    <text x="56" y="134" font-size="12" fill="#4a4a45">remote.vivioninst.uk</text>
    <text x="56" y="154" font-size="12" fill="#4a4a45">安卓 App 用这条</text>

    <rect x="250" y="86" width="190" height="92" rx="10" fill="#ffffff" stroke="#c9c9c3"/>
    <text x="266" y="112" font-size="13" font-weight="700" fill="#1f1f1d">Cloudflare 边缘</text>
    <text x="266" y="134" font-size="12" fill="#4a4a45">TLS 终止</text>
    <text x="266" y="154" font-size="12" fill="#4a4a45">转发到隧道</text>

    <rect x="460" y="86" width="190" height="92" rx="10" fill="#ffffff" stroke="#c9c9c3"/>
    <text x="476" y="112" font-size="13" font-weight="700" fill="#1f1f1d">隧道 0bf3dc15</text>
    <text x="476" y="134" font-size="12" fill="#4a4a45">http2 / 7844 / 4 连接</text>
    <text x="476" y="154" font-size="12" fill="#4a4a45">ingress → 3352</text>

    <rect x="670" y="86" width="190" height="92" rx="10" fill="#eef7f0" stroke="#1a7f37"/>
    <text x="686" y="112" font-size="13" font-weight="700" fill="#1f1f1d">cloudflared 服务</text>
    <text x="686" y="134" font-size="12" fill="#4a4a45">LocalSystem / 自启动</text>
    <text x="686" y="154" font-size="12" fill="#4a4a45">pid 30332</text>

    <rect x="880" y="86" width="260" height="92" rx="10" fill="#ffffff" stroke="#c9c9c3"/>
    <text x="896" y="112" font-size="13" font-weight="700" fill="#1f1f1d">MyBuddy RemoteAccessServer</text>
    <text x="896" y="134" font-size="12" fill="#4a4a45">127.0.0.1:3352</text>
    <text x="896" y="154" font-size="12" fill="#1a7f37">/healthz → 200 ok:true</text>
  </g>
  <g stroke="#5b5b57" stroke-width="2" marker-end="url(#a)">
    <line x1="230" y1="132" x2="246" y2="132"/>
    <line x1="440" y1="132" x2="456" y2="132"/>
    <line x1="650" y1="132" x2="666" y2="132"/>
    <line x1="860" y1="132" x2="876" y2="132"/>
  </g>

  <!-- 备用通道 -->
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="40" y="236" width="190" height="92" rx="10" fill="#eef7f0" stroke="#1a7f37"/>
    <text x="56" y="262" font-size="13" font-weight="700" fill="#1f1f1d">备用通道 · tailnet</text>
    <text x="56" y="284" font-size="12" fill="#4a4a45">vivion.tail42e72c.ts.net</text>
    <text x="56" y="304" font-size="12" fill="#1a7f37">实测 200（100.103.77.19）</text>

    <rect x="250" y="236" width="190" height="92" rx="10" fill="#eef7f0" stroke="#1a7f37"/>
    <text x="266" y="262" font-size="13" font-weight="700" fill="#1f1f1d">Tailscale Serve</text>
    <text x="266" y="284" font-size="12" fill="#4a4a45">tailnet only / 反代 3352</text>
    <text x="266" y="304" font-size="12" fill="#1a7f37">BackendState = Running</text>

    <rect x="460" y="236" width="190" height="92" rx="10" fill="#ffffff" stroke="#c9c9c3"/>
    <text x="476" y="262" font-size="13" font-weight="700" fill="#1f1f1d">登录状态</text>
    <text x="476" y="284" font-size="12" fill="#4a4a45">nodekey 有效 · ping txvps</text>
    <text x="476" y="304" font-size="12" fill="#4a4a45">DERP sfo 300–628ms</text>
  </g>
  <path d="M650,282 L1010,282 L1010,186" fill="none" stroke="#1a7f37" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="700" y="272" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#1a7f37">同一条 3352，双入口互不影响</text>

  <!-- 看门狗 -->
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="40" y="368" width="520" height="126" rx="12" fill="#eef7f0" stroke="#1a7f37" stroke-width="2"/>
    <text x="58" y="394" font-size="14" font-weight="700" fill="#1f1f1d">MyBuddy Tunnel Watchdog（SYSTEM · 每 1 分钟）</text>
    <text x="58" y="418" font-size="12" fill="#1f1f1d">本地 3352 不通 / 断网 → 跳过，不误重启</text>
    <text x="58" y="440" font-size="12" font-weight="700" fill="#b42318">公网连续 2 次失败 → 重启 cloudflared</text>
    <text x="58" y="462" font-size="12" fill="#4a4a45">节流：≥5 分钟间隔，每小时最多 4 次</text>
    <text x="58" y="482" font-size="12" fill="#1a7f37">心跳 08:19:27 ok（改 ACL 后仍在写）</text>

    <rect x="600" y="368" width="540" height="126" rx="12" fill="#ffffff" stroke="#b54708" stroke-width="2"/>
    <text x="618" y="394" font-size="14" font-weight="700" fill="#1f1f1d">权限边界：C:\ProgramData\cloudflared</text>
    <text x="618" y="418" font-size="12" fill="#4a4a45">SYSTEM (OI)(CI)(F) · Administrators (OI)(CI)(F)</text>
    <text x="618" y="440" font-size="12" fill="#4a4a45">Users (OI)(CI)(RX) —— Write 继承项已移除</text>
    <text x="618" y="462" font-size="12" fill="#b54708">非提权写测试 → UnauthorizedAccessException</text>
    <text x="618" y="482" font-size="12" fill="#4a4a45">看门狗脚本属主 Administrators，Users 只读</text>
  </g>
  <line x1="300" y1="368" x2="300" y2="332" stroke="#1a7f37" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <line x1="760" y1="368" x2="760" y2="182" stroke="#1a7f37" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="770" y="340" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#1a7f37">看护</text>

  <text x="40" y="536" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4a4a45">收尾项：旧的已禁用任务 MyBuddy Cloudflare Tunnel 已删除（schtasks 查询返回 not found）；临时安装脚本在 %TEMP%\mybuddy-tunnel-fix。</text>
  <text x="40" y="560" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4a4a45">两通道共用同一个 3352 服务：主通道靠 cloudflared 服务 + 看门狗续命；备用通道靠 Tailscale + Serve，两者故障不互相牵连。</text>
</svg>
