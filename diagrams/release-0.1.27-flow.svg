  <text x="610" y="186" font-size="10.5" text-anchor="middle" fill="#b45309">旧 out/ 是失效缓存 → 必须先重建</text>

  <rect x="750" y="116" width="220" height="76" rx="8" fill="#e8f0fe" stroke="#3b82f6"/>
  <text x="860" y="136" font-size="12.5" text-anchor="middle" fill="#1a2433">门禁</text>
