  <text x="370" y="311" font-size="11" text-anchor="middle" fill="#5a6b82">ahead/behind = 0 / 0</text>

  <rect x="510" y="252" width="200" height="76" rx="8" fill="#e8f0fe" stroke="#3b82f6"/>
  <text x="610" y="272" font-size="12.5" text-anchor="middle" fill="#1a2433">electron-builder --win --dir</text>
