  <text x="860" y="462" font-size="11" text-anchor="middle" fill="#166534">删除后重跑验收 4/4 ✓</text>

  <line x1="230" y1="432" x2="266" y2="432" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="470" y1="432" x2="506" y2="432" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="710" y1="432" x2="746" y2="432" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- warnings / facts -->
  <rect x="30" y="504" width="940" height="92" rx="8" fill="#ffffff" stroke="#d5dde8"/>
  <text x="46" y="526" font-size="13" font-weight="700" fill="#1a2433">关键事实（本轮实测）</text>
  <text x="46" y="547" font-size="11.5" fill="#334155">• 首次桌面验收失败并非代码缺陷：out/ 仍是 0.1.26 的旧构建（renderer 里只有 mybuddy:sidebar-collapsed），重建 out/ 后 4/4 通过。</text>
  <text x="46" y="565" font-size="11.5" fill="#334155">• 直接双击/启动打包程序会立刻退出（exit 0）是该 shell 继承了 ELECTRON_RUN_AS_NODE=1；清掉该变量后窗口标题 MyBuddy、Responding=true。</text>
  <text x="46" y="583" font-size="11.5" fill="#334155">• 唯一保留的已接受发布是 release-mybuddy-0.1.27；0.1.26 的构建哈希记录仍留在 artifacts/，包本体已删除。</text>

  <defs>
