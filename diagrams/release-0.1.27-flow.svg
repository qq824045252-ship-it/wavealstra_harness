  <text x="610" y="305" font-size="11" text-anchor="middle" fill="#5a6b82">release-mybuddy-0.1.27</text>
  <text x="610" y="321" font-size="10.5" text-anchor="middle" fill="#5a6b82">压缩 maximum · 1283.6 MiB</text>

  <rect x="750" y="252" width="220" height="76" rx="8" fill="#dcfce7" stroke="#16a34a"/>
