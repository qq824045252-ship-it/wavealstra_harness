<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="1000" height="620" fill="#f7f9fc"/>

  <text x="30" y="38" font-size="21" font-weight="700" fill="#1a2433">MyBuddy 0.1.27 发布链路（本机实测，非推断）</text>
  <text x="30" y="62" font-size="12.5" fill="#5a6b82">工作树待提交改动 → 版本 0.1.26→0.1.27 → 重建 out/ → 门禁 → 提交/推送 → 打包 → 验证 → 快捷方式改指 → 删除旧包 → 落档</text>

  <!-- legend -->
  <rect x="700" y="24" width="270" height="46" rx="8" fill="#ffffff" stroke="#d5dde8"/>
  <rect x="712" y="36" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#3b82f6"/>
