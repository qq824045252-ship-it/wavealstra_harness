  <line x1="470" y1="290" x2="506" y2="290" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="710" y1="290" x2="746" y2="290" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- row 3 -->
  <text x="30" y="376" font-size="13.5" font-weight="700" fill="#1a2433">③ 验收、切换与清理</text>

  <rect x="30" y="388" width="200" height="88" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="130" y="410" font-size="12.5" text-anchor="middle" fill="#1a2433">打包产物验收</text>
  <text x="130" y="428" font-size="11" text-anchor="middle" fill="#166534">FileVersion 0.1.27 ✓</text>
  <text x="130" y="445" font-size="11" text-anchor="middle" fill="#166534">asar 逐字节 = 新构建 ✓</text>
  <text x="130" y="462" font-size="11" text-anchor="middle" fill="#166534">真实窗口 + 空间树 4/4 ✓</text>

  <rect x="270" y="388" width="200" height="88" rx="8" fill="#e8f0fe" stroke="#3b82f6"/>
  <text x="370" y="410" font-size="12.5" text-anchor="middle" fill="#1a2433">快捷方式改指</text>
  <text x="370" y="428" font-size="11" text-anchor="middle" fill="#5a6b82">桌面 MyBuddy 0.1.26.lnk</text>
  <text x="370" y="445" font-size="11" text-anchor="middle" fill="#5a6b82">→ MyBuddy 0.1.27.lnk</text>
  <text x="370" y="462" font-size="11" text-anchor="middle" fill="#5a6b82">开始菜单就地更新并回读</text>

  <rect x="510" y="388" width="200" height="88" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="610" y="410" font-size="12.5" text-anchor="middle" fill="#1a2433">删除旧编译包</text>
  <text x="610" y="428" font-size="11" text-anchor="middle" fill="#991b1b">release-mybuddy-0.1.26</text>
  <text x="610" y="445" font-size="11" text-anchor="middle" fill="#991b1b">fcp delete 1283.6 MiB</text>
  <text x="610" y="462" font-size="11" text-anchor="middle" fill="#991b1b">0 进程 / 0 快捷方式引用</text>

