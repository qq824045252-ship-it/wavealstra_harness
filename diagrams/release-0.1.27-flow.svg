  <text x="860" y="169" font-size="11" text-anchor="middle" fill="#5a6b82">sidebar 单测 14/14 ✓</text>
  <text x="860" y="185" font-size="11" text-anchor="middle" fill="#5a6b82">test:all 246✓ / 0 新回归</text>

  <line x1="230" y1="154" x2="266" y2="154" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="470" y1="154" x2="506" y2="154" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="710" y1="154" x2="746" y2="154" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>

