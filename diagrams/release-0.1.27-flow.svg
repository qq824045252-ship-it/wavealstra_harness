  <text x="130" y="158" font-size="11" text-anchor="middle" fill="#5a6b82">appStore / Sidebar / App.tsx</text>
  <text x="130" y="175" font-size="11" text-anchor="middle" fill="#5a6b82">+ 4 个新验收脚本</text>

  <rect x="270" y="116" width="200" height="76" rx="8" fill="#e8f0fe" stroke="#3b82f6"/>
  <text x="370" y="140" font-size="12.5" text-anchor="middle" fill="#1a2433">版本 0.1.26 → 0.1.27</text>
  <text x="370" y="158" font-size="11" text-anchor="middle" fill="#5a6b82">package.json 唯一版本源</text>
  <text x="370" y="175" font-size="11" text-anchor="middle" fill="#5a6b82">仓库内无第二处硬编码</text>

  <rect x="510" y="116" width="200" height="76" rx="8" fill="#e8f0fe" stroke="#3b82f6"/>
