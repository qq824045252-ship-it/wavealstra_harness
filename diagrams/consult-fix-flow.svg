<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" width="1180" height="780" role="img" aria-label="多模型会诊三处缺陷的修复链路">
  <rect x="0" y="0" width="1180" height="780" fill="#f7f8fa"/>
  <text x="24" y="34" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1b1d21">多模型会诊 · 三处缺陷的修复链路（0.1.21）</text>
  <text x="24" y="58" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#5a6068">实线=已验证的真实调用链；虚线=仅在离线对抗性探针中验证。实测数字见图内标注。</text>

  <!-- Lane labels -->
  <rect x="24" y="76" width="1132" height="30" fill="#eceef2" rx="6"/>
  <text x="36" y="96" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#3a4046">渲染层 renderer</text>
  <text x="620" y="96" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#3a4046">主进程 main</text>

  <!-- Renderer column -->
  <rect x="24" y="120" width="360" height="176" rx="10" fill="#ffffff" stroke="#c9ced6"/>
  <text x="40" y="144" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1b1d21">MultiModelConsultCard</text>
  <text x="40" y="166" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4c5259">卡片：每个参与者一行</text>
  <text x="40" y="185" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4c5259">· 状态/思考等级/耗时/tokens</text>
  <text x="40" y="204" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4c5259">· 「终止」仅在该参与者 running/queued</text>
  <rect x="40" y="214" width="328" height="30" rx="6" fill="#eef4ff" stroke="#9db8ee"/>
  <text x="52" y="234" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#1f3d7a">data-testid=consult-stop-{index}</text>
  <rect x="40" y="252" width="328" height="30" rx="6" fill="#eef4ff" stroke="#9db8ee"/>
  <text x="52" y="272" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#1f3d7a">data-testid=consult-followup（继续调查）</text>

  <rect x="24" y="312" width="360" height="196" rx="10" fill="#ffffff" stroke="#c9ced6"/>
  <text x="40" y="336" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1b1d21">详情浮窗 &lt;dialog&gt;（原缺陷 1）</text>
  <text x="40" y="358" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4c5259">旧：inset:0 + height:auto + 全局 * {margin:0}</text>
  <text x="40" y="376" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#a33">→ 拉伸整屏、贴左上角</text>
  <text x="40" y="398" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#1f6b46">新：inset:auto + left:50% + fit-content</text>
  <text x="40" y="416" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#1f6b46">→ 实测 1344×935：720×471 居中</text>
  <text x="40" y="434" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#1f6b46">→ 实测 420×820：380×602 不溢出</text>
  <text x="40" y="456" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4c5259">拖动标题移动；双击标题复位；Esc 关闭</text>
  <text x="40" y="478" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4c5259">≤720px：左列参与者列表 → 横向标签条</text>

  <!-- IPC arrow -->
  <line x1="384" y1="229" x2="608" y2="229" stroke="#2f6fd0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="396" y="222" font-family="Consolas, monospace" font-size="11.5" fill="#2f6fd0">agent:stopConsultWorker</text>
  <text x="396" y="248" font-family="Consolas, monospace" font-size="11.5" fill="#6b7078">{taskId, consultId, workerIndex}</text>

  <line x1="384" y1="272" x2="608" y2="272" stroke="#6b7078" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="396" y="292" font-family="Consolas, monospace" font-size="11.5" fill="#6b7078">appendComposer(text) → 主输入框（不自动发送）</text>

  <!-- Main column -->
  <rect x="608" y="120" width="548" height="132" rx="10" fill="#ffffff" stroke="#c9ced6"/>
  <text x="624" y="144" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1b1d21">AgentService（main/agent）</text>
  <text x="624" y="166" font-family="Consolas, monospace" font-size="11.5" fill="#4c5259">consultWorkers: Map&lt;`${taskId}:${consultId}`, ConsultWorkerControls&gt;</text>
  <text x="624" y="188" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4c5259">register：runMultiModelConsult 的 onControls（首个参与者启动前）</text>
  <text x="624" y="208" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4c5259">release：.finally() 删除登记；已结束的会诊终止返回 false</text>
  <text x="624" y="230" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#1f6b46">stopConsultWorker(req) → controls.stopWorker(index)</text>

  <rect x="608" y="268" width="548" height="290" rx="10" fill="#ffffff" stroke="#c9ced6"/>
  <text x="624" y="292" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1b1d21">runMultiModelConsult（main/capabilities）</text>
  <text x="624" y="314" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4c5259">requestWorkerStop(index, reason)：</text>
  <text x="636" y="332" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4c5259">1) 未终态才受理；2) 记录 stopReasons；3) 触达 liveStops；4) emit 进度</text>
  <rect x="624" y="344" width="516" height="66" rx="8" fill="#eefaf2" stroke="#8ccfae"/>
  <text x="636" y="364" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#1f6b46">已实测（timeoutSeconds=600 的死循环参与者）：</text>
  <text x="636" y="382" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#1f6b46">终止 129ms 生效 → cancelled「用户终止该模型（未完成）」</text>
  <text x="636" y="400" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#1f6b46">兄弟参与者 complete；排队者从未启动；created=2 disposed=2</text>

  <text x="624" y="436" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4c5259">收尾有界（加固，不是空等根因）：</text>
  <text x="624" y="456" font-family="Consolas, monospace" font-size="11.5" fill="#4c5259">abort ≤2000ms → dispose ≤2000ms → 整体看门狗 3000ms</text>
  <text x="624" y="476" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#a33">超限 → 记入 worker.error「会话清理异常：…超时」并让报告结束</text>
  <text x="624" y="496" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4c5259">settled=true 后：late 事件/被放弃的后台清理都不能改写终态</text>
  <text x="624" y="520" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7078">实测对照：健康会话 0–1ms，无额外延迟；dispose 永不收敛时</text>
  <text x="624" y="538" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7078">旧代码 204ms 静默通过 / 新代码 2222ms 有界且明确报错</text>

  <!-- follow-up detail -->
  <rect x="24" y="528" width="548" height="196" rx="10" fill="#ffffff" stroke="#c9ced6"/>
  <text x="40" y="552" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1b1d21">「基于此发现继续调查」修复（原缺陷 3）</text>
  <text x="40" y="574" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#a33">旧：disabled = !worker.answer || activeTaskId !== report.taskId</text>
  <text x="40" y="592" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#a33">旧：追加文案用 STATUS[status] → interrupted 时出现「（undefined）」</text>
  <text x="40" y="616" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#1f6b46">新：有 answer 或 error 即可用；仅「无证据 / 属于其它任务」禁用并说明</text>
  <text x="40" y="634" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#1f6b46">新：status() 全覆盖（未知→状态未知），不产生 undefined</text>
  <text x="40" y="656" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4c5259">追加内容 = 报告 id + 参与者身份/等级/状态 + 原始答案或失败原因</text>
  <text x="40" y="674" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4c5259">+ 该参与者真实工具记录（工具名/参数/输出预览，取自报告不改写）</text>
  <text x="40" y="696" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4c5259">实测：complete / error(429) / interrupted 三种状态均可追加，</text>
  <text x="40" y="714" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4c5259">文本含报告 id 与工具名，逐字检查不含 "undefined"</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fd0"/>
    </marker>
  </defs>
</svg>
