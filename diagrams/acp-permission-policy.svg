<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 600" width="1060" height="600" role="img" aria-label="ACP 权限策略判定流程">
  <rect width="1060" height="600" fill="#f7f8fa"/>
  <text x="28" y="38" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#111827">ACP 权限策略：为什么不再一步一步卡住</text>
  <text x="28" y="62" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#4b5563">每次 session/request_permission 都实时读设置；策略只挑 Agent 自己声明的选项，挑不到就退回询问</text>

  <!-- step 1 -->
  <rect x="60" y="96" width="250" height="66" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="185" y="122" text-anchor="middle" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="600" fill="#312e81">Agent 请求权限</text>
  <text x="185" y="144" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#4338ca">session/request_permission</text>

  <line x1="185" y1="162" x2="185" y2="196" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- step 2 policy -->
  <rect x="60" y="198" width="250" height="66" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="185" y="224" text-anchor="middle" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="600" fill="#92400e">读该 Agent 的策略</text>
  <text x="185" y="246" text-anchor="middle" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="11" fill="#92400e">permissionPolicyOf(agentId)</text>

  <line x1="185" y1="264" x2="185" y2="298" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- branch -->
  <rect x="60" y="300" width="250" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="185" y="326" text-anchor="middle" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="600" fill="#374151">策略 = ?</text>
  <text x="185" y="346" text-anchor="middle" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="11" fill="#6b7280">缺省 / 未知值 → ask</text>

  <!-- ask -->
  <line x1="310" y1="318" x2="400" y2="318" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="402" y="278" width="290" height="86" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="547" y="302" text-anchor="middle" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="600" fill="#991b1b">ask（默认）</text>
  <text x="547" y="324" text-anchor="middle" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#b91c1c">弹审批卡 · run=blocked</text>
  <text x="547" y="344" text-anchor="middle" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#b91c1c">等你点「允许一次 / 始终允许 / 拒绝」</text>

  <!-- auto-allow -->
  <line x1="310" y1="340" x2="400" y2="404" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="402" y="372" width="290" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="547" y="396" text-anchor="middle" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="600" fill="#14532d">auto-allow / auto-deny</text>
  <text x="547" y="418" text-anchor="middle" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#166534">挑 allow_* / reject_*（优先 once）</text>
  <text x="547" y="438" text-anchor="middle" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#166534">不弹卡 · run 不进 blocked</text>

  <!-- fallback -->
  <line x1="692" y1="417" x2="790" y2="417" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="792" y="372" width="240" height="90" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="912" y="396" text-anchor="middle" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="600" fill="#92400e">没有匹配选项？</text>
  <text x="912" y="418" text-anchor="middle" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#92400e">退回 ask（绝不猜一个更宽的授权）</text>
  <text x="912" y="438" text-anchor="middle" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#92400e">配置损坏同样按 ask</text>

  <!-- trace -->
  <rect x="402" y="480" width="630" height="88" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="420" y="504" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="700" fill="#111827">自动判定仍然留痕（不是静默放行）</text>
  <text x="420" y="526" font-family="Consolas, monospace" font-size="11.5" fill="#374151">tool_start(running) → tool_update(running|denied, output:"已按策略自动放行（Allow once）")</text>
  <text x="420" y="548" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#4b5563">时间线、手机气泡里的工具卡、external_agent_runs.tools_json 都能看到这次调用与决策原因。</text>

  <!-- where to set -->
  <rect x="60" y="480" width="310" height="88" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="78" y="504" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="700" fill="#111827">在哪改</text>
  <text x="78" y="526" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#374151">电脑：设置 → ACP 管理 → 每个 Agent 的「权限」下拉</text>
  <text x="78" y="548" font-family="Segoe UI, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#374151">手机：ACP 面板 → 权限策略三档（写电脑端设置）</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
</svg>
