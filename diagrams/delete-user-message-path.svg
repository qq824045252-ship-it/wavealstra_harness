  <!-- RIGHT: desktop message delete -->
  <text x="640" y="118" font-size="16" font-weight="700" fill="#6b7280">B. 桌面「删除此消息」（未被反馈，无缺陷证据）</text>
  <g>
    <rect x="640" y="132" width="470" height="62" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="658" y="158" font-size="14.5" font-weight="700" fill="#111827">⑤ 消息「更多」→ 删除此消息 → ConfirmDialog</text>
    <text x="658" y="180" font-size="12" fill="#4b5563">MessageItem.tsx:655</text>

