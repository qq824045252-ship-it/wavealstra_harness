  <!-- verdict panel -->
  <g>
    <rect x="120" y="500" width="990" height="200" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="140" y="532" font-size="16" font-weight="700" fill="#111827">本轮实测结果</text>
    <text x="140" y="562" font-size="12.5" fill="#1f7a4d">✓ test:remote-delete 18/18：DELETE 200 → 复用桌面 trash → work graph 清理 → 广播</text>
    <text x="152" y="582" font-size="12.5" fill="#1f7a4d">→ 列表/bootstrap 消失；重复删除 409、执行中 409、不存在 404、未认证拒绝</text>
    <text x="140" y="610" font-size="12.5" fill="#1f7a4d">✓ test:remote-workspace-create 8/8（Electron）：抽屉/嵌套目的地点击、失效目的地不可选、失败重试不重复建任务</text>
    <text x="140" y="638" font-size="12.5" fill="#1f7a4d">✓ test:archive-deletion-desktop（真实 Electron，5 场景）：批量永久删除、空间级联、重启后确认不可见</text>
    <text x="140" y="666" font-size="12.5" fill="#4b5563">△ 桌面「删除此消息」：marker 语义有覆盖；忙/durable/锚点失配三条拒绝分支无单测</text>
    <text x="140" y="692" font-size="12.5" fill="#4b5563">△ 删除后立刻创建分支（leaf 刚改写、live session 刚释放）无并发用例</text>
  </g>

  <!-- note -->
  <g>
    <rect x="120" y="726" width="990" height="130" rx="10" fill="#fffbeb" stroke="#b45309" stroke-dasharray="4 3"/>
    <text x="140" y="756" font-size="14" font-weight="700" fill="#92400e">更正上一轮报告</text>
    <text x="140" y="782" font-size="12.5" fill="#78350f">上一轮「工作空间 junction 复制越界 / 预检漏计」两条失败，是 DSH 文件沙箱改写 lstat 结果造成的假阳性：</text>
    <text x="140" y="804" font-size="12.5" fill="#78350f">沙箱内 mode=040666（当作目录）、无沙箱 mode=120666（isSymbolicLink=true）；同一份代码与用例在取消沙箱后 73/73 通过。</text>
    <text x="140" y="828" font-size="12.5" fill="#78350f">因此 TaskWorkspaceBrancher 的 junction 防护没有缺陷，上一轮据此提的修复建议作废。</text>
  </g>
