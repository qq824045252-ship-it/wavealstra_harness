  </defs>
  <rect x="0" y="0" width="1180" height="930" fill="#f7f8fa"/>
  <text x="60" y="46" font-size="21" font-weight="700" fill="#111827">删除：安卓删除任务（反馈项）与桌面删除消息</text>
  <text x="60" y="74" font-size="14" fill="#4b5563">安卓侧：commit 0e255e4；桌面侧：MessageItem.tsx → appStore.ts → AgentService.ts</text>

  <rect x="700" y="20" width="420" height="64" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="714" y="34" width="16" height="16" rx="3" fill="#e8f5ee" stroke="#1f7a4d"/>
  <text x="738" y="47" font-size="13" fill="#111827">实测通过</text>
  <rect x="824" y="34" width="16" height="16" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-dasharray="3 3"/>
  <text x="848" y="47" font-size="13" fill="#111827">代码确认 / 无覆盖</text>
  <text x="714" y="72" font-size="12" fill="#6b7280">无「实测失败」：沙箱解除后本轮未出现删除相关失败</text>

  <!-- LEFT: android delete -->
  <text x="120" y="118" font-size="16" font-weight="700" fill="#1f7a4d">A. 安卓端删除任务（用户反馈的对象，已修复）</text>
  <g>
    <rect x="120" y="132" width="470" height="62" rx="10" fill="#e8f5ee" stroke="#1f7a4d" stroke-width="1.5"/>
    <text x="138" y="158" font-size="14.5" font-weight="700" fill="#111827">① 入口可见：头部 40px 按钮 + 抽屉每行删除</text>
    <text x="138" y="180" font-size="12" fill="#4b5563">header-left flex:1 / min-width:0；.drawer-item-delete</text>

    <rect x="120" y="222" width="470" height="62" rx="10" fill="#e8f5ee" stroke="#1f7a4d" stroke-width="1.5"/>
    <text x="138" y="248" font-size="14.5" font-weight="700" fill="#111827">② DeleteTaskDialog（与聊天页共用）</text>
    <text x="138" y="270" font-size="12" fill="#4b5563">忙碌时按钮变「停止并删除」→ abort → 700ms×4 重试</text>

    <rect x="120" y="312" width="470" height="62" rx="10" fill="#e8f5ee" stroke="#1f7a4d" stroke-width="1.5"/>
    <text x="138" y="338" font-size="14.5" font-weight="700" fill="#111827">③ DELETE /v1/tasks/:id → taskLifecycle.trash</text>
    <text x="138" y="360" font-size="12" fill="#4b5563">回收区保留、work graph 清理、task.changed 广播</text>

    <rect x="120" y="402" width="470" height="62" rx="10" fill="#e8f5ee" stroke="#1f7a4d" stroke-width="1.5"/>
    <text x="138" y="428" font-size="14.5" font-weight="700" fill="#111827">④ 列表/首页同步消失；重复删除 409、执行中 409</text>
    <text x="138" y="450" font-size="12" fill="#4b5563">不静默成功；未认证设备被拒</text>

    <line x1="355" y1="194" x2="355" y2="218" stroke="#374151" stroke-width="1.6" marker-end="url(#d1)"/>
    <line x1="355" y1="284" x2="355" y2="308" stroke="#374151" stroke-width="1.6" marker-end="url(#d1)"/>
    <line x1="355" y1="374" x2="355" y2="398" stroke="#374151" stroke-width="1.6" marker-end="url(#d1)"/>
