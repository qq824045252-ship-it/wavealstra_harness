    <text x="658" y="248" font-size="14.5" font-weight="700" fill="#111827">⑥ renderer 守卫：role=user 且任务非 streaming</text>
    <text x="658" y="270" font-size="12" fill="#b3261e">在跑任务时先在此被拒（设计行为，非缺陷）</text>

    <rect x="640" y="312" width="470" height="76" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-dasharray="4 3"/>
    <text x="658" y="338" font-size="14.5" font-weight="700" fill="#111827">⑦ AgentService.deleteUserMessage（:4374）</text>
    <text x="658" y="360" font-size="12" fill="#4b5563">durable 拒绝 / memoryWriteQueue / isTaskBusy / session 缺失</text>
    <text x="658" y="380" font-size="12" fill="#4b5563">entryId 失配 →「找不到要删除的用户消息」</text>

    <rect x="640" y="416" width="470" height="62" rx="10" fill="#e8f5ee" stroke="#1f7a4d" stroke-width="1.5"/>
    <text x="658" y="442" font-size="14.5" font-weight="700" fill="#111827">⑧ branch(parent) + mybuddy_deleted_user_message</text>
    <text x="658" y="464" font-size="12" fill="#4b5563">marker 语义由 conversation-branch ⑱ 覆盖并通过</text>

    <line x1="875" y1="194" x2="875" y2="218" stroke="#374151" stroke-width="1.6" marker-end="url(#d1)"/>
    <line x1="875" y1="284" x2="875" y2="308" stroke="#374151" stroke-width="1.6" marker-end="url(#d1)"/>
    <line x1="875" y1="388" x2="875" y2="412" stroke="#374151" stroke-width="1.6" marker-end="url(#d1)"/>
