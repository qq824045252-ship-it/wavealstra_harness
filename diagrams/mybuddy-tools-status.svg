  <line x1="915" y1="282" x2="915" y2="341" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="915,345 910,337 920,337" fill="#64748b"/>
  <text x="798" y="318" font-size="12" fill="#475569">配置里没有 MCP 条目</text>

  <!-- 链路 1 -->
  <rect x="40" y="345" width="330" height="215" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="56" y="373" font-size="15" font-weight="700" fill="#0f172a">① 原生 cad_* 工具链（已删除）</text>
  <text x="56" y="399" font-size="12" fill="#1f2937">CadRuntimeService → FreeCadInterop</text>
  <text x="56" y="419" font-size="12" fill="#1f2937">  已于 2026-10-27 commit 0366e5a 整体删除</text>
  <text x="56" y="439" font-size="12" fill="#1f2937">现行工具根：~/.mybuddy/tools</text>
  <text x="56" y="459" font-size="12" fill="#1f2937">  （MYBUDDY_TOOLS_DIR 可覆盖）</text>
  <text x="56" y="479" font-size="12" fill="#1f2937">不再探测 exe 旁 / cwd 的 MyBuddyTools</text>
  <text x="56" y="499" font-size="12" fill="#475569">→ 本图 ① 记录的是删除前行为</text>
  <text x="56" y="533" font-size="13" font-weight="700" fill="#b45309">— 历史快照，勿当作现状</text>
  <text x="56" y="551" font-size="12" fill="#b45309">（现行见 diagrams/mybuddy-tools-cleanup.svg）</text>

  <!-- 链路 2 -->
  <rect x="395" y="345" width="330" height="215" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="411" y="373" font-size="15" font-weight="700" fill="#0f172a">② freecad 技能链（自带探测）</text>
  <text x="411" y="399" font-size="12" fill="#1f2937">scripts\run_freecad.py → locate()</text>
  <text x="411" y="419" font-size="12" fill="#1f2937">FREECAD_CMD → PATH →</text>
  <text x="411" y="439" font-size="12" fill="#1f2937">%ProgramFiles%\FreeCAD *\bin\</text>
  <text x="411" y="459" font-size="12" fill="#1f2937">  FreeCADCmd.exe</text>
  <text x="411" y="479" font-size="12" fill="#1f2937">→ 命中 Program Files\FreeCAD 1.1\bin</text>
  <text x="411" y="499" font-size="12" fill="#1f2937">  \freecadcmd.exe（1.1.3）</text>
  <text x="411" y="533" font-size="13" font-weight="700" fill="#16a34a">✓ 可用，不依赖 MyBuddyTools</text>

  <!-- 链路 3 -->
  <rect x="750" y="345" width="330" height="215" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="766" y="373" font-size="15" font-weight="700" fill="#0f172a">③ blender 技能链</text>
  <text x="766" y="399" font-size="12" fill="#1f2937">技能靠 Blender MCP（9876）提供</text>
  <text x="766" y="419" font-size="12" fill="#1f2937">execute_blender_code 等原语</text>
  <text x="766" y="439" font-size="12" fill="#1f2937">mcp.json 无 blender 条目</text>
  <text x="766" y="459" font-size="12" fill="#1f2937">app.asar 内也无 blender_mcp 字符串</text>
  <text x="766" y="479" font-size="12" fill="#475569">→ MCP 链当前是断的</text>
  <text x="766" y="533" font-size="13" font-weight="700" fill="#dc2626">✗ 只能手动 GUI 打开 blender.exe</text>

  <!-- 结论 -->
  <rect x="40" y="596" width="1040" height="112" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="56" y="622" font-size="15" font-weight="700" fill="#3730a3">结论</text>
  <text x="56" y="646" font-size="13" fill="#1f2937">1) 便携目录 Desktop\mybuddy\MyBuddyTools 已整体不存在 → 其中的 freecad.exe / blender.exe 便携副本没有了</text>
  <text x="56" y="670" font-size="13" fill="#1f2937">2) 软件本体仍在系统里：FreeCAD 1.1.3（Program Files\FreeCAD 1.1）、Blender 5.2（Blender Foundation）</text>
  <text x="56" y="694" font-size="13" fill="#1f2937">3) 0.1.49 已把 freecad / blender / ardot-local / opendesign 从受管工具下线，只剩 penpot；技能文件还在</text>
</svg>
