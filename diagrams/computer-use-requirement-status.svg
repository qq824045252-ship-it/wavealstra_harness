<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1100" height="720" fill="#f7f8fb"/>
  <text x="32" y="42" font-size="22" font-weight="700" fill="#1f2430">Computer Use 三条要求：P1 完成后的达成情况（2026-10-20）</text>
  <text x="32" y="66" font-size="12" fill="#5b6472">已补齐应用会话、窗口级叠加框、后台捕获（原生）、输入原语、图片淘汰、OCR 兜底；剩余边界在每项末尾标注。</text>

  <!-- requirement 1 -->
  <rect x="32" y="88" width="1036" height="176" rx="10" fill="#ffffff" stroke="#e8d1a8"/>
  <text x="52" y="118" font-size="15" font-weight="700" fill="#1f2430">① 能聚焦某个应用，不要像全屏扫描</text>
  <rect x="880" y="98" width="166" height="28" rx="14" fill="#fff6e6" stroke="#e8c98a"/>
  <text x="963" y="117" font-size="13" font-weight="700" fill="#8a5a12" text-anchor="middle">基本满足</text>
  <g font-size="12" fill="#3b4556">
    <text x="52" y="146">已实现：attach_app 返回 app_session_id，后续动作固定到同一 HWND+PID（10 分钟 TTL）；</text>
    <text x="52" y="168">叠加框改为按窗口矩形绘制（实测 bounds 与目标窗口完全一致）；原生窗口支持 PrintWindow 后台截图。</text>
    <text x="52" y="196">边界：Chromium / Qt / Tauri 的 PrintWindow 只返回原生外框，后台截图会被明确拒绝，需先聚焦再前台截图；</text>
    <text x="52" y="218">多显示器 list_displays 尚未实现。</text>
  </g>

  <!-- requirement 2 -->
  <rect x="32" y="278" width="1036" height="176" rx="10" fill="#ffffff" stroke="#e8d1a8"/>
  <text x="52" y="308" font-size="15" font-weight="700" fill="#1f2430">② 速度慢，识别太慢</text>
  <rect x="880" y="288" width="166" height="28" rx="14" fill="#fff6e6" stroke="#e8c98a"/>
  <text x="963" y="307" font-size="13" font-weight="700" fill="#8a5a12" text-anchor="middle">部分满足</text>
  <g font-size="12" fill="#3b4556">
    <text x="52" y="336" fill="#1d6b3f">工具侧：截图 274/275ms、点击 708ms、8 连点 1.11s（逐个 5.57s）；图片只保留最近 2 张，旧图不再每轮重传。</text>
    <text x="52" y="364" fill="#8a5a12">仍慢：模型回合 3.7–9.1s/步（随上下文增长）；OCR 3.5–4.0s；文本模型下每张截图仍有 10.3s 委托视觉。</text>
    <text x="52" y="392">批量只减少轮数、图片淘汰只减少上下文；单轮推理时间未变，需要更小上下文或更快模型。</text>
    <text x="52" y="420" fill="#5b6472">判定：工具侧与上下文已达标，端到端“识别”仍取决于模型。</text>
  </g>

  <!-- requirement 3 -->
  <rect x="32" y="468" width="1036" height="176" rx="10" fill="#ffffff" stroke="#a9d3b8"/>
  <text x="52" y="498" font-size="15" font-weight="700" fill="#1f2430">③ 操作鼠标限制大</text>
  <rect x="880" y="478" width="166" height="28" rx="14" fill="#eef8f1" stroke="#8fc9a4"/>
  <text x="963" y="497" font-size="13" font-weight="700" fill="#1d6b3f" text-anchor="middle">已满足（有边界）</text>
  <g font-size="12" fill="#3b4556">
    <text x="52" y="526" fill="#1d6b3f">已实现：双击/三击（dblclick 触发）、Ctrl/Shift+点击（ctrlKey/shiftKey=true）、长按 hold_ms、mouse_down/up、</text>
    <text x="52" y="548" fill="#1d6b3f">拖拽 steps/duration（621ms、29 步）、跨窗口 drag_screen、滚动 notches（3 格=300px）、key_down/up、剪贴板粘贴、后台点击。</text>
    <text x="52" y="576">边界：后台点击走 PostMessage，可能激活窗口或被部分应用忽略；跨窗口拖拽使用桌面绝对坐标。</text>
    <text x="52" y="604" fill="#5b6472">批量 actions 可把这些原语组合成一键多步（1–8 步，出错即停）。</text>
  </g>

  <!-- footer -->
  <rect x="32" y="654" width="1036" height="52" rx="10" fill="#eef4ff" stroke="#9fb8e8"/>
  <text x="52" y="676" font-size="12" fill="#33496e">验证：30 actions · typecheck/build · 4 个单测 · 2 个实机 smoke 全绿；Electron 实测覆盖会话/叠加框/双击/修饰键/拖拽/滚动/粘贴/OCR。</text>
  <text x="52" y="696" font-size="12" fill="#33496e">待验证：打包版真实模型端到端；OCR 依赖本机 OCR_NPU_CLI；Chromium 后台截图/OCR 需前台窗口。</text>
</svg>
