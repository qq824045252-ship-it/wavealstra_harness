<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arw6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="360" fill="#F7F9FC"/>
  <text x="26" y="38" font-size="19" font-weight="700" fill="#0F172A">分派约定：显示名用简中官方名，身份仍用英文 id</text>
  <text x="26" y="62" font-size="12" fill="#475569">每次分派先洗牌、再取不重复的 n 个；同一次分派内不会撞名</text>

  <rect x="26" y="86" width="176" height="62" rx="9" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="114" y="110" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">151 个简中官方名</text>
  <text x="114" y="130" font-size="11" fill="#475569" text-anchor="middle">皮卡丘 · 杰尼龟 · 妙蛙种子</text>

  <line x1="202" y1="117" x2="226" y2="117" stroke="#64748B" stroke-width="2" marker-end="url(#arw6)"/>

  <rect x="232" y="86" width="150" height="62" rx="9" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="307" y="110" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">洗牌取 n</text>
  <text x="307" y="130" font-size="11" fill="#475569" text-anchor="middle">不重复</text>

  <line x1="382" y1="117" x2="406" y2="117" stroke="#64748B" stroke-width="2" marker-end="url(#arw6)"/>

  <rect x="412" y="86" width="200" height="62" rx="9" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="512" y="110" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">displayName（中文）</text>
  <text x="512" y="130" font-size="11" fill="#334155" text-anchor="middle">皮卡丘</text>

  <line x1="612" y1="117" x2="636" y2="117" stroke="#64748B" stroke-width="2" marker-end="url(#arw6)"/>

  <rect x="642" y="86" width="212" height="62" rx="9" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="748" y="110" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">subagentId（ASCII）</text>
  <text x="748" y="130" font-size="11" fill="#334155" text-anchor="middle">pikachu</text>

  <rect x="26" y="170" width="404" height="118" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="42" y="194" font-size="12" font-weight="700" fill="#1D4ED8">4 个需要转换的名字</text>
  <text x="42" y="218" font-size="12" fill="#0F172A">尼多兰♀ → nidoran-f　·　尼多朗♂ → nidoran-m</text>
  <text x="42" y="242" font-size="12" fill="#0F172A">魔墙人偶 → mr-mime　·　大葱鸭 → farfetchd</text>
  <text x="42" y="266" font-size="11" fill="#475569">displayName 用简中原字，id 用转写后的英文</text>

  <rect x="446" y="170" width="408" height="118" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="462" y="194" font-size="12" font-weight="700" fill="#1D4ED8">生效边界</text>
  <text x="462" y="218" font-size="12" fill="#0F172A">产品 subagent 工具：支持中文 displayName</text>
  <text x="462" y="242" font-size="12" fill="#0F172A">本会话 Team 工具：只收 lower-kebab-case</text>
  <text x="462" y="266" font-size="11" fill="#475569">不传 displayName → 回退 role（运行中）/ id（完成）</text>

  <text x="26" y="326" font-size="12" fill="#0F172A">分派写法：subagent({ agent: "scout", subagentId: "pikachu", displayName: "皮卡丘", task: "…" })</text>
</svg>
