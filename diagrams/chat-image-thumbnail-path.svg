<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="700" fill="#ffffff"/>

  <text x="36" y="42" font-size="21" font-weight="700" fill="#1f2933">P0+P1 实施后的图片链路（本次改动）</text>
  <text x="36" y="66" font-size="12.5" fill="#52606d">蓝线 = 数据通路；橙线 = 降级/回退路径。三条硬约束：原图不动、点击原图走原链路、任何失败都回落</text>

  <!-- left main column -->
  <rect x="36" y="92" width="560" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="54" y="115" font-size="14.5" font-weight="600" fill="#1f2933">renderer: ArtifactService.readContent(id)</text>
  <text x="54" y="134" font-size="12" fill="#52606d">artifact-domain:readContent（IPC 形状不变，只加可选字段）</text>

  <path d="M316 146 L316 170" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>

  <rect x="36" y="172" width="560" height="72" rx="8" fill="#f0f7ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="54" y="196" font-size="14.5" font-weight="600" fill="#1f2933">previewWorkspaceFile(path, { thumbnail: true })</text>
  <text x="54" y="216" font-size="12" fill="#52606d">readFile → content = 原图 data URI（一个版本内不删）</text>
  <text x="54" y="234" font-size="12" fill="#52606d">WorkspaceService.ts:216</text>

  <!-- fork -->
  <path d="M316 244 L316 262" stroke="#2563eb" stroke-width="2"/>
  <path d="M150 262 L482 262" stroke="#2563eb" stroke-width="2"/>
  <path d="M150 262 L150 286" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
  <path d="M482 262 L482 286" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>

  <!-- branch A: header dims -->
  <rect x="36" y="288" width="228" height="106" rx="8" fill="#f3fbf5" stroke="#047857" stroke-width="1.8"/>
  <text x="52" y="311" font-size="13.5" font-weight="700" fill="#047857">A 只读文件头取固有尺寸</text>
  <text x="52" y="331" font-size="11.5" fill="#52606d">imageIntrinsicSize(buffer)</text>
  <text x="52" y="348" font-size="11.5" fill="#52606d">PNG / JPEG SOFn / WebP / GIF</text>
  <text x="52" y="366" font-size="11.5" fill="#52606d">不解码 · 实测 1–7ms</text>
  <text x="52" y="384" font-size="11.5" fill="#047857" font-weight="600">→ width / height</text>

  <!-- branch B: thumbnail -->
  <rect x="284" y="288" width="312" height="106" rx="8" fill="#fef7ed" stroke="#e08b32" stroke-width="1.8"/>
  <text x="300" y="311" font-size="13.5" font-weight="700" fill="#b45309">B 缩略图（可缺省）</text>
  <text x="300" y="331" font-size="11.5" fill="#52606d">命中进程内缓存？→ 直接返回</text>
  <text x="300" y="348" font-size="11.5" fill="#52606d">否则：并发槽(2) → resizeImage(worker)</text>
  <text x="300" y="366" font-size="11.5" fill="#52606d">内联预算 400ms；超预算先返回原图</text>
  <text x="300" y="384" font-size="11.5" fill="#b45309" font-weight="600">→ thumbnail? {content,width,height}</text>

  <!-- join -->
  <path d="M150 394 L150 418" stroke="#2563eb" stroke-width="2"/>
  <path d="M440 394 L440 418" stroke="#2563eb" stroke-width="2"/>
  <path d="M150 418 L440 418" stroke="#2563eb" stroke-width="2"/>
  <path d="M295 418 L295 442" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>

  <rect x="36" y="444" width="560" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="54" y="467" font-size="14" font-weight="600" fill="#1f2933">renderHydration → artifactRenderCache → ChatImage</text>
  <text x="54" y="487" font-size="11.5" fill="#52606d">src = thumbnail?.content ?? content（原图）</text>
  <text x="54" y="504" font-size="11.5" fill="#52606d">width/height = thumbnail ?? 固有尺寸 → 加载前就钉住行高</text>

  <path d="M316 514 L316 538" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>

  <rect x="36" y="540" width="560" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="54" y="563" font-size="14" font-weight="600" fill="#1f2933">点击图片 → openArtifact(id)</text>
  <text x="54" y="583" font-size="11.5" fill="#52606d">打开产物面板走 content（原图），与原链路完全一致</text>

  <!-- right column -->
  <rect x="624" y="92" width="380" height="150" rx="10" fill="#fdecec" stroke="#d9534f" stroke-width="1.5"/>
  <text x="642" y="118" font-size="14" font-weight="700" fill="#1f2933">为什么 resizeImage 必须懒加载</text>
  <text x="642" y="142" font-size="11.5" fill="#52606d">pi 的 barrel 求值期会拉 cli/config 初始化，</text>
  <text x="642" y="160" font-size="11.5" fill="#52606d">config.js 依赖 import.meta.url —— 静态 import 时</text>
  <text x="642" y="178" font-size="11.5" fill="#d9534f">任何间接引入 WorkspaceService 的 CJS 测试 bundle</text>
  <text x="642" y="196" font-size="11.5" fill="#d9534f">构建后加载即 ERR_INVALID_ARG_TYPE</text>
  <text x="642" y="218" font-size="11.5" fill="#52606d">（已用 git stash 对照复现：117/117 → 加载期崩）</text>
  <text x="642" y="236" font-size="11.5" fill="#047857" font-weight="600">动态 import 后 117/117 恢复</text>

  <rect x="624" y="258" width="380" height="160" rx="10" fill="#f0f7ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="642" y="284" font-size="14" font-weight="700" fill="#1f2933">为什么加缓存 / 限流 / 预算</text>
  <text x="642" y="308" font-size="11.5" fill="#52606d">实测 pi/photon 一张 12.6MP JPEG 需 ≈1.2s，</text>
  <text x="642" y="326" font-size="11.5" fill="#52606d">0.9MP ≈0.1s，且每次调用新起一个 worker</text>
  <text x="642" y="348" font-size="11.5" fill="#52606d">一条 38 图的消息 → 38 个并发 readContent</text>
  <text x="642" y="366" font-size="11.5" fill="#d9534f">＝ 38 个线程 + 38 份 wasm</text>
  <text x="642" y="388" font-size="11.5" fill="#52606d">→ 缓存 64 条 + 并发 2 + 400ms 预算</text>
  <text x="642" y="406" font-size="11.5" fill="#047857" font-weight="600">首屏不新增等待，回看/重开才拿缩略图</text>

  <rect x="624" y="434" width="380" height="168" rx="10" fill="#f3fbf5" stroke="#047857" stroke-width="1.5"/>
  <text x="642" y="460" font-size="14" font-weight="700" fill="#1f2933">实测收益（同一张原图）</text>
  <text x="642" y="484" font-size="11.5" fill="#52606d">4096×3072 → 1280×960</text>
  <text x="642" y="502" font-size="11.5" fill="#047857" font-weight="600">位图 48.0MB → 4.7MB RGBA（10.2×）</text>
  <text x="642" y="520" font-size="11.5" fill="#52606d">磁盘 381KB → 缩略图 166KB</text>
  <text x="642" y="546" font-size="11.5" fill="#52606d">2480×3507 → 905×1280</text>
  <text x="642" y="564" font-size="11.5" fill="#047857" font-weight="600">位图 33.2MB → 4.4MB RGBA（7.5×）</text>
  <text x="642" y="586" font-size="11.5" fill="#52606d">磁盘 221KB → 缩略图 80KB</text>

  <rect x="624" y="618" width="380" height="62" rx="10" fill="#fef7ed" stroke="#e08b32" stroke-width="1.5"/>
  <text x="642" y="643" font-size="12.5" font-weight="600" fill="#b45309">未覆盖：GIF/ICO 不缩、生成图若走</text>
  <text x="642" y="662" font-size="12.5" fill="#b45309">managed-content 也没有缩略图</text>

  <!-- degradation arrows -->
  <path d="M596 341 L622 341" stroke="#b45309" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="470" y="424" font-size="11" fill="#b45309">缺任何一路 → 各自缺省，另一路照样生效</text>
</svg>
