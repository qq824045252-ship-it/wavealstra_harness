  <text x="44" y="46" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#111827">Windows → GitHub → Omarchy：同步、打包、真机验收、清旧包</text>
  <text x="44" y="76" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#5B6472">全部数据来自 2026-10-28 在 Omarchy 真机上的执行；release 目录最终只保留 0.1.57</text>

  <!-- row A -->
  <rect x="40" y="104" width="250" height="132" rx="12" fill="#EEF4FF" stroke="#9DBEF0" stroke-width="1.2"/>
  <text x="60" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#12305C">① 同步</text>
  <text x="60" y="154" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">git pull --rebase origin main</text>
  <text x="60" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">6672d04 → 40cd3fd（5 个提交）</text>
  <text x="60" y="198" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">0.1.53 → 0.1.57</text>
  <text x="60" y="220" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#6B7280">pnpm install --frozen-lockfile</text>

