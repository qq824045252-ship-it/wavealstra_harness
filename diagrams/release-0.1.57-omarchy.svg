  <text x="472" y="430" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#6B7280">portal(-gtk/-hyprland) 均在运行；判为环境授权，非回归</text>

  <rect x="864" y="292" width="376" height="170" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
