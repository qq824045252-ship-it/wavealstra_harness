  <text x="342" y="154" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">typecheck：通过，新增 0</text>
  <text x="342" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">architecture + graph：5/5</text>
  <text x="342" y="198" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">build：electron-vite ok</text>
  <text x="342" y="220" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">test:all：246 通过 / 0 回归（1.4 min）</text>

  <rect x="604" y="104" width="250" height="132" rx="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2"/>
  <text x="624" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#7C2D12">③ 打 Linux 包</text>
  <text x="624" y="154" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">pnpm -s pack:linux（--dir）</text>
  <text x="624" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">14:48:35 → 14:49:52</text>
  <text x="624" y="198" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#374151">release/linux-unpacked</text>
