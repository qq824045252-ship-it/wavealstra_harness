<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820">
  <rect x="0" y="0" width="1240" height="820" fill="#f7f8fa"/>
  <text x="30" y="40" font-family="Segoe UI, sans-serif" font-size="21" font-weight="bold" fill="#111827">magpie 模型目录刷新边界（Pi 1.0.4 / MyBuddy 0.1.29 / magpie codex/mybuddy）</text>
  <text x="30" y="64" font-family="Segoe UI, sans-serif" font-size="13" fill="#4b5563">实线 = 已用源码与实测验证；虚线 = 建议新增的改动点。图内字段名均为真实字段。</text>

  <!-- Column 1: magpie -->
  <rect x="30" y="90" width="350" height="430" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="48" y="118" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#312e81">magpie 进程（Go，目录权威）</text>

  <rect x="48" y="134" width="314" height="70" rx="8" fill="#ffffff" stroke="#818cf8"/>
  <text x="62" y="158" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">provider.Catalog()</text>
  <text x="62" y="178" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">每个 agent 一份目录；HTTP 侧再按</text>
  <text x="62" y="194" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">网关密钥 keyAllowed 过滤（catalogFor）</text>

  <rect x="48" y="214" width="314" height="78" rx="8" fill="#ffffff" stroke="#818cf8"/>
  <text x="62" y="238" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">SyncCatalog()</text>
  <text x="62" y="258" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">provider 保存/移除、厂商列表重取</text>
  <text x="62" y="274" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">（catalog.Changed）时重写各 agent 列表</text>

  <rect x="48" y="302" width="314" height="86" rx="8" fill="#ffffff" stroke="#818cf8"/>
  <text x="62" y="326" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">piLikeWith + theirsKept</text>
  <text x="62" y="346" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">整段覆盖 providers.magpie.models</text>
  <text x="62" y="362" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">（whole:"models" 归 magpie 独占；</text>
  <text x="62" y="378" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">headers.User-Agent="MyBuddy" 保留）</text>

  <rect x="48" y="398" width="314" height="104" rx="8" fill="#ffffff" stroke="#818cf8"/>
  <text x="62" y="422" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">GET /v1/models（网关）</text>
  <text x="62" y="442" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">id / display_name / reasoning /</text>
  <text x="62" y="458" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">supported_reasoning_levels /</text>
  <text x="62" y="474" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">context_window / max_output_tokens /</text>
  <text x="62" y="490" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">modalities / native_endpoints</text>

  <!-- Column 2: models.json -->
  <rect x="415" y="90" width="330" height="430" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="433" y="118" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#065f46">~/.mybuddy/models.json</text>

  <rect x="433" y="134" width="294" height="150" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="447" y="158" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">providers.magpie</text>
  <text x="447" y="178" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">api: "openai-completions"</text>
  <text x="447" y="195" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">baseUrl: http://127.0.0.1:3425/v1</text>
  <text x="447" y="212" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">headers.User-Agent: "MyBuddy"</text>
  <text x="447" y="229" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">models: [24 条实测；</text>
  <text x="447" y="245" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">含 contextWindow / thinkingLevelMap]</text>
  <text x="447" y="270" font-family="Segoe UI, sans-serif" font-size="12" fill="#b45309">无任何"远端目录"声明字段</text>

  <rect x="433" y="296" width="294" height="64" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="447" y="320" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#92400e">手改 models 段会被覆盖</text>
  <text x="447" y="338" font-family="Segoe UI, sans-serif" font-size="12" fill="#92400e">models 是 magpie 独占整键；下一次</text>
  <text x="447" y="354" font-family="Segoe UI, sans-serif" font-size="12" fill="#92400e">SyncCatalog / 选模型时被重写</text>

  <rect x="433" y="372" width="294" height="60" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="447" y="396" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">sha256 指纹</text>
  <text x="447" y="416" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">变化才触发重载（避免半截 JSON 清空目录）</text>

  <rect x="433" y="444" width="294" height="58" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="447" y="468" font-family="Segoe UI, sans-serif" font-size="12" fill="#065f46">models-store.json（Pi 的刷新结果缓存）</text>
  <text x="447" y="488" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">仅对声明了 refreshModels 的 Provider 写入</text>

  <!-- Column 3: MyBuddy main + Pi -->
  <rect x="775" y="90" width="435" height="430" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="793" y="118" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#7f1d1d">MyBuddy 主进程 + Pi 1.0.4</text>

  <rect x="793" y="134" width="399" height="86" rx="8" fill="#ffffff" stroke="#f87171"/>
  <text x="807" y="158" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">AgentService.refreshExternalModelConfig()</text>
  <text x="807" y="178" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">由 listModels()、promptInternal() 调用 →</text>
  <text x="807" y="195" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">magpie 的外部写入在读/回合边界自动生效</text>
  <text x="807" y="212" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">reloadModelRuntimeFromDisk() → Pi refresh(allowNetwork:false)</text>

  <rect x="793" y="230" width="399" height="112" rx="8" fill="#ffffff" stroke="#f87171"/>
  <text x="807" y="254" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">reloadModels(providerId)（刷新按钮的入口）</text>
  <text x="807" y="274" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">refreshable = getProviders().filter(p =&gt; p.refreshModels)</text>
  <text x="807" y="291" font-family="Segoe UI, sans-serif" font-size="12" fill="#b91c1c">magpie 不在其中 → requestedProviderIds = []</text>
  <text x="807" y="308" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">→ 仍执行 reloadModelRuntimeFromDisk()，但返回 hint</text>
  <text x="807" y="328" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">（本地重载成功；上游拉取未发生）</text>

  <rect x="793" y="352" width="399" height="88" rx="8" fill="#ffffff" stroke="#f87171"/>
  <text x="807" y="376" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">Pi composeProvider(providerId, base, config)</text>
  <text x="807" y="396" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">base = nativeExtensionProviders ?? builtins</text>
  <text x="807" y="413" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">refreshModels = base?.refreshModels || extension?.refreshModels</text>
  <text x="807" y="430" font-family="Segoe UI, sans-serif" font-size="12" fill="#b91c1c">"magpie" 既非 builtin 也未注册 native → 无 base</text>

  <rect x="793" y="450" width="399" height="52" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="807" y="472" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#92400e">Pi 1.0.4 的 models.json schema 无该能力</text>
  <text x="807" y="490" font-family="Segoe UI, sans-serif" font-size="12" fill="#92400e">ProviderConfig: name/baseUrl/apiKey/api/oauth/headers/compat/authHeader/models/modelOverrides</text>

  <!-- arrows: magpie writes -->
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="362" y1="345" x2="430" y2="300" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="729" y1="200" x2="790" y2="180" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="729" y1="400" x2="790" y2="390" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- bottom band: renderer flow -->
  <rect x="30" y="545" width="1180" height="120" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="48" y="572" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="#111827">设置 → 模型：点「刷新模型」后的真实路径（已实测源码路径）</text>
  <text x="48" y="598" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f2937">ModelsTab.reloadModels() → agent.reloadModels("magpie") → refreshExternalModelConfig()（磁盘重载，成功）→ 无 refreshable Provider → 提示：</text>
  <text x="48" y="620" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c">「magpie 由 Pi 读取本地配置，未声明远端刷新；修改模型参数请编辑 models.json 配置。」（ModelsTab.tsx:205）</text>
  <text x="48" y="644" font-family="Segoe UI, sans-serif" font-size="12" fill="#92400e">其中"编辑 models.json"对 magpie 是坏建议：models 段归 magpie 独占，手加条目会在下一次 SyncCatalog 时被删掉。</text>

  <!-- change points -->
  <rect x="30" y="680" width="1180" height="115" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="48" y="706" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="#4c1d95">可选改动点（虚线）：</text>
  <text x="48" y="730" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f2937">① MyBuddy：改 ModelsTab.tsx:205 与 217-218 的文案/判定（区分"已本地重载""无远端能力""未认证"），并撤掉会误导的手改建议。</text>
  <text x="48" y="752" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f2937">② MyBuddy：照 providers/command-code.ts 的 fetchModels 先例，registerNativeProvider 注册 "magpie"（GET &lt;baseUrl&gt;/models）→ 刷新按钮才真正联网。</text>
  <text x="48" y="774" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f2937">③ magpie：加显式"立即同步目录"入口 / 让写入按 keyAllowed 过滤；MyBuddy 侧已自动重载，无需再改。</text>
</svg>
