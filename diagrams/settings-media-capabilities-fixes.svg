<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="设置-工具能力-语音与图像 四项修复：根因与修复链路">
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="20" y="30" font-family="system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#111827">设置 → 工具能力 → 语音与图像：四项修复（实测根因 → 改动 → 验证）</text>
  <text x="20" y="52" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#4b5563">实线框 = 已落盘的代码改动；箭头方向 = 真实调用/数据流。T1/T2/T3/T4 为并行子任务，最终由 Lead 复核。</text>

  <!-- Row 1 -->
  <rect x="16" y="68" width="252" height="112" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="28" y="92" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#111827">① 图片文字识别（本机 NPU OCR）</text>
  <text x="28" y="114" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">根因 A：services() 无 local OCR</text>
  <text x="28" y="132" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">根因 B：resolveOcrCli 漏本机</text>
  <text x="28" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">　　　 检出路径（本机唯一安装）</text>
  <text x="28" y="170" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">T1 · 下拉里没有「本机 OCR · NPU」</text>
  <line x1="268" y1="124" x2="292" y2="124" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="294" y="78" width="196" height="92" rx="7" fill="#eef6ff" stroke="#2563eb"/>
  <text x="306" y="99" font-family="Consolas, monospace" font-size="12" fill="#1e3a8a">LOCAL_OCR_CONNECTION_ID</text>
  <text x="306" y="118" font-family="system-ui, sans-serif" font-size="12" fill="#111827">= "builtin-local-ocr"</text>
  <text x="306" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#374151">services() 新增 source:"local"</text>
  <text x="306" y="156" font-family="system-ui, sans-serif" font-size="12" fill="#374151">capabilities:["ocr"]、免 model</text>
  <line x1="490" y1="124" x2="514" y2="124" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="516" y="78" width="196" height="92" rx="7" fill="#eef6ff" stroke="#2563eb"/>
  <text x="528" y="99" font-family="Consolas, monospace" font-size="12" fill="#1e3a8a">LocalOcrProvider.ts（新）</text>
  <text x="528" y="118" font-family="system-ui, sans-serif" font-size="12" fill="#111827">resolveLocalOcrCli()</text>
  <text x="528" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#374151">env → 标准安装 → 检出路径 → PATH</text>
  <text x="528" y="156" font-family="system-ui, sans-serif" font-size="12" fill="#374151">本机命中 …\OCR_NPU\dist\…\exe</text>
  <line x1="712" y1="124" x2="736" y2="124" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="738" y="78" width="206" height="92" rx="7" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="750" y="99" font-family="Consolas, monospace" font-size="12" fill="#14532d">ocrAdapter() → OCR_NPU_CLI</text>
  <text x="750" y="118" font-family="system-ui, sans-serif" font-size="12" fill="#111827">--input_path … --json</text>
  <text x="750" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#374151">parseLocalOcrJson（有框才给 boxes）</text>
  <text x="750" y="156" font-family="system-ui, sans-serif" font-size="12" fill="#374151">→ ocr_file 工具 → 当前对话</text>

  <!-- Row 2 -->
  <rect x="16" y="190" width="252" height="112" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="28" y="214" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#111827">② OpenRouter 模型自动加载</text>
  <text x="28" y="236" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">根因 A：保存后从不 discover</text>
  <text x="28" y="254" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">根因 B：refresh 复用在飞旧 pass</text>
  <text x="28" y="272" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">　　　（拿到旧配置快照，恒为空）</text>
  <text x="28" y="292" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">T2 · 模型框只能手输，没有选项</text>
  <line x1="268" y1="246" x2="292" y2="246" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="294" y="200" width="196" height="92" rx="7" fill="#eef6ff" stroke="#2563eb"/>
  <text x="306" y="221" font-family="Consolas, monospace" font-size="12" fill="#1e3a8a">saveAndRefresh()</text>
  <text x="306" y="240" font-family="system-ui, sans-serif" font-size="12" fill="#111827">AgentService 保存后触发</text>
  <text x="306" y="260" font-family="system-ui, sans-serif" font-size="12" fill="#374151">后台发现；不阻塞保存事务</text>
  <text x="306" y="278" font-family="system-ui, sans-serif" font-size="12" fill="#374151">renderer 再 await 刷新快照</text>
  <line x1="490" y1="246" x2="514" y2="246" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="516" y="200" width="196" height="92" rx="7" fill="#eef6ff" stroke="#2563eb"/>
  <text x="528" y="221" font-family="Consolas, monospace" font-size="12" fill="#1e3a8a">refresh() revision-aware</text>
  <text x="528" y="240" font-family="system-ui, sans-serif" font-size="12" fill="#111827">同配置共享、旧配置补跑</text>
  <text x="528" y="260" font-family="system-ui, sans-serif" font-size="12" fill="#374151">id:identity 去重一次请求</text>
  <text x="528" y="278" font-family="system-ui, sans-serif" font-size="12" fill="#374151">401/超时 → 可操作 detail</text>
  <line x1="712" y1="246" x2="736" y2="246" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="738" y="200" width="206" height="92" rx="7" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="750" y="221" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827">设置页模型控件</text>
  <text x="750" y="240" font-family="system-ui, sans-serif" font-size="12" fill="#111827">models 非空 → &lt;select&gt; 可选</text>
  <text x="750" y="260" font-family="system-ui, sans-serif" font-size="12" fill="#374151">保留「自定义模型…」手输</text>
  <text x="750" y="278" font-family="system-ui, sans-serif" font-size="12" fill="#374151">无目录 → 提示「刷新状态」</text>

  <!-- Row 3 -->
  <rect x="16" y="312" width="252" height="112" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="28" y="336" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#111827">③ 联网搜索占空间过大</text>
  <text x="28" y="358" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">根因：服务下拉 + 供应商网格 +</text>
  <text x="28" y="376" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">API Key 全部常驻展开</text>
  <text x="28" y="396" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">T4 · 一屏被搜索设置占满</text>
  <text x="28" y="414" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">　　　（图像理解/多模型会诊被挤下去）</text>
  <line x1="268" y1="368" x2="292" y2="368" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="294" y="322" width="196" height="92" rx="7" fill="#eef6ff" stroke="#2563eb"/>
  <text x="306" y="343" font-family="Consolas, monospace" font-size="12" fill="#1e3a8a">CapabilityRow collapsible</text>
  <text x="306" y="362" font-family="system-ui, sans-serif" font-size="12" fill="#111827">defaultCollapsed 仅联网搜索</text>
  <text x="306" y="382" font-family="system-ui, sans-serif" font-size="12" fill="#374151">图像理解可折叠但默认展开</text>
  <line x1="490" y1="368" x2="514" y2="368" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="516" y="322" width="196" height="92" rx="7" fill="#eef6ff" stroke="#2563eb"/>
  <text x="528" y="343" font-family="Consolas, monospace" font-size="12" fill="#1e3a8a">summary 实时摘要</text>
  <text x="528" y="362" font-family="system-ui, sans-serif" font-size="12" fill="#111827">多源同时搜索 · N 家供应商</text>
  <text x="528" y="382" font-family="system-ui, sans-serif" font-size="12" fill="#374151">单源 · X / 按序回退 / 已关闭</text>
  <line x1="712" y1="368" x2="736" y2="368" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="738" y="322" width="206" height="92" rx="7" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="750" y="343" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827">收起不丢草稿</text>
  <text x="750" y="362" font-family="system-ui, sans-serif" font-size="12" fill="#111827">配置区留在 &lt;details&gt; 内挂载</text>
  <text x="750" y="382" font-family="system-ui, sans-serif" font-size="12" fill="#374151">开关/状态徽标/检查始终可见</text>

  <!-- Row 4 -->
  <rect x="16" y="434" width="252" height="112" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="28" y="458" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#111827">④ 本机 Whisper「检查」没用</text>
  <text x="28" y="480" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">根因 A：test() 丢弃 provider 文本</text>
  <text x="28" y="498" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">根因 B：结果只渲染在页面底部</text>
  <text x="28" y="518" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">T3 · 点「检查」看起来毫无反应</text>
  <text x="28" y="536" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">　　　（状态仍是「已配置，未试用」）</text>
  <line x1="268" y1="490" x2="292" y2="490" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="294" y="444" width="196" height="92" rx="7" fill="#eef6ff" stroke="#2563eb"/>
  <text x="306" y="465" font-family="Consolas, monospace" font-size="12" fill="#1e3a8a">provider.test() 有内容了</text>
  <text x="306" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#111827">root / pythonSource / modelDir</text>
  <text x="306" y="504" font-family="system-ui, sans-serif" font-size="12" fill="#374151">+ python -c 依赖探测（≤15s，无推理）</text>
  <line x1="490" y1="490" x2="514" y2="490" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="516" y="444" width="196" height="92" rx="7" fill="#eef6ff" stroke="#2563eb"/>
  <text x="528" y="465" font-family="Consolas, monospace" font-size="12" fill="#1e3a8a">MediaCapabilityServices.test</text>
  <text x="528" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#111827">detail = await provider.test()</text>
  <text x="528" y="504" font-family="system-ui, sans-serif" font-size="12" fill="#374151">失败 → ok:false + 原因（不吞错）</text>
  <line x1="712" y1="490" x2="736" y2="490" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="738" y="444" width="206" height="92" rx="7" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="750" y="465" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827">行内检查结果</text>
  <text x="750" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#111827">.capability-check-result 绿/红</text>
  <text x="750" y="504" font-family="system-ui, sans-serif" font-size="12" fill="#374151">编辑配置即清空（避免旧结果误导）</text>

  <!-- Footer -->
  <rect x="16" y="558" width="928" height="30" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="28" y="578" font-family="system-ui, sans-serif" font-size="12" fill="#111827">验证（只测试、未构建）：pnpm -s typecheck ✓ · 11 个 headless 套件全绿 · media-capabilities-dom 16/16 · 未跑 build/pack/dist 与 Electron GUI 用例</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
