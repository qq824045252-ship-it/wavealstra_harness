  <text x="588" y="868" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1e293b">d8043128 / 5b600690：op=prompt 一次性调用（inputCount=1），另一套形态</text>
  <text x="588" y="890" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1e293b">真正要修的是 tracer 把 compaction 与 stream 混在一条链（task-1）</text>

