<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="900" fill="#ffffff"/>

  <text x="40" y="44" font-size="22" font-weight="700" fill="#1f2933">图片消息渲染链路（源码实测，非推断）</text>
  <text x="40" y="70" font-size="13" fill="#52606d">实线 = 已验证的数据通路；右侧数字 = 本机 app.db 中 622 个 image artifact 的真实统计</text>

  <!-- ============ left: pipeline ============ -->
  <!-- 1 -->
  <rect x="40" y="96" width="660" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="122" font-size="15" font-weight="600" fill="#1f2933">① 磁盘原图（workspace-file artifact）</text>
  <text x="60" y="143" font-size="12.5" fill="#52606d">531 个文件仍在磁盘 · p50 0.08MB · p90 0.42MB · max 10.0MB</text>

  <path d="M370 158 L370 182" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 -->
  <rect x="40" y="184" width="660" height="80" rx="8" fill="#fef7ed" stroke="#e08b32" stroke-width="1.8"/>
  <text x="60" y="210" font-size="15" font-weight="600" fill="#1f2933">② previewWorkspaceFile() — WorkspaceService.ts:238</text>
  <text x="60" y="231" font-size="12.5" fill="#52606d">readFile 全量 → data:image/…;base64（×1.37）</text>
  <text x="60" y="251" font-size="12.5" fill="#b45309">Office 分支有 OFFICE_PREVIEW_MAX_BYTES；image / pdf / media / cad 一行都没有</text>

  <path d="M370 264 L370 288" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 -->
  <rect x="40" y="290" width="660" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="316" font-size="15" font-weight="600" fill="#1f2933">③ IPC artifactDomain.readContent → ArtifactService.ts:639</text>
  <text x="60" y="337" font-size="12.5" fill="#52606d">复用同一条 previewWorkspaceFile；renderer 收到完整 base64 字符串</text>

  <path d="M370 352 L370 376" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 -->
  <rect x="40" y="378" width="660" height="80" rx="8" fill="#fef7ed" stroke="#e08b32" stroke-width="1.8"/>
  <text x="60" y="404" font-size="15" font-weight="600" fill="#1f2933">④ renderHydration.ensure() → artifactRenderCache</text>
  <text x="60" y="425" font-size="12.5" fill="#52606d">cache 只按 descriptor.version 做 stale gate：无 LRU、无视口回收</text>
  <text x="60" y="445" font-size="12.5" fill="#b45309">removeCache 已存在（renderHydration.ts:29/185/190），只接 artifact 事件</text>

  <path d="M370 458 L370 482" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 -->
  <rect x="40" y="484" width="660" height="80" rx="8" fill="#fef7ed" stroke="#e08b32" stroke-width="1.8"/>
  <text x="60" y="510" font-size="15" font-weight="600" fill="#1f2933">⑤ ChatImage.tsx:120 — &lt;img src="data:…"&gt;</text>
  <text x="60" y="531" font-size="12.5" fill="#52606d">maxHeight:480 / width:auto / height:auto；无 width/height 属性、无 aspect-ratio</text>
  <text x="60" y="551" font-size="12.5" fill="#b45309">加载前高度≈0 → onload 跳到 480 → 行高重测</text>

  <path d="M370 564 L370 588" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6 -->
  <rect x="40" y="590" width="660" height="92" rx="8" fill="#fdecec" stroke="#d9534f" stroke-width="1.8"/>
  <text x="60" y="616" font-size="15" font-weight="600" fill="#1f2933">⑥ Chromium 解码原始分辨率 → 位图驻留 / 驱逐 / 重解码</text>
  <text x="60" y="637" font-size="12.5" fill="#52606d">CSS maxHeight:480 只缩放绘制，不减少位图面积（width×height×4）</text>
  <text x="60" y="657" font-size="12.5" fill="#d9534f">单条消息 38 图 = 44.8MP ≈ 762MB RGBA，而磁盘仅 13MB</text>
  <text x="60" y="674" font-size="12.5" fill="#d9534f">6 条消息各自的位图需求超过 128MB 图像缓存 → 滚动必然 evict / 重解</text>

  <!-- ============ right column ============ -->
  <rect x="730" y="96" width="470" height="216" rx="10" fill="#f0f7ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="750" y="124" font-size="14.5" font-weight="700" fill="#1f2933">实测：瓶颈是解码面积，不是 base64</text>
  <text x="750" y="148" font-size="12.5" fill="#52606d">每张图磁盘 p90 0.42MB → base64 ≈ 0.57MB</text>
  <text x="750" y="167" font-size="12.5" fill="#52606d">每张图解码 p90 2.84MP → RGBA ≈ 11.4MB</text>
  <text x="750" y="192" font-size="12.5" font-weight="600" fill="#1f2933">相差 ≈20×：改通道省流量，改解码才省命</text>
  <text x="750" y="216" font-size="12.5" fill="#52606d">带图消息 108 条；图/消息 p50=2 · p90=12 · max=72</text>
  <text x="750" y="235" font-size="12.5" fill="#52606d">622 张图全部驻留 ≈ 2942MB RGBA</text>
  <text x="750" y="259" font-size="12.5" fill="#52606d">38 图消息估算 ≤6000px</text>
  <text x="750" y="278" font-size="12.5" fill="#52606d">真实可达 38×480 ≈ 18240px → 误差 ≥3×</text>

  <rect x="730" y="332" width="470" height="196" rx="10" fill="#f3fbf5" stroke="#047857" stroke-width="1.5"/>
  <text x="750" y="360" font-size="14.5" font-weight="700" fill="#1f2933">P0 的正确形状（与清单不同）</text>
  <text x="750" y="384" font-size="12.5" fill="#52606d">resizeImage() 已是主进程依赖</text>
  <text x="750" y="403" font-size="12.5" fill="#52606d">（VisionModelCapabilityProvider.ts:66）</text>
  <text x="750" y="422" font-size="12.5" fill="#52606d">返回 data / mimeType / width / height / original*</text>
  <text x="750" y="446" font-size="12.5" font-weight="600" fill="#047857">→ 缩略图与固有尺寸一次调用同时拿到</text>
  <text x="750" y="465" font-size="12.5" font-weight="600" fill="#047857">→ 清单里的 P0 与 P1 合并成一个改动</text>
  <text x="750" y="489" font-size="12.5" fill="#52606d">跑 worker 线程；image-resize-worker.js 已在打包 payload</text>
  <text x="750" y="508" font-size="12.5" fill="#52606d">（package.json:578 / validate:packaged-image-resize）</text>
  <text x="750" y="522" font-size="12.5" fill="#52606d">无需新依赖，无 native 重编译</text>

  <rect x="730" y="548" width="470" height="134" rx="10" fill="#fdecec" stroke="#d9534f" stroke-width="1.5"/>
  <text x="750" y="576" font-size="14.5" font-weight="700" fill="#1f2933">清单 P0 的协议方案在这条链上是断的</text>
  <text x="750" y="600" font-size="12.5" fill="#52606d">index.html:8 CSP img-src = 'self' data: blob: mybuddy-library: https:</text>
  <text x="750" y="619" font-size="12.5" font-weight="600" fill="#d9534f">没有 mybuddy-artifact: → &lt;img&gt; 直接被 CSP 拦掉</text>
  <text x="750" y="643" font-size="12.5" fill="#52606d">且 WebArtifactRuntime 用 cachePolicy:"no-store"</text>
  <text x="750" y="662" font-size="12.5" fill="#52606d">只解决 heap 字符串，不解决位图面积</text>

  <!-- ============ bottom band ============ -->
  <rect x="40" y="706" width="1160" height="158" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="734" font-size="15" font-weight="700" fill="#1f2933">改动落点（修正后）：每一刀只切一处，可单独复测</text>

  <text x="60" y="762" font-size="13" font-weight="600" fill="#047857">P0　②处插入 thumbnail：长边 1280 / webp q80（=480CSS×@2x 反推），同时回填 width/height</text>
  <text x="60" y="781" font-size="12" fill="#52606d">　　点击查看原图仍走原链路；原 base64 分支保留一个版本作 fallback（回滚点 = previewWorkspaceFile 返回形态）</text>

  <text x="60" y="808" font-size="13" font-weight="600" fill="#2563eb">P1　⑤处用 DTO 的 width/height 写死 aspect-ratio + min-height，加载完成不改行高</text>
  <text x="60" y="827" font-size="12" fill="#52606d">　　只改 ChatImage 的属性与样式，不碰数据通路</text>

  <text x="60" y="852" font-size="13" font-weight="600" fill="#b45309">P2　③ estimateMessageHeight 数 markdown 图片；④ cache 接视口回收</text>

  <text x="770" y="762" font-size="13" font-weight="600" fill="#52606d">P3　去掉 Provider 的 counts / setCounts</text>
  <text x="770" y="781" font-size="12" fill="#52606d">　　现 Provider 包住整个 assistant-card（MessageItem.tsx:724）</text>
  <text x="770" y="800" font-size="12" fill="#52606d">　　→ counts 变化重渲染 markstream 全卡，不止 n² 个 ChatImage</text>
  <text x="770" y="827" font-size="13" font-weight="600" fill="#52606d">不做　消息行再加 content-visibility</text>
  <text x="770" y="846" font-size="12" fill="#52606d">　　global.css:22956 已写明与整条虚拟化冲突</text>
</svg>
