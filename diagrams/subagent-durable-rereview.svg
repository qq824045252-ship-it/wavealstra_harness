<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="880" height="330" fill="#F7F9FC"/>
  <text x="24" y="36" font-size="19" font-weight="700" fill="#0F172A">重构前后：子代理执行与结果契约变了</text>
  <text x="24" y="60" font-size="12" fill="#475569">显示名（displayName）逻辑保留；身份与结果传输方式被替换</text>

  <rect x="24" y="84" width="390" height="180" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="40" y="110" font-size="14" font-weight="700" fill="#64748B">旧：Pi 子进程 worker（已删除）</text>
  <text x="40" y="136" font-size="12" fill="#0F172A">入口：capabilities/subagent/index.ts</text>
  <text x="40" y="160" font-size="12" fill="#0F172A">id：${role}-${6 位随机}</text>
  <text x="40" y="184" font-size="12" fill="#0F172A">结果：文本标记 &gt; subagent: id</text>
  <text x="40" y="208" font-size="12" fill="#0F172A">渲染：正则解析文本</text>
  <text x="40" y="238" font-size="11" fill="#475569">一次性进程，结束即销毁</text>

  <rect x="466" y="84" width="390" height="180" rx="10" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="482" y="110" font-size="14" font-weight="700" fill="#1D4ED8">新：Pi Durable 子会话</text>
  <text x="482" y="136" font-size="12" fill="#0F172A">入口：agent/durable/DurableSubagents.ts</text>
  <text x="482" y="160" font-size="12" fill="#0F172A">id：durable-&lt;hash&gt;-&lt;task&gt;-&lt;index&gt;</text>
  <text x="482" y="184" font-size="12" fill="#0F172A">结果：details.results[]（结构化）</text>
  <text x="482" y="208" font-size="12" fill="#0F172A">渲染：本次修复为结构化优先</text>
  <text x="482" y="238" font-size="11" fill="#475569">可恢复、可重放，子会话保留历史</text>

  <text x="24" y="300" font-size="12" fill="#0F172A">共同点：displayName 仍自动从 151 个简中名分配；subagentId 仍为 ASCII；角色仍需是已存在的 .md 角色</text>
  <text x="24" y="320" font-size="11" fill="#475569">差异：调用方传入的 subagentId 在新架构里未生效（schema 仍宣称可复用，待决策）</text>
</svg>
