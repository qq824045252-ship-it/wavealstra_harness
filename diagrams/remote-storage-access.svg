<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" font-family="Microsoft YaHei, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="810" fill="#f7f9fc"/>

  <text x="30" y="42" font-size="22" font-weight="700" fill="#0f172a">DSH 访问 Google Drive / NAS 的真实链路（本机实测）</text>
  <text x="30" y="68" font-size="13" fill="#475569">工作区根 = C:\Users\servi\Documents\GitHub\wavealstra_harness　｜　permission preset = danger-full-access（approval: never）</text>

  <!-- left chain -->
  <rect x="30" y="96" width="300" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="46" y="124" font-size="15" font-weight="700" fill="#0f172a">① 模型工具</text>
  <text x="46" y="148" font-size="13" fill="#334155">read / write / edit / glob / grep / pwsh</text>
  <line x1="180" y1="168" x2="180" y2="194" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="30" y="196" width="300" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="46" y="224" font-size="15" font-weight="700" fill="#0f172a">② ctx.fs = dsh-fs-local</text>
  <text x="46" y="248" font-size="13" fill="#334155">cwd 只是相对路径的基准，<tspan font-weight="700">不是边界</tspan></text>
  <text x="46" y="268" font-size="13" fill="#334155">绝对路径 / 盘符 / UNC 直接交给 OS</text>
  <text x="46" y="288" font-size="13" fill="#334155">读取在任何沙箱模式下都不被围栏</text>
  <line x1="180" y1="296" x2="180" y2="322" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="30" y="324" width="300" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="46" y="352" font-size="15" font-weight="700" fill="#0f172a">③ 写围栏 = dsh-fs-sandbox</text>
  <text x="46" y="376" font-size="13" fill="#334155">按 realpath(targetKey) 判定 writableRoots</text>
  <text x="46" y="396" font-size="13" fill="#334155">workspace-write：仅工作区 + 临时区</text>
  <text x="46" y="416" font-size="13" fill="#334155">read-only：拒绝全部变更</text>
  <text x="46" y="436" font-size="13" fill="#16a34a" font-weight="700">当前 danger-full-access → 不拦</text>
  <line x1="180" y1="444" x2="180" y2="468" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="30" y="470" width="300" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="46" y="498" font-size="15" font-weight="700" fill="#0f172a">④ Windows 文件系统</text>
  <text x="46" y="522" font-size="13" fill="#334155">与 DSH 同用户身份，不走内核沙箱</text>
  <text x="46" y="542" font-size="13" fill="#334155">因此挂载点 / 映射盘 / UNC 都算“本地路径”</text>

  <!-- split to storage cards -->
  <path d="M180,550 L180,572 L215,572 L215,588" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M180,550 L180,572 L605,572 L605,588" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M180,550 L180,572 L990,572 L990,588" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- card 1: Google Drive -->
  <rect x="30" y="590" width="370" height="170" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="46" y="618" font-size="15" font-weight="700" fill="#0f172a">G:\　Google Drive（Drive for Desktop）</text>
  <text x="46" y="644" font-size="13" fill="#334155">GoogleDriveFS 进程在跑，元数据来自本地缓存</text>
  <text x="46" y="664" font-size="13" fill="#334155">列目录 <tspan fill="#16a34a" font-weight="700">✅ 可用</tspan>　读文件内容 <tspan fill="#dc2626" font-weight="700">❌ 19 s 信号灯超时</tspan></text>
  <text x="46" y="684" font-size="13" fill="#334155">日志：UNAVAILABLE_WHILE_OFFLINE → googleapis 不通</text>
  <text x="46" y="704" font-size="13" fill="#334155">修复：开 Clash 系统代理，让 DriveFS 走 7890 端口</text>
  <text x="46" y="724" font-size="13" fill="#334155">.gdoc / .gsheet 只是 186 B 指针，read 会得到 EISDIR</text>
  <text x="46" y="746" font-size="12" fill="#64748b">流式盘：首次访问才真正下载，带 73 MB 级 PDF 会很慢</text>

  <!-- card 2: NAS -->
  <rect x="420" y="590" width="370" height="170" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="436" y="618" font-size="15" font-weight="700" fill="#0f172a">NAS：SMB 映射盘 / UNC 直连</text>
  <text x="436" y="644" font-size="13" fill="#334155">Z: → \\clairvoyancenas\技术部公开</text>
  <text x="436" y="664" font-size="13" fill="#334155">映射 Unavailable，Test-Path Z:\ = False <tspan fill="#dc2626" font-weight="700">❌</tspan></text>
  <text x="436" y="684" font-size="13" fill="#334155">UNC 直连 <tspan fill="#16a34a" font-weight="700">✅</tspan>　读 14 KB xlsx 用时 0.02 s <tspan fill="#16a34a" font-weight="700">✅</tspan></text>
  <text x="436" y="704" font-size="13" fill="#334155">主机 192.168.3.100，共享下有 项目文件 / 防爆证书 …</text>
  <text x="436" y="724" font-size="13" fill="#334155">重连：net use Z: &lt;UNC&gt; /persistent:yes</text>
  <text x="436" y="746" font-size="12" fill="#64748b">SMB 上 git / ripgrep / 文件监听（chokidar）会慢或失效</text>

  <!-- card 3: three routes -->
  <rect x="810" y="590" width="360" height="170" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="826" y="618" font-size="15" font-weight="700" fill="#0f172a">把远端目录“挂进工作区”的三条路线</text>
  <text x="826" y="644" font-size="13" fill="#334155">① 直接用绝对路径 / UNC（现在就能用）</text>
  <text x="826" y="664" font-size="13" fill="#334155">② mklink /J 目录联接进工作区（侧栏可见）</text>
  <text x="826" y="684" font-size="13" fill="#334155">③ 项目根直接设为 G:\ 或 \\nas\share</text>
  <text x="826" y="704" font-size="13" fill="#334155">＋ MCP：接 Drive API，才能读 .gdoc 真实内容</text>
  <text x="826" y="724" font-size="13" fill="#334155">写限制：workspace-write 下 ② 仍会被 realpath 拒</text>
  <text x="826" y="746" font-size="12" fill="#64748b">GUI 侧栏列举目录限定工作区；预览可读外部绝对路径</text>

  <!-- footnote -->
  <rect x="30" y="772" width="1140" height="28" rx="6" fill="#eef2f7" stroke="#dbe3ee"/>
  <text x="44" y="791" font-size="12.5" fill="#475569">要点：DSH 没有云盘/NAS 后端插件，它只认 OS 路径；所以“挂载”发生在 Windows 侧，DSH 侧只需路径可达 + 沙箱允许。</text>
</svg>
