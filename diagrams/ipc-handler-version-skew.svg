<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="'Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="660" fill="#f8fafc"/>

  <text x="32" y="38" font-size="21" font-weight="700" fill="#0f172a">工具能力保存失败：主进程与 preload 代码版本错位</text>
  <text x="32" y="64" font-size="13" fill="#475569">主进程只在启动时加载代码；preload / renderer 每次页面加载都会重新执行 → 同一个窗口里可以同时跑着两个不同提交</text>

  <!-- time axis labels -->
  <text x="240" y="92" font-size="12" fill="#64748b" text-anchor="middle">11-04 15:41:33 启动</text>
  <text x="470" y="92" font-size="12" fill="#64748b" text-anchor="middle">11-04 17:23 / 17:27 提交</text>
  <text x="740" y="92" font-size="12" fill="#64748b" text-anchor="middle">11-05 08:35 保存失败</text>
  <text x="1000" y="92" font-size="12" fill="#64748b" text-anchor="middle">11-05 08:36:51 重启</text>

  <!-- Lane A -->
  <rect x="180" y="104" width="910" height="190" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="186" y="140" font-size="13" font-weight="700" fill="#92400e">主进程</text>
  <text x="186" y="160" font-size="12" fill="#b45309">main</text>
  <text x="186" y="182" font-size="12" fill="#b45309">常驻</text>
  <text x="186" y="202" font-size="12" fill="#b45309">启动时加载</text>

  <rect x="250" y="120" width="200" height="150" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="264" y="142" font-size="13" font-weight="700" fill="#0f172a">11-04 15:41:33 启动</text>
  <text x="264" y="164" font-size="12" fill="#0f172a">v0.1.86 构建</text>
  <text x="264" y="184" font-size="12" fill="#0f172a">bundle 读入内存后</text>
  <text x="264" y="204" font-size="12" fill="#0f172a">不再随源码更新</text>
  <text x="264" y="228" font-size="12" fill="#b91c1c">→ 没有新 channel 的 handler</text>

  <line x1="456" y1="195" x2="592" y2="195" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrowGray)"/>
  <text x="524" y="182" font-size="12" fill="#b45309" text-anchor="middle">同一进程未重启（约 17 小时）</text>

  <rect x="600" y="120" width="310" height="150" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
  <text x="616" y="142" font-size="13" font-weight="700" fill="#991b1b">08:35:41 点击「保存」</text>
  <text x="616" y="164" font-size="12" fill="#0f172a">renderer 走 preload 桥发出</text>
  <text x="616" y="184" font-size="12" fill="#0f172a">ipcRenderer.invoke(channel)</text>
  <text x="616" y="206" font-size="12" fill="#0f172a">旧主进程没有注册这个 handler</text>
  <text x="616" y="230" font-size="12" font-weight="700" fill="#b91c1c">→ No handler registered</text>

  <line x1="916" y1="195" x2="944" y2="195" stroke="#10b981" stroke-width="1.4" marker-end="url(#arrowGreen)"/>

  <rect x="950" y="120" width="140" height="150" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
  <text x="962" y="142" font-size="12" font-weight="700" fill="#065f46">08:36:51 重启</text>
  <text x="962" y="164" font-size="12" fill="#0f172a">v0.1.94 (dev)</text>
  <text x="962" y="184" font-size="12" fill="#0f172a">bundle 含</text>
  <text x="962" y="204" font-size="12" fill="#0f172a">ipcMain.handle</text>
  <text x="962" y="228" font-size="12" font-weight="700" fill="#047857">✅ 已注册</text>

  <!-- Lane B -->
  <rect x="180" y="344" width="910" height="190" rx="10" fill="#f5f9ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="186" y="380" font-size="12" font-weight="700" fill="#1e40af">preload</text>
  <text x="186" y="400" font-size="12" fill="#1d4ed8">+ renderer</text>
  <text x="186" y="422" font-size="12" fill="#1d4ed8">每次页面加载</text>
  <text x="186" y="442" font-size="12" fill="#1d4ed8">重新执行</text>
  <text x="186" y="462" font-size="12" fill="#1d4ed8">可拿到新代码</text>

  <rect x="300" y="360" width="330" height="150" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="314" y="382" font-size="13" font-weight="700" fill="#1e3a8a">11-04 17:23 提交 17ead44</text>
  <text x="314" y="404" font-size="12" fill="#0f172a">main + preload 新增该通道</text>
  <text x="314" y="424" font-size="12" fill="#0f172a">saveBuiltinCapabilitySettings</text>
  <text x="314" y="446" font-size="13" font-weight="700" fill="#1e3a8a">11-04 17:27 提交 3a5507d</text>
  <text x="314" y="466" font-size="12" fill="#0f172a">renderer 改为调用它</text>
  <text x="314" y="488" font-size="12" fill="#64748b">（更早打开的窗口里没有这段代码）</text>

  <line x1="634" y1="435" x2="716" y2="435" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#arrowBlue)"/>

  <rect x="720" y="360" width="300" height="150" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="734" y="382" font-size="13" font-weight="700" fill="#1e3a8a">08:35 重新构建 / 页面加载</text>
  <text x="734" y="404" font-size="12" fill="#0f172a">out/renderer 08:35:27</text>
  <text x="734" y="424" font-size="12" fill="#0f172a">preload + renderer 变新</text>
  <text x="734" y="446" font-size="12" fill="#64748b">（推断：重载或 HMR）</text>
  <text x="734" y="470" font-size="12" fill="#0f172a">所以才会调用新通道</text>

  <line x1="760" y1="356" x2="760" y2="274" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="775" y="300" font-size="12" fill="#b91c1c">preload 桥已是新代码</text>
  <text x="775" y="320" font-size="12" fill="#b91c1c">→ invoke 打到旧主进程</text>

  <text x="180" y="556" font-size="12" fill="#64748b">时间戳 / 日志 / 文件 mtime / 提交 = 已验证；「页面重载或 HMR」的具体触发方式没有日志，按 IPC 语义推断</text>

  <!-- verification panel -->
  <rect x="32" y="572" width="1056" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="48" y="596" font-size="12" fill="#14532d">✅ 当前实例 PID 48660 于 08:36:51 重启（v0.1.94），其 out/main/index.js（同日 08:36:51 构建）已核对到 ipcMain.handle(AgentIpc.saveBuiltinCapabilitySettings)</text>
  <text x="48" y="618" font-size="12" fill="#14532d">✅ pnpm -s test:ipc-channel-inventory 通过：472 个注册点 / 468 个唯一 channel / 0 个未解析引用</text>
  <text x="48" y="640" font-size="12" fill="#14532d">✅ 三处同版本：src/main/index.ts:1297 → src/preload/index.ts:543 → CapabilitiesTab.tsx:435</text>
</svg>
