<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Microsoft YaHei, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#f7f9fc"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">MyBuddy 能不能“挂载” Google Drive / NAS：代码层的真实边界</text>
  <text x="30" y="64" font-size="13" fill="#475569">MyBuddy 没有网盘/NAS 后端：Space 只有 name + path；能走多远取决于 Windows 给不给路径</text>

  <!-- left chain -->
  <rect x="30" y="95" width="300" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="46" y="120" font-size="14.5" font-weight="700" fill="#0f172a">新建工作空间 → 选择文件夹</text>
  <text x="46" y="141" font-size="12.5" fill="#334155">Electron openDirectory 对话框 → spaces.path</text>
  <text x="46" y="158" font-size="12.5" fill="#334155">任意绝对路径；UNC 可在地址栏粘贴</text>

  <rect x="30" y="190" width="300" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="46" y="215" font-size="13" font-weight="700" fill="#0f172a">resolveWorkspaceExecutionPath()</text>
  <text x="46" y="236" font-size="12.5" fill="#334155">空间 path（含祖先继承）有效 → 用它</text>
  <text x="46" y="254" font-size="12.5" fill="#334155">无 path / 已失效 → 回退隔离目录</text>
  <text x="46" y="271" font-size="12" fill="#64748b">~/.mybuddy/task-workspaces/&lt;task&gt;</text>

  <rect x="30" y="305" width="300" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="46" y="330" font-size="14.5" font-weight="700" fill="#0f172a">taskRoot = 空间 path</text>
  <text x="46" y="351" font-size="12.5" fill="#334155">agent 的 read / write / bash</text>
  <text x="46" y="369" font-size="12.5" fill="#334155">全部以这个目录为根</text>

  <rect x="30" y="410" width="300" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="46" y="435" font-size="14.5" font-weight="700" fill="#0f172a">TaskFileAccessPolicy</text>
  <text x="46" y="456" font-size="12.5" fill="#334155">taskRoot 内：读 / 写 / 建 直接放行</text>
  <text x="46" y="474" font-size="12.5" fill="#334155">外部：只读 grant 或目录写 grant</text>
  <text x="46" y="492" font-size="12" fill="#64748b">否则 scope=external 拒绝</text>

  <rect x="30" y="525" width="300" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="46" y="550" font-size="14.5" font-weight="700" fill="#0f172a">assertPathInsideTask</text>
  <text x="46" y="571" font-size="12.5" fill="#334155">词法 relative + realpath 双层校验</text>
  <text x="46" y="589" font-size="12.5" fill="#334155">Junction / 符号链接逃逸 → 直接拒绝</text>
  <text x="46" y="607" font-size="12" fill="#64748b">TaskPathBoundaryError</text>

  <line x1="180" y1="165" x2="180" y2="188" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="180" y1="280" x2="180" y2="303" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="180" y1="385" x2="180" y2="408" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="180" y1="500" x2="180" y2="523" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- bus to branches -->
  <path d="M330,345 L366,345" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M366,155 L366,570" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M366,155 L396,155" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ar-ok)"/>
  <path d="M366,310 L396,310" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar-bad)"/>
  <path d="M366,452 L396,452" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M366,570 L396,570" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- R1 ok -->
  <rect x="400" y="95" width="760" height="120" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.6"/>
  <text x="416" y="120" font-size="14.5" font-weight="700" fill="#15803d">✓ 路线 A：空间 path 直接就是挂载点（推荐，零开发）</text>
  <text x="416" y="144" font-size="12.5" fill="#334155">新建工作空间 → 选择文件夹 → G:\… / Z:\… / \\clairvoyancenas\…</text>
  <text x="416" y="164" font-size="12.5" fill="#334155">taskRoot 就是该目录，读写都算“任务根内” → 不需要任何 grant，也不需要改代码</text>
  <text x="416" y="184" font-size="12.5" fill="#334155">前提：OS 侧已挂载（Drive for Desktop 的 G:、SMB 映射的 Z:）；断连时见下</text>
  <text x="416" y="204" font-size="12" fill="#64748b">这是 MyBuddy 里最接近“挂载”的能力：一个 Space = 一个可绑定的远端目录</text>

  <!-- R2 bad -->
  <rect x="400" y="240" width="760" height="140" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.6"/>
  <text x="416" y="265" font-size="14.5" font-weight="700" fill="#b91c1c">✗ 路线 B：把 junction 塞进本地空间里</text>
  <text x="416" y="289" font-size="12.5" fill="#334155">C:\repo\nas → \\clairvoyancenas\技术部公开 的 mklink /J</text>
  <text x="416" y="309" font-size="12.5" fill="#334155">assertPathInsideTask 会 realpath 到链接目标，判定逃逸 → TaskPathBoundaryError</text>
  <text x="416" y="329" font-size="12.5" fill="#334155">结论：junction 只能当“空间根”，不能当“本地空间里的子目录”</text>
  <text x="416" y="349" font-size="12.5" fill="#334155">bash 不受该层拦截（只强制 cwd），但 read/write 等工具会被拒</text>
  <text x="416" y="369" font-size="12" fill="#64748b">这条正是“本地工作区 + 外挂目录”最常见的失败姿势</text>

  <!-- R3 copy -->
  <rect x="400" y="405" width="760" height="95" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="416" y="430" font-size="14.5" font-weight="700" fill="#0f172a">○ 路线 C：一次性引用（复制进任务，只读）</text>
  <text x="416" y="454" font-size="12.5" fill="#334155">拖入 / workspace:copyIntoTask → 文件被复制到 ~/.mybuddy/task-workspaces/&lt;task&gt;</text>
  <text x="416" y="474" font-size="12.5" fill="#334155">适合单份 PDF / Excel；批量目录或大文件会占本地磁盘，不是“挂载”</text>

  <!-- R4 offline -->
  <rect x="400" y="525" width="760" height="90" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.6"/>
  <text x="416" y="550" font-size="14.5" font-weight="700" fill="#b45309">! 断连 / 离线时会发生什么</text>
  <text x="416" y="574" font-size="12.5" fill="#334155">statSync 失败 → WorkspacePathError(workspace-path-missing) → 空间显示“文件夹丢失”</text>
  <text x="416" y="594" font-size="12.5" fill="#334155">Drive 流式盘更隐蔽：stat 成功但读内容 19 s 超时（本机实测）→ 任务卡住而非报错</text>

  <!-- R5 future -->
  <rect x="400" y="640" width="760" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="416" y="665" font-size="14.5" font-weight="700" fill="#334155">要“在 MyBuddy 内挂载”需要补什么（当前未实现）</text>
  <text x="416" y="689" font-size="12.5" fill="#334155">spaces 增 provider 字段（local / smb / rclone）+ 凭据存储 + 启动时拉起挂载并分配盘符</text>
  <text x="416" y="709" font-size="12.5" fill="#334155">断连恢复、pathMissing 语义、远端缓存与 listWorkspaceFiles 的 12 层 / 5000 文件上限适配</text>
  <text x="416" y="729" font-size="12" fill="#64748b">现成能力只能到“空间 = 已挂载路径”这一层</text>

  <rect x="30" y="760" width="1140" height="26" rx="6" fill="#eef2f7" stroke="#dbe3ee"/>
  <text x="44" y="778" font-size="12.5" fill="#475569">证据：src/main 无 Drive / SMB / WebDAV / rclone 客户端；LibraryService 注释“资料库不是网盘”；Space 仅 name + path，执行根由 resolveWorkspaceExecutionPath 解析。</text>
</svg>
