<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-label="模型解析链与全局默认写入点">
  <rect x="0" y="0" width="920" height="500" fill="#ffffff"/>
  <text x="28" y="42" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#111827">一次会话的模型解析链（resolveEffectiveModelId）</text>
  <text x="28" y="66" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#5b6472">按代码真实顺序：显式 &gt; 场景推荐 &gt; Mode/Tag 建议 &gt; 全局默认 &gt; Pi 自动。右侧虚线 = 会改写全局默认的入口。</text>

  <!-- ① -->
  <rect x="28" y="86" width="560" height="58" rx="8" fill="#f7f9fc" stroke="#c9d4e3"/>
  <text x="46" y="112" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#111827">① 显式 opts.modelId</text>
  <text x="46" y="131" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#5b6472">任务级选择（输入栏 setActiveModel）/ 调用方直接传入 · 优先级最高</text>

  <!-- ② -->
  <rect x="28" y="162" width="560" height="58" rx="8" fill="#fff8ea" stroke="#e0a33a"/>
  <text x="46" y="188" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#7a4b00">② 场景模型推荐 · evaluatedTaskModel()</text>
  <text x="46" y="207" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#7a4b00">仅 coding | working；须 evidencePath 非空 + 模型已启用可用，否则整条跳过</text>

  <!-- ③ -->
  <rect x="28" y="238" width="560" height="58" rx="8" fill="#f7f9fc" stroke="#c9d4e3"/>
  <text x="46" y="264" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#111827">③ Mode / Tag 建议 suggestedModelId</text>
  <text x="46" y="283" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#5b6472">mode policy 里配的建议值；装配预览与 createSession 共用同一套解析</text>

  <!-- ④ -->
  <rect x="28" y="314" width="560" height="58" rx="8" fill="#eef6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="46" y="340" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0b3d75">④ 全局默认 defaultModelId</text>
  <text x="46" y="359" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#0b3d75">实际存在 Pi settings 的 defaultProvider / defaultModel，不是 settings.json 自己的一份</text>

  <!-- ⑤ -->
  <rect x="28" y="390" width="560" height="58" rx="8" fill="#f7f9fc" stroke="#c9d4e3"/>
  <text x="46" y="416" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#111827">⑤ resolveAutomaticModel</text>
  <text x="46" y="435" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#5b6472">以上都不可用时，由 Pi 运行时在已启用模型里自动挑一个</text>

  <!-- 箭头 -->
  <g stroke="#8b98a9" stroke-width="1.6" fill="none">
    <line x1="308" y1="144" x2="308" y2="158"/>
    <line x1="308" y1="220" x2="308" y2="234"/>
    <line x1="308" y1="296" x2="308" y2="310"/>
    <line x1="308" y1="372" x2="308" y2="386"/>
  </g>
  <g fill="#8b98a9">
    <path d="M308 158 l-5 -8 h10 z"/>
    <path d="M308 234 l-5 -8 h10 z"/>
    <path d="M308 310 l-5 -8 h10 z"/>
    <path d="M308 386 l-5 -8 h10 z"/>
  </g>

  <!-- 写入面板 -->
  <rect x="612" y="86" width="280" height="286" rx="10" fill="#f8fafc" stroke="#d8e0ea"/>
  <text x="630" y="112" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#111827">写入 ④ 的入口（全都在改全局默认）</text>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3f4a5a">
    <text x="630" y="142">· 模型用途 › 主对话默认（本面板）</text>
    <text x="630" y="170">· 输入栏切换模型 setActiveModel</text>
    <text x="630" y="198">· 登录成功 applyLoginModelSelection</text>
    <text x="630" y="226">· 模型失效 reconcileAssignments</text>
  </g>
  <line x1="630" y1="246" x2="872" y2="246" stroke="#d8e0ea"/>
  <text x="630" y="270" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#5b6472">面板提示“只在这里管理”与代码不符：</text>
  <text x="630" y="290" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#b45309">输入栏切换同样写 defaultModelId，</text>
  <text x="630" y="310" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#b45309">会改掉之后新会话的默认。</text>
  <text x="630" y="340" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#5b6472">谁在兜底用 ④：</text>
  <text x="630" y="360" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#5b6472">定时任务 / 远程任务 / Bot / 子代理</text>

  <path d="M612 344 L600 344 L600 343 L588 343" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="4 3" fill="none"/>
</svg>
