name: verify

# 仓库此前的核心问题不是"测试挂了"，而是没有任何机制会让任何人发现测试挂了：
# 320+ 个 test:* 脚本没有聚合入口、没有 CI，于是"过期常量"（断言 Pi 1.0.0 而实际 1.3.0）
# 与"源码文本断言"可以长期腐烂。本工作流把 test:all 作为门禁接进回路。
#
# 套件分层（scripts/test-all.mjs 的 GUI/NETWORK/DATASET 分类）：
#   - push / PR / 手动 default：两条 verify-* job 只跑 headless default 套件（不含 Electron/GUI）。
#   - 每晚 18:00 UTC（北京 02:00）+ 手动 gui/all：额外跑 verify-windows-gui，
#     在 windows-latest 上执行 `node scripts/test-all.mjs --include-gui`。
#     GUI 用例（真实 Electron 窗口/Tray/桌面自动化）不进无头门禁，但必须有人定期真的跑它们。
#
# pnpm 版本必须是 10+：`overrides`/`allowBuilds` 等配置在 pnpm-workspace.yaml 里，
# pnpm 9 读不到它们，`pnpm install --frozen-lockfile` 会报 LOCKFILE_CONFIG_MISMATCH。
# 12.14.0 与本机开发环境、lockfile 的实际消费方式一致，并与 package.json
# 的 `packageManager` 字段保持同一个值。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每晚 GUI 套件（windows-latest）：GUI 用例不进 push/PR 门禁，但没有定时跑就会重新腐烂。
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "要运行的套件"
        type: choice
        options: [default, gui, all]
        default: default

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 12.14.0

jobs:
  verify-windows:
    # push/PR 与手动 default/all 跑；schedule 只跑 GUI job。
    if: ${{ github.event_name != 'schedule' && (!inputs.suite || inputs.suite == 'default' || inputs.suite == 'all') }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      # setup-node 的 `cache: pnpm` 在 `pnpm store path` 指向不存在的目录时只会记一条
      # "pnpm cache is not found"，然后在 post 阶段以 "Path Validation Error" 把**整条 job
      # 判失败**——即使 245 个用例全绿。先把 store 目录建出来，缓存路径才存在。
      - name: Ensure pnpm store dir exists
        shell: pwsh
        run: |
          $store = (& pnpm store path).Trim()
          New-Item -ItemType Directory -Force -Path $store | Out-Null
          Write-Host "pnpm store: $store"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # MSBuild 仍走 260 字符的旧路径 API。runner 上的
      # D:\a\wavealstra_harness\wavealstra_harness 加上 pnpm 带 patch hash 的
      # node-pty 虚拟目录后，node-addon-api 的 vcxproj 中间文件会超限。
      # 拷到真实短目录 C:\r（不用 junction，避免 Node realpath 又变回长路径）。
      - name: Use a short path for native builds
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\r | Out-Null
          robocopy $env:GITHUB_WORKSPACE C:\r /E /COPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          exit 0

      - name: Install dependencies
        working-directory: C:\r
        run: |
          pnpm config set virtualStoreDirMaxLength 40 --location global
          pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: C:\r
        run: pnpm -s typecheck

      # 若干部件用例直接读 out/main 产物（image-resize-worker.js、out/main/index.js、
      # configurePiCodemodeAssets 的 assets 目录）。CI 从不构建 → 这些用例必然 ENOENT，
      # 那是"门禁缺前置条件"，不是真回归，所以套件之前先构建一次。
      - name: Build out/ (部件用例的前置产物)
        working-directory: C:\r
        run: pnpm -s build

      # Keep this focused real-Electron check separate from the headless suite.
      # It catches settings layout/interaction drift on PRs without running
      # the unrelated desktop automation suite or accessing a real profile.
      - name: Media settings UI (isolated Electron profile)
        working-directory: C:\r
        run: pnpm -s test:media-capabilities-ui

      - name: Upload media settings screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-settings-ui
          if-no-files-found: ignore
          retention-days: 7
          path: C:\r\out\tests\media-capabilities-screenshots\*.png

      - name: Harness quality gate
        working-directory: C:\r
        run: pnpm -s test:harness-quality

      - name: Artifact machine gate
        working-directory: C:\r
        run: pnpm -s test:artifact-gate

      # 棘轮门禁：新增回归 → 失败；scripts/test-baseline.json 中的已知失败
      # 允许通过但会在日志中列出，债务保持可见（避免"上线即全红→被忽略"）。
      - name: Full default suite (headless ratchet gate)
        working-directory: C:\r
        # 2 个并发而不是默认 4：runner 只有 4 vCPU，4 个用例同时 spawn
        # node+esbuild+ACP/网关子进程会互相抢 CPU，把带超时/顺序断言的用例拖成假红
        # （acp-remote 409、slack-gateway 超时、pi-native-core-tools 取消顺序）。
        env:
          TEST_ALL_JOBS: 2
        run: pnpm -s test:all

  verify-linux:
    # 本机开发/发布目标是 Linux（Omarchy/Wayland），必须有一条 Linux 门禁，
    # 否则托盘/密钥库/打包这类平台代码永远只能靠手测。
    # default 套件已不含 GUI 用例（见 scripts/test-all.mjs 的分类）；这里仍保留 xvfb，
    # 用来兜住「某些非 GUI 用例间接拉起 Electron」的现状，GUI 用例由 verify-windows-gui 覆盖。
    if: ${{ github.event_name != 'schedule' && (!inputs.suite || inputs.suite == 'default' || inputs.suite == 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # CI 里以普通用户运行且无 SUID sandbox 环境，禁用 Chromium sandbox。
      ELECTRON_DISABLE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      # 同 verify-windows：store 目录不存在会让 setup-node 的 post 步骤判 job 失败。
      - name: Ensure pnpm store dir exists
        run: |
          store="$(pnpm store path)"
          mkdir -p "$store"
          echo "pnpm store: $store"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux runtime deps for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 \
            || sudo apt-get install -y xvfb libnss3 libgbm1 libasound2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -s typecheck

      # 同 verify-windows：部件用例要读 out/main 产物，套件前先构建。
      - name: Build out/ (部件用例的前置产物)
        run: pnpm -s build

      - name: Harness quality gate
        run: pnpm -s test:harness-quality

      - name: Artifact machine gate
        run: pnpm -s test:artifact-gate

      - name: Full default suite (ratchet gate, headless X)
        # 同 verify-windows：降并发，避免 CPU 争用把超时断言变成假红。
        env:
          TEST_ALL_JOBS: 2
        run: xvfb-run -a pnpm -s test:all

  verify-windows-gui:
    # GUI 套件：默认套件 + GUI 类（真实 Electron 窗口/Tray/桌面自动化），
    # 只在 schedule 或手动 suite=gui/all 时运行；不加 continue-on-error，
    # 失败就是失败 —— GUI 用例的腐烂必须可见。
    # 本地等价命令（需要真实桌面会话）：
    #   node scripts/test-all.mjs --include-gui
    if: ${{ github.event_name == 'schedule' || inputs.suite == 'gui' || inputs.suite == 'all' }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      # 同其他 job：store 目录不存在会让 setup-node 的 post 步骤判 job 失败。
      - name: Ensure pnpm store dir exists
        shell: pwsh
        run: |
          $store = (& pnpm store path).Trim()
          New-Item -ItemType Directory -Force -Path $store | Out-Null
          Write-Host "pnpm store: $store"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Use a short path for native builds
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\r | Out-Null
          robocopy $env:GITHUB_WORKSPACE C:\r /E /COPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          exit 0

      - name: Install dependencies
        working-directory: C:\r
        run: |
          pnpm config set virtualStoreDirMaxLength 40 --location global
          pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: C:\r
        run: pnpm -s typecheck

      # 部分 GUI 用例直接启动 out/main/index.js（consult-entry、startup perf），先构建。
      - name: Build app for GUI tests
        working-directory: C:\r
        run: pnpm -s build

      - name: GUI suite (default + GUI, no ratchet tolerance hiding)
        working-directory: C:\r
        env:
          # GUI 用例自己会拉起 Electron/桌面自动化；runner 只有 4 vCPU，2 路并发时
          # 随机出现「CDP target 30s 超时」「文本层没赶上 800ms」「元素还没渲染」这类
          # 环境假红（同一 commit 每次失败的用例都不同）。GUI job 是夜间批处理，
          # 串行更慢但结果可信。
          TEST_ALL_JOBS: 1
        run: node scripts/test-all.mjs --include-gui

      - name: Upload GUI test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-artifacts
          if-no-files-found: ignore
          retention-days: 7
          path: |
            C:\r\out\tests\**\*.png
            C:\r\out\tests\**\results.json
            C:\r\out\tests\**\desktop.log
            C:\r\out\tests\consult-entry\**\results.json
